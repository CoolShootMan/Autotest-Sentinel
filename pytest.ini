[pytest]
testpaths = test_case/UI/Test_Katana
python_files = test_ui.py
# 注意：--headed 不在这里写死。CI（GitHub Actions ubuntu）没有显示器，headless 才能跑。
# 本地要窗口由根 conftest.py 的 pytest_configure() 自动补 --headed（CI 环境自动跳过，
# 可用 HEADLESS=1 临时关掉）；main.py 自己也会显式传 --headed。
addopts = -vs --tb=line --screenshot="on" --video="on"
norecursedirs = data recordings allure-results allure-report .git .pytest_cache