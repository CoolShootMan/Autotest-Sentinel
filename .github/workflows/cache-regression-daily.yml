name: cache-regression-daily

on:
  schedule:
    # 每天 10:00 北京时间（UTC 02:00）
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  # ── Slack 通知总开关 ──
  # 'true' = 测试跑完后向 Slack 群发送结果摘要。
  # 目标群 Incoming Webhook URL 存于仓库 Secrets：SLACK_WEBHOOK_URL。
  # 若该 secret 未配置，Slack 步骤会因 webhook 为空自动跳过（run 不受影响，仍为绿）。
  SLACK_NOTIFY_ENABLED: 'true'

jobs:
  cache-regression:
    name: cache-regression-daily-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install httpx pytest pytest-asyncio playwright python-dotenv
          # SSR 用例依赖浏览器 console 抓取，需安装 chromium
          playwright install --with-deps chromium

      # 从仓库 Secrets 生成 .env.release，使依赖 curator/admin 凭据的
      # "二次读验证"用例（feature-flag / checkout / buy-now / product-event-list）
      # 在 CI 上真正执行，消除审计"未验证"盲区。
      - name: Prepare .env from secrets
        working-directory: test_case/performance testing/cache-regression
        shell: bash
        run: |
          {
            echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}"
            echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}"
            echo "CURATOR_PASSWORD=${{ secrets.CURATOR_PASSWORD }}"
            echo "PEAR_CLIENT_ID=${{ secrets.PEAR_CLIENT_ID }}"
            echo "PEAR_CLIENT_SECRET=${{ secrets.PEAR_CLIENT_SECRET }}"
          } > .env.release
          echo "=== .env.release generated (keys only) ==="
          sed 's/=.*/=<redacted>/' .env.release

      - name: Run cache-regression tests
        id: run_tests
        working-directory: test_case/performance testing/cache-regression
        shell: bash
        run: |
          set -o pipefail
          pytest -v --tb=short --junitxml=pytest_report.xml 2>&1 | tee pytest_run.log

      - name: Print audit report to job summary
        if: always()
        working-directory: test_case/performance testing/cache-regression
        shell: bash
        run: |
          LATEST=$(find output -name 'get_api_db_audit_*.md' -type f 2>/dev/null | head -1)
          if [ -z "$LATEST" ]; then
            echo "::warning::No GET API DB audit report found in output/"
            exit 0
          fi
          echo "===== GET API DB AUDIT REPORT: ${LATEST} ====="
          cat "${LATEST}"
          echo "===== END OF AUDIT REPORT ====="
          # 渲染到 Actions 页面 Summary（可直接在 run 页面查看，无需下载 artifact）
          {
            echo "# GET API DB Audit Report"
            echo ""
            echo "> 来源: ${LATEST}"
            echo ""
            cat "${LATEST}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test output (audit report)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cache-regression-output
          path: test_case/performance testing/cache-regression/output

      # ===== Slack 通知（Incoming Webhook）=====
      # ⚠️ 当前 SLACK_NOTIFY_ENABLED = 'false'，以下两个发送步骤不会执行（不向任何群发消息）。
      # 旧群 cache-regression-detection-report 已停用，改为需要时指向新群：
      #   在仓库 Secrets 新建 SLACK_WEBHOOK_URL，再把顶部开关改成 'true'。
      # 仅每天 10:00 的 scheduled run 发送；workflow_dispatch 手动调试只在 Actions 页面看结果。
      # 未配置 webhook 时发送步骤自动跳过，不影响测试本身。
      # 结果：成功只发摘要（含违规接口/BE 缺口数 + run 链接）；
      #       失败发失败用例列表 + run 链接，开发可直接点进详情定位。
      - name: Summarize results for Slack
        id: summarize
        if: ${{ always() }}
        working-directory: test_case/performance testing/cache-regression
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, glob, json
          import xml.etree.ElementTree as ET

          # pytest stats from junitxml
          suite = None
          if os.path.exists('pytest_report.xml'):
              try:
                  suite = ET.parse('pytest_report.xml').getroot()
              except ET.ParseError:
                  pass
          if suite is not None:
              tests    = int(suite.get('tests', '0'))
              failures = int(suite.get('failures', '0'))
              errors   = int(suite.get('errors', '0'))
              skipped  = int(suite.get('skipped', '0'))
              passed   = tests - failures - errors - skipped
          else:
              passed = failures = errors = skipped = 0

          # failed cases
          failed_cases = []
          if os.path.exists('pytest_run.log'):
              with open('pytest_run.log', encoding='utf-8', errors='replace') as f:
                  for line in f:
                      m = re.match(r'FAILED\s+(\S+)', line)
                      if m:
                          failed_cases.append(m.group(1))

          # audit report highlights
          violations = be_gaps = unverified = '?'
          reports = sorted(glob.glob('output/get_api_db_audit_*.md'), reverse=True)
          if reports:
              with open(reports[0], encoding='utf-8', errors='replace') as f:
                  text = f.read()
              m = re.search(r'违规接口数（预热后仍读 DB）：(\d+)', text)
              if m: violations = m.group(1)
              m = re.search(r'未验证接口数（无实例二次读取样本）：(\d+)', text)
              unverified = m.group(1) if m else "0"
              m = re.search(r'BE 已知缺口（已确认后端问题，见专章）：(\d+)', text)
              if m: be_gaps = m.group(1)

          ref_name = os.environ.get('GITHUB_REF_NAME', '')
          run_id   = os.environ.get('GITHUB_RUN_ID', '')
          server   = os.environ.get('GITHUB_SERVER_URL', 'https://github.com')
          repo     = os.environ.get('GITHUB_REPOSITORY', '')
          run_url  = f"{server}/{repo}/actions/runs/{run_id}"

          def _build(success):
              icon = '✅' if success else '❌'
              status = '通过' if success else '失败'
              blocks = [
                  {"type": "header", "text": {"type": "plain_text", "text": f"{icon} cache-regression-daily {status}"}},
                  {"type": "section", "fields": [
                      {"type": "mrkdwn", "text": f"*通过*: {passed}" + (f"  *失败*: {failures}" if not success else "")},
                      {"type": "mrkdwn", "text": f"*违规接口*: {violations}"},
                      {"type": "mrkdwn", "text": f"*BE 缺口*: {be_gaps}"},
                      {"type": "mrkdwn", "text": f"*未验证*: {unverified}"},
                  ]},
              ]
              if not success and failed_cases:
                  blocks.append({"type": "section", "text": {"type": "mrkdwn", "text": "*失败用例*:\n" + chr(10).join(failed_cases[:5])}})
              blocks.append({"type": "actions", "elements": [
                  {"type": "button", "text": {"type": "plain_text", "text": "查看完整报告"}, "url": run_url}]})
              return {"text": f"cache-regression {status}", "blocks": blocks}

          json.dump(_build(True), open('slack_payload_success.json', 'w'), ensure_ascii=False)
          json.dump(_build(False), open('slack_payload_failure.json', 'w'), ensure_ascii=False)
          print('[summarize] payloads written')
          PY

      - name: Send Slack notification (success)
        if: ${{ always() && env.SLACK_NOTIFY_ENABLED == 'true' && env.SLACK_WEBHOOK_URL != '' && steps.run_tests.outcome == 'success' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: test_case/performance testing/cache-regression/slack_payload_success.json

      - name: Send Slack notification (failure)
        if: ${{ always() && env.SLACK_NOTIFY_ENABLED == 'true' && env.SLACK_WEBHOOK_URL != '' && steps.run_tests.outcome != 'success' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: test_case/performance testing/cache-regression/slack_payload_failure.json
