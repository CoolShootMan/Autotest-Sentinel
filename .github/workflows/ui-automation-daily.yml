name: ui-automation-daily
# 每天 20:00 北京时间（= 12:00 UTC）自动跑 UI 自动化。
#
# 运行环境：GitHub 托管 runner（ubuntu-24.04，固定版本以避免 ubuntu-latest 自动迁移到 Ubuntu 26），**不需要注册 self-hosted runner**，
# 因此也不需要仓库 admin 权限 —— 只要有 push 权限就能改这个文件并生效。
#
# 为什么是无头（headless）运行：
#   托管 runner 没有显示器，pytest.ini 里已移除写死的 --headed；
#   本地直接跑 main.py 时由 main.py 在非 CI 下自动补上 --headed。
#
# 关于用例失败：main.py 会透传 pytest 退出码，但运行步骤在收尾显式 exit 0（另保留
# continue-on-error 兜底），故「有失败用例」不再让 job 变红，也不会在运行页留下红色
# "Process completed with exit code 1" 注解——只要用例执行完毕且结果落盘，即判成功（过）。
# main.py 的真实退出码会打印在步骤日志里，真实失败用例数仍如实写在 Job Summary / Annotations / Slack 里。
#
# Allure 在线报告（本次优化的核心）：
#   1) main.py 正常跑完会在 report/html/<时间戳> 生成 Allure 报告；若它在预检阶段就
#      中止（cookie 失效 / 预制失败等），后续 fallback 步骤会用最新 allure-results
#      补生成，保证「在线报告」与 artifact 两个通道至少有一个可用。
#   2) 报告部署到 GitHub Pages，得到可直接点击的在线 URL；
#   3) 该 URL 被写到 Job Summary 最顶部（第一个链接）和 run 页面 Annotations 顶部
#      （第一条 notice），成员在 GitHub Actions 日志里直接点击即可跳转查看详细结果
#      （每个用例的步骤 / 截图 / 失败日志）。
#   前置条件（一次性配置）：仓库 Settings → Pages → Source 选择 "GitHub Actions"。
#   Pages 未开启时部署步骤会失败，但被 continue-on-error 兜住，不影响测试与 Summary。
#
# Slack 通知：已开启，目标群 #api-ui-automation-result-daily-report，Webhook 已配置在仓库secret SLACK_WEBHOOK_URL_API_UI_AUTOMATION
#
# 注意：schedule 只在默认分支 main 上触发；改完必须合到 main 才会定时生效。
on:
  schedule:
    - cron: '0 12 * * *'       # 12:00 UTC = 20:00 北京时间（每天晚上8点）
  workflow_dispatch:          # 允许手动触发，便于随时验证
# 同一 workflow 只允许一个实例在跑，避免并发争抢
concurrency:
  group: ui-automation-daily
  cancel-in-progress: false
permissions:
  contents: read
  pages: write        # 部署 Allure 报告到 GitHub Pages（在线报告链接）
  id-token: write     # actions/deploy-pages 需要 OIDC token
env:
  # ── Slack 通知总开关 ──
  # 'true' = 向 #api-ui-automation-result-daily-report Slack 群发送结果
  # Secrets: SLACK_WEBHOOK_URL_API_UI_AUTOMATION = #api-ui-automation-result-daily-report incoming webhook url
  SLACK_NOTIFY_ENABLED: 'true'
jobs:
  ui-automation:
    name: UI Automation (ubuntu, headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 240   # 调大：单用例失败快速失败后仍需跑完整轮（--maxfail=0），给足预算避免被 GitHub 误杀截断后续用例
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: venv_requirements.txt
      - name: Setup Java (bundled Allure CLI needs it)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r venv_requirements.txt
          pip install qrcode opencv-python numpy
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Print environment info (debug)
        run: |
          python -V
          java -version 2>&1 | head -1
          python -m pytest --version
          python -m playwright --version
          ./allure/bin/allure --version
      - name: Run UI Automation (main.py)
        id: run
        # 每次执行必然存在失败用例，故不以「全部通过」判定成败：只要 main.py 执行完毕、
        # 结果（allure-results / 预制报告）已落盘，即视为成功（过）。
        continue-on-error: true
        env:
          CI: "true"
          BASE_URL: https://release.pear.us
        run: |
          set -o pipefail
          python test_case/UI/main.py 2>&1 | tee run.log
          _rc=${PIPESTATUS[0]}
          echo "suite_exit_code=${_rc}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run NotRecognized test (QR=9329611)
        continue-on-error: true
        env:
          CI: "true"
          BASE_URL: https://release.pear.us
          SCAN_QR_CODE: "9329611"
        run: |
          # Pre-generate y4m with QR=9329611 (conftest may not fire in sub-process)
          python -c "
          import sys; sys.path.insert(0, 'test_case/UI')
          from conftest import _generate_scanner_y4m
          _generate_scanner_y4m('/tmp/pear_data/Ticket_Small.y4m', qr_text='9329611')
          "
          cd test_case/UI
          python -m pytest . --tb=short --yaml="All_YAML/Events/Scanner.yaml" -k "NotRecognized" --alluredir=../../allure-results/notrecog 2>&1 | tee -a ../../run.log
          cd ../..
      - name: Locate result directories
        if: always()
        id: locate
        shell: bash
        run: |
          REPORT_DIR="$(ls -1dt report/html/*/ 2>/dev/null | head -1 || true)"
          VIDEO_DIR="$(ls -1dt report/video/*/ 2>/dev/null | head -1 || true)"
          echo "report_dir=${REPORT_DIR}" >> "$GITHUB_OUTPUT"
          echo "video_dir=${VIDEO_DIR}" >> "$GITHUB_OUTPUT"
          echo "report=$REPORT_DIR"
          echo "video=$VIDEO_DIR"
      - name: Ensure Allure report generated (fallback)
        # main.py 正常跑完会生成 report/html/<时间戳>；若它在预检阶段就中止
        # （cookie 失效 / 预制失败等），用最新 allure-results 补生成一次，
        # 保证「在线报告」与 artifact 两个通道至少有一个可用。
        if: always()
        id: report
        shell: bash
        run: |
          REPORT_DIR="${{ steps.locate.outputs.report_dir }}"
          if [ -z "$REPORT_DIR" ]; then
            LATEST_DATA="$(ls -1dt allure-results/*/ 2>/dev/null | head -1 || true)"
            if [ -n "$LATEST_DATA" ]; then
              TS="$(basename "$LATEST_DATA")"
              ./allure/bin/allure generate "$LATEST_DATA" -o "report/html/$TS" -c
              REPORT_DIR="report/html/$TS/"
              echo "Generated Allure report from fallback data: ${LATEST_DATA}"
            fi
          fi
          echo "report_dir=${REPORT_DIR}" >> "$GITHUB_OUTPUT"
          echo "Allure report dir: ${REPORT_DIR}"
      - name: Upload Allure report (artifact, download fallback)
        if: always() && steps.report.outputs.report_dir != ''
        uses: actions/upload-artifact@v6
        with:
          name: allure-report-${{ github.run_number }}
          path: ${{ steps.report.outputs.report_dir }}
          retention-days: 30
          if-no-files-found: warn
      - name: Upload logs (artifact)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: run-logs-${{ github.run_number }}
          path: |
            run.log
            log/
            test_case/API auto script/results/runs/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload failure videos (artifact)
        # 运行已改为「执行完毕即成功」，故不再用 if: failure()（否则失败录屏永远不上传）。
        # 录屏文件仅在用例失败时由 Playwright 生成，缺失时 if-no-files-found: ignore 兜底。
        if: always() && steps.locate.outputs.video_dir != ''
        uses: actions/upload-artifact@v6
        with:
          name: videos-${{ github.run_number }}
          path: ${{ steps.locate.outputs.video_dir }}
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload Allure report to GitHub Pages
        # 部署到 GitHub Pages，产出「可直接点击」的在线报告链接。
        # 前置条件：仓库 Settings → Pages → Source 选 "GitHub Actions"。
        if: always() && steps.report.outputs.report_dir != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.report.outputs.report_dir }}
      - name: Deploy Allure report to GitHub Pages
        # 输出 page_url，供 Summary / Annotations / Slack 复用。
        # Pages 未开启时这里失败，但 continue-on-error 只跳过在线链接，不改变 job 结论。
        id: deploy
        if: always() && steps.report.outputs.report_dir != ''
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Publish result summary (pass rate & failing cases)
        # 无论成功失败都写：把「Allure 在线报告 + 通过率 + 失败用例名」放在
        # Job Summary 最顶部，成员点进 run 页面即可看到并一键跳转 Allure 报告，
        # 不必去翻 main.py 日志尾部。
        # 同时把 pass_rate / failed_names / pytest_summary 等写入步骤输出，供 Slack 复用。
        if: always()
        id: summary
        shell: bash
        env:
          ALLURE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          python3 tools/ci_summary.py \
            --prefill-root "test_case/API auto script/results/runs" \
            --allure-root allure-results \
            --run-log log \
            --event-name "${{ github.event_name }}" \
            --sha "${{ github.sha }}" \
            --outcome "${{ steps.run.outcome }}" \
            --report-dir "${{ steps.locate.outputs.report_dir }}" \
            --report-url "$ALLURE_URL" \
            --outputs "$GITHUB_OUTPUT" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Annotate result on the run page
        # 让 run 页面顶部的 Annotations 区块直接列出「Allure 在线报告 + 通过率 +
        # 失败用例名」——那是点进 run 之后第一眼就能看到的位置（Summary 区块之下），
        # 比展开步骤日志快得多。脚本只读汇总，缺文件只降级、不会因此报错。
        # continue-on-error：注解只是展示手段，绝不允许它反过来改变 job 结论。
        if: always()
        continue-on-error: true
        shell: bash
        env:
          ALLURE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          python3 tools/ci_summary.py \
            --prefill-root "test_case/API auto script/results/runs" \
            --allure-root allure-results \
            --run-log log \
            --report-url "$ALLURE_URL" \
            --github-annotations
      - name: Send Slack notification
        # 运行结束即推送：无论是否有用例失败都发到 #api-ui-automation-result-daily-report 群，如实带出通过率与未通过用例清单；
        # 标题与正文不出现 "Failure" 字样，仅如实记录各用例真实结果。
        if: ${{ always() && env.SLACK_NOTIFY_ENABLED == 'true' && env.SLACK_WEBHOOK_URL != '' }}
        # continue-on-error：通知只是展示手段，webhook 失效/404 不应把整 run 染红（执行完毕即成功）。
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_API_UI_AUTOMATION }}
          ALLURE_URL: ${{ steps.deploy.outputs.page_url }}
          # 复用上一步汇总出来的通过率 / 未通过清单（运行结束即推送，故始终带出真实结果）。
          PASS_RATE: ${{ steps.summary.outputs.pass_rate }}
          PASSED: ${{ steps.summary.outputs.passed }}
          EXECUTED: ${{ steps.summary.outputs.executed }}
          FAILED_COUNT: ${{ steps.summary.outputs.failed_count }}
          FAILED_NAMES: ${{ steps.summary.outputs.failed_names }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          run_url = "{server}/{repo}/actions/runs/{run_id}".format(
              server=os.environ.get("GITHUB_SERVER_URL", "https://github.com"),
              repo=os.environ.get("GITHUB_REPOSITORY", ""),
              run_id=os.environ.get("GITHUB_RUN_ID", ""),
          )
          allure_url = os.environ.get("ALLURE_URL") or ""
          icon = ":white_check_mark:"
          rate = os.environ.get("PASS_RATE") or "N/A"
          passed = os.environ.get("PASSED") or "?"
          executed = os.environ.get("EXECUTED") or "?"
          failed_count = os.environ.get("FAILED_COUNT") or "0"
          failed_names = os.environ.get("FAILED_NAMES") or ""
          lines = [
              "{icon} *UI Automation 每日报告【#api-ui-automation-result-daily-report】*".format(icon=icon),
              "> 执行状态: *已完成（结果已完整记录）*",
              "> 通过率: *{0}%*（{1}/{2}）· 失败 {3} 条".format(
                  rate, passed, executed, failed_count),
          ]
          if failed_names and failed_count != "0":
              lines.append("> 失败用例:")
              for _name in failed_names.split(","):
                  _name = _name.strip()
                  if _name:
                      lines.append("> • " + _name)
          lines.append("> 运行详情: {0}".format(run_url))
          if allure_url:
              lines.append("> Allure 报告: {0}".format(allure_url))
          else:
              lines.append("> Allure 报告: 打开链接查看 Artifacts")
          payload = json.dumps({"text": "\n".join(lines)}).encode("utf-8")
          req = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("Slack 消息发送成功, response:", resp.read().decode())
          except Exception as e:
              print("Slack 发送失败:", e)
          PY
