                  }
                  if (!ctrl.disabled) {
                    throw new Error('"Recommend at checkout" control is ENABLED — it must be DISABLED for AXS ticket ("' + pname + '")');
                  }
                  return 'OK: "Recommend at checkout" <' + ctrl.tagName + '> is DISABLED for "' + pname + '" (expandedNeeded=' + expandedNeeded + ')';
                }
            save_as: "recommend_disabled_axs_result"

        # 20. Capture evidence screenshot of the expanded Advanced settings panel (AXS product).
        screenshot_axs: { name: "recommend_at_checkout_verify_axs" }

        # ----------------------------------------------------------------------
        # Third pass: the TDC product (driven by cross-case globals event_tdc /
        # ticket_tdc, seeded by tdc_fee_breakdown_ui.yaml in the same pytest run).
        # ----------------------------------------------------------------------

        # 21. Close the Customize products dialog via its top-right "X" button.
        R_click_close_customize_dialog_tdc: { locator: "div[role='dialog'] >> button[aria-label='Close']", timeout: 8000 }
        sleep_after_dialog_close_tdc: 2000

        # 22. Close the event-detail / Post view via the top-left back button,
        #     returning to the events list page (where the global search box lives).
        R_click_close_event_detail_tdc: { locator: "button[aria-label='Back']", timeout: 8000 }
        sleep_after_back_tdc: 2500

        # 23. On the events list, type {{event_tdc}} into the search box and submit.
        #     (smart_fill does NOT template {{var}}, so we drive the input via JS.)
        execute_js_search_event_tdc:
            script: |
                async () => {
                  const ev = "{{event_tdc}}";
                  if (ev.indexOf('{{') !== -1) {
                    throw new Error('Cross-case global "event_tdc" is not set — run tdc_fee_breakdown_ui.yaml first in the same pytest process');
                  }
