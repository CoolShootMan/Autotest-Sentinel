# --- testT5639_venue_map: check the recommended at checkout is disabled for AXS/TDC/Venue map ticket ---
testT5639:
    description: "Verify checkbox of recommended at checkout is disabled for AXS/TDC/Venue map ticket"
    test_step:
        # 1. Go to the event list page
        open: "{BASE_URL}/events"
        sleep_list: 5000

        # 2. Search for the event named "event-for-ui-auto-venue-map" and open it.
        R_click_venue_map_event: { locator: "xpath=//*[normalize-space(.)='event-for-ui-auto-venue-map']", index: 0, fallback_scan: true }
        sleep_event: 5000

        # 3. Event detail page -> Post tab
        R_click_post_tab: { role: "tab", name: "Post" }
        sleep_post_tab: 3000

        # 4. Post view -> Selling sub-tab (sits next to the Content tab)
        R_click_selling_tab: { role: "tab", name: "Selling", exact: true }
        sleep_selling_tab: 2000

        # 5. Selling tab -> "Customize" button (opens the Customize products dialog)
        R_click_customize: { role: "button", name: "Customize" }
        sleep_customize: 3000

        # 6. Isolate the venue-map product on the Customize products page by its name
        #    (best-effort search; ensures the visible Advanced-settings click in 7 hits the
        #     correct card when the post lists multiple products).
        execute_js_isolate_product:
            script: |
                async () => {
                  const pname = "{{ticket_venue_map}}";
                  if (pname.indexOf('{{') !== -1) {
                    throw new Error('Cross-case global "ticket_venue_map" is not set — run venue_map_fee_breakdown_ui.yaml first in the same pytest process');
                  }
                  const inp = document.querySelector('input[placeholder="Search product"]');
                  if (!inp) return 'no-search-box';
                  const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
                  setter.call(inp, pname);
                  inp.dispatchEvent(new Event('input', { bubbles: true }));
                  inp.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
                  inp.dispatchEvent(new KeyboardEvent('keypress', { key: 'Enter', bubbles: true }));
                  inp.dispatchEvent(new KeyboardEvent('keyup', { key: 'Enter', bubbles: true }));
                  await new Promise(r => setTimeout(r, 1500));
                  return 'searched:' + pname;
                }
            save_as: "isolate_result"

        # 7. VISIBLY click the product's "Advanced settings" to expand its options.
        R_click_advanced_settings: { locator: "div[role='dialog'] >> text=Advanced settings", optional: true, timeout: 5000 }
        sleep_adv: 1500

        # 8. Locate the product by {{ticket_venue_map}}, ensure its Advanced settings is expanded, and assert the "Recommend at checkout" checkbox/switch is DISABLED.
        execute_js_verify_recommend_disabled:
            script: |
                async () => {
                  const pname = "{{ticket_venue_map}}";
                  // Guard: if the cross-case global was never seeded, the placeholder stays
                  // literal — fail fast with a clear message instead of a confusing lookup error.
                  if (pname.indexOf('{{') !== -1) {
                    throw new Error('Cross-case global "ticket_venue_map" is not set — run venue_map_fee_breakdown_ui.yaml first in the same pytest process');
                  }
                  const dlg = document.querySelector('[role="dialog"]') || document;

                  // 3.4.1 Locate the product card by its name (title leaf containing pname)
                  const nameLeaves = [...dlg.querySelectorAll('*')].filter(
                    e => e.children.length === 0 && e.textContent.trim().includes(pname)
                  );
                  if (nameLeaves.length === 0) {
                    throw new Error('Product "' + pname + '" not found on the Customize products page');
                  }

                  // Card = nearest ancestor of the title leaf that also contains an "Advanced settings" control
                  const cardOf = (el) => {
                    let n = el;
                    for (let i = 0; i < 12 && n; i++) {
                      if ([...n.querySelectorAll('*')].some(c => /advanced settings/i.test(c.textContent))) return n;
                      n = n.parentElement;
                    }
                    return el;
                  };
                  const chosen = nameLeaves.find(l => cardOf(l) !== l) || nameLeaves[0];
                  const card = cardOf(chosen);

                  // 3.4.2 Find the "Recommend at checkout" label within THIS product card
                  const recLeaves = () => [...card.querySelectorAll('*')].filter(
                    e => e.children.length === 0 && /recommend at checkout/i.test(e.textContent)
                  );
                  let rl = recLeaves();
                  let expandedNeeded = false;
                  if (rl.length === 0) {
                    // Advanced settings collapsed for this product -> expand it
                    expandedNeeded = true;
                    const adv = [...card.querySelectorAll('button, div, span')].find(
                      e => /advanced settings/i.test(e.textContent)
                    );
                    if (adv) adv.click();
                    await new Promise(r => setTimeout(r, 1000));
                    rl = recLeaves();
                  }
                  if (rl.length === 0) {
                    throw new Error('"Recommend at checkout" not found for product "' + pname + '"');
                  }

                  // 3.4.3 From the label, walk up to the nearest ancestor that holds the control
                  let ctrl = null;
                  for (const label of rl) {
                    let el = label.parentElement;
                    for (let i = 0; i < 6 && el; i++) {
                      const c = el.querySelector(
                        'input[type="checkbox"], input[type="radio"], [role="checkbox"], ' +
                        '[role="switch"], button[role="switch"], input[role="switch"]'
                      );
                      if (c) { ctrl = c; break; }
                      el = el.parentElement;
                    }
                    if (ctrl) break;
                  }
                  if (!ctrl) {
                    throw new Error('"Recommend at checkout" control (checkbox/switch) not found for product "' + pname + '"');
                  }
                  if (!ctrl.disabled) {
                    throw new Error('"Recommend at checkout" control is ENABLED — it must be DISABLED for AXS/TDC/Venue map ticket ("' + pname + '")');
                  }
                  return 'OK: "Recommend at checkout" <' + ctrl.tagName + '> is DISABLED for "' + pname + '" (expandedNeeded=' + expandedNeeded + ')';
                }
            save_as: "recommend_disabled_result"

        # 9. Capture evidence screenshot of the expanded Advanced settings panel
