        # shop. Once it is (either resold by a previous run, or pushed automatically when the owner added
        # this co-seller via T3991's "Add to co-seller Pear Shops" flow), the button is replaced by a
        # "Find in my shop" link (href="/autotest-coseller") — verified in the failing run's DOM capture,
        # which contained NO add-style button at all. The whole resell chain is therefore optional; the
        # real guard is `R_click_resold_post` + `verify_note_content` below, which still fail loudly if
        # the post is genuinely missing from the co-seller's shop.
        R_click_add_to_shop: { locator: "button:has-text('Add to shop')", timeout: 8000, optional: true }
        sleep_step: 3000

        # Handle onboarding modal: check "Do not show me this again" and click "Customize Now"
        check_do_not_show: { locator: "input[name='display']", optional: true }
        sleep_step: 500
        R_click_customize_now: { locator: "span:has-text('Customize Now')", optional: true, timeout: 5000 }
        sleep_step: 3000

        # Click Publish button to publish the resold post (first click may open confirmation dialog)
        # Using smart_click_retry: element exists for sure, but click may be unstable (animation overlay etc.), needs retry
        # smart_click_retry_publish_resold: { role: 'button', name: 'Publish', timeout: 5000, retry: 3, delay: 500 }
        # sleep_step: 2000

        # # Second click on Publish confirmation dialog (modal button)
        # # Confirm popup appears with delay, increase wait time and retry count; only 1 Publish in popup, use index: 0
        # smart_click_retry_publish_confirm: { role: 'button', name: 'Publish', index: 0, timeout: 8000, retry: 6, delay: 800 }
        # sleep_step: 1000


        # Handle optional success dialog after publishing: check "Do not show me this again" and click Save
        # check_do_not_show_gotit: { locator: "input[name='display']", optional: true }
        # sleep_step: 500
        # R_click_customize_now: { locator: "span:has-text('Customize Now')", optional: true, timeout: 5000 }
        # sleep_step: 3000

        # # Click Publish button to publish the resold post (first click may open confirmation dialog)
        # # 使用 smart_click_retry: 元素一定存在，但点击可能不稳定（动画遮罩等），需要重试
        # smart_click_retry_publish_resold: { role: 'button', name: 'Publish', timeout: 5000, retry: 3, delay: 500 }
        # sleep_step: 2000

        # # Second click on Publish confirmation dialog (modal button)
        # # 确认弹框出现有延迟，增加等待时间和重试次数；弹框里只有1个Publish，用index: 0
        # smart_click_retry_publish_confirm: { role: 'button', name: 'Publish', index: 0, timeout: 8000, retry: 6, delay: 800 }
        # sleep_step: 1000


        # # Handle optional "Got it" dialog after publishing: check "Do not show me this again" and click Got it
        # # check_do_not_show_gotit: { locator: "input[name='display']", optional: true }
        # # sleep_step: 500
        # R_click_got_it: { role: 'button', name: 'Got it', optional: true, timeout: 3000 }
        # sleep_step: 2000

        # [Idempotency 2026-09-01] This Save belongs to the "Customize Now" dialog opened by the resell
        # flow above. When the post is already in the co-seller's shop that dialog never opens, so Save
        # must be optional too.
        click_save_btn: { role: 'button', name: 'Save', optional: true }


        # Wait for toast message "Post published and added to your shop."
        # wait_toast_publish: { message: "Adding posts to selected co-seller shops. This may take a few seconds. Click Refresh to see the latest progress.", timeout: 10000 }
        sleep_step: 3000

        # =========================================================================
        # T3686: Verify Order confirmation note is inherited and non-editable in Coseller's Post
        # =========================================================================

        # Step 3.1: Navigate to Coseller's shop page
        open_coseller_shop: "{BASE_URL}/autotest-coseller"
        sleep_step: 3000

        # [UI drift 2026-09-01] The co-seller's OWN shop root now renders the storefront EDITOR
        # (Storefront / Add / Preview / Customize / Rearrange sections / My content); resold posts are no
        # longer listed on it, so `text=event-for-ui-auto-venue-map` was never found there. Posts now live
