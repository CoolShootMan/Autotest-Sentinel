        sleep_step: 500
        fill_phone: { role: "textbox", name: "Phone number", value: '+1 (650) 900-6646' }
        sleep_step: 500
        fill_email: { locator: 'input[name="contact.email"]', value: 'linda.zhou.ext+10@1m.app' }
        sleep_step: 500

        # Step 6: Place order — the 100% coupon usually makes the total Free (Stripe fields
