testT3767:
#Auth: Linda Zhou
    guest: true
    description: "Verify auto-applied coupon 'autotest3779' applies at guest checkout (venue-map post)"
    test_step:
        # Step 1: [2026-10-10 user fix] ALL venue-map cases use the designated post
        # event-for-ui-auto-venue-map — T3779 creates the coupon THERE (Selling → Coupons),
        # yet this case still opened the old "verify-auto-coupon-apply" post copied from
        # Post_setting.yaml. Rewritten to the GA01 seat flow on the designated post.
        open: "{BASE_URL}/autotestshop/post/event-for-ui-auto-venue-map"
