        wait_select_dialog_loaded: { text: "Please select tables in the map", timeout: 20000 }
        # [2026-10-10] Seat = SVG circle[data-id] (the sibling transparent rect sits below and
        # is intercepted). SOLD seats render stroke="transparent" — :not() picks the first
