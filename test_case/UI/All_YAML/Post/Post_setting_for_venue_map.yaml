# ==============================================================================
# Post_setting_for_venue_map.yaml - venue-map post C-side (guest) purchase suite
#
# Scope (2026-10-10): ONLY cases exercising the venue-map seat-selection
# purchase flow, plus their partner-side preconditions and teardowns:
#   T3683/T3684 order note -> T3686 coseller resell -> T2515 purchase limit ->
#   T4955 access code -> T3779/T3767 auto coupon.
# Generic post-setting cases (commission, co-seller note, variant visibility,
# post hiding, redirect URL, announcements, CTA type, duplicate post, phone
# access, customize pricing, event/product sync, RTE widgets) do not involve
# the seat map and live in Post_setting.yaml - removed from this file.
# ==============================================================================




# ==============================================================================
# Test Case: T3683 & T3684
# T3683: Verify the user can edit order confirmation note for original post
# T3684: Verify the order confirmation note is displayed on order placed page
#
# Step description:
# 1. Open Events -> click Auto-Test-post-setting -> click Get Tickets -> enter Post edit page
# 2. T3683: Switch to Settings tab, enable "Order confirmation note" toggle, input note, save
# 3. T3684: Add to cart, checkout, place order
#           Verify confirmation note displayed on order placed page and order details page
#
# Expected result:
# 1. T3683: On Settings tab, "Order confirmation note" toggle default is OFF
#           After enabling: input box shows placeholder "e.g., Event time, location, or special instructions for buyers"
#           Max length 2000, saved successfully with toast
# 2. T3684: Confirmation note displayed below order details on order placed page
#           Confirmation note displayed below order instruction on order details page
# ==============================================================================


testT3683_T3684:
#Auth: Linda Zhou
    description: "Verify Order Confirmation Note - Edit in Settings Tab and Verify Display on Order Page"
    test_step:
        # Step 1: Events list page -> click Event card
        open: "{BASE_URL}/events"
        sleep_step: 5000

        # "Auto-Test-post-setting" is a DIV element (not BUTTON), use exact text match
        R_click_my_event: { locator: "text=event-for-UI-auto-venue-map", exact: true, index: 0 }
        sleep_step: 4000

        # Step 1.1: Click Posts tab to ensure post cards are visible
        R_click_posts_tab: { role: "tab", name: "Post" }
        sleep_step: 2000

        # Step 2: Event detail page -> click Post card (link text)
        # [UI drift 2026-08-31] "View post" button removed (Post tab shows post directly)
        sleep_step: 3000

        # Step 3: Post edit page -> switch to Settings tab
        R_click_settings_card: { role: 'button', name: 'Settings' }
        sleep_step: 1500

        # T3683 Step 1: Wait for Settings tab to load
        wait_advanced_loaded: { role: 'button', name: 'Settings', timeout: 8000 }
        sleep_step: 1000


        # T3683 Step 2: Click toggle to enable Order confirmation note (only when OFF -> ON)
        R_click_order_note_toggle: { locator: 'input[name="isOrderConfirmationNoteEnabled"]', skip_if_checked: true }
        sleep_step: 1000

        # T3683 Step 3: Verify toggle is enabled (input box appears)
        # Note: Use smart_wait to verify label exists (instead of verify_text_visible)
        wait_order_note_label: { text: "Order confirmation note", timeout: 8000 }
        # [UI drift 2026-10-10 venue_map] Order confirmation note renders as a TEXTAREA
        # (not input), so smart_fill's placeholder fallback (input only) misses it. Use name locator.
        fill_order_note: { locator: 'textarea[name="orderConfirmationNote"]', value: 'Test Note - Concert at 7PM, Venue: Test Arena, Please bring ID' }
        sleep_step: 500

        # T3683 Step 4: Save (skip if already saved, button disabled)
        R_click_save: { role: 'button', name: 'Save', skip_if_disabled: true }
        wait_toast_save: { message: "Post settings updated", timeout: 15000, optional: true }

        # Step 5: Close Post edit drawer, return to Event detail page
        R_click_close_drawer: { locator: '[data-testid="CloseIcon"]', optional: true, disable_ai: true }
        sleep_step: 2000

        # T3684: Guest checkout to verify confirmation note display
        # Step 5.1: Log out from Curator account
        open_account: "{BASE_URL}/account"
        sleep_step: 3000

        R_click_logout: { role: 'button', name: 'Log out' }
        sleep_step: 3000

        # Step 6: Directly access Post page for Guest ticket purchase
        open_post: "{BASE_URL}/autotestshop/post/event-for-ui-auto-venue-map"
        sleep_step: 3000

        # Step 7: Select product "General Admission 01", click its Buy Ticket button
        # [2026-10-10 r5 ROOT CAUSE] near_text:"General Admission 01" + name:'Buy Ticket'
        # actually clicked the FIRST product card ("General Admission", $0.00) — every card
        # owns a "Buy Ticket" button, and that product's seat dialog opens a 5/7/9-people
        # quantity tooltip (never "1 table selected"), so Buy now never renders. The GA01
        # card button's accessible name contains "General Admission 01" (other cards don't),
        # so role+name substring pins the right card (verified in live browser).
        R_click_buy_ticket_ga01: { role: 'button', name: 'General Admission 01', index: 0 }
        # [2026-10-10] DO NOT rely on sleep_step here: duplicate `sleep_step` keys inside one
        # test_step mapping collapse into a single entry (last value wins, first position kept,
        # MEMORY rule 4) — every per-step sleep in this case is silently dropped. Use distinct
        # wait_* (smart_wait) keys for timing instead.
        # Wait until the seat map finished loading (instruction text renders after the
        # progressbar); clicking earlier lands on a pre-render map and selection never registers.
        wait_select_dialog_loaded: { text: "Please select tables in the map", timeout: 20000 }
        # [UI drift 2026-10-10 venue_map] Seat = SVG circle[data-id]; its sibling transparent
        # rect[data-id] sits below the circle and intercepts the click (r4 log: "circle
        # intercepts pointer events"). SOLD seats render stroke="transparent" (invisible) while
        # available seats keep a colored stroke (#CD254A GA01 / #E9803D GA02), so
        # :not([stroke="transparent"]) = "first AVAILABLE seat" — self-healing as earlier runs
        # sell seats (index-based nth(2) broke the moment its seat sold in r7). Fails loudly
        # only when every seat of this product is sold out (= time to reset test data).
        R_click_select_table: { locator: '[role="dialog"] circle[data-id]:not([stroke="transparent"])', index: 0 }
        # Loud gate: right panel must flip from "No tables selected" to "1 table selected".
        # Prevents a silent no-selection from cascading into Buy-now/Continue failures.
        wait_table_selected: { text: "table selected", timeout: 8000 }
        # Required (not optional): "Buy now" only renders after a successful seat selection.
        R_click_buy_now: { role: 'button', name: 'Buy now', timeout: 10000 }

        # Step 7: [2026-10-10] checkout now lands directly on /checkout?postId=... (no
        # Continue button — screenshot-verified); optional keeps this working on both layouts.
        R_click_continue: { role: 'button', name: 'Continue', optional: true }
        sleep_step: 2000

        # Step 8: Fill Contact info
        fill_first_name: { locator: 'input[name="contact.firstName"]', value: 'auto' }
        sleep_step: 500

        fill_last_name: { locator: 'input[name="contact.lastName"]', value: 'Guest' }


        sleep_step: 500

        fill_phone: { locator: 'input[name="contact.phoneNumber"]', value: '+1 6502396646' }
        sleep_step: 500

        fill_email: { locator: 'input[name="contact.email"]', value: 'linda.zhou.ext+10@1m.app' }
        sleep_step: 500

        # Step 8.5: Fill Credit Card information (Stripe iframe)
        fill_stripe_iframe:
            card_number: '4242424242424242'
            expiry: '02/45'
            cvc: '345'
            card_name: 'linda 4650'
            zipcode: '90021'
        sleep_step: 1000

        # Step 10: Place Order
        R_click_place_order: { role: 'button', name: 'Place order', optional: true }
        # [2026-10-10] if a leftover auto-coupon (autotest3779) made the order FREE, the CTA
        # becomes "RSVP" instead — fallback click keeps the run alive.
        R_click_place_order_rsvp_fallback: { role: 'button', name: 'RSVP', optional: true }
        sleep_step: 5000

        # Wait for order confirmation page to load ("Access Your Order" button appears)
        wait_for_access_order_button: { role: 'button', name: 'Access Your Order', timeout: 20000 }
        sleep_step: 2000

        # T3684 Expected: Verify confirmation note is displayed (no manual scroll needed, wait_for will auto-wait for visibility)
        verify_note_on_order_placed: { text: 'Test Note - Concert at 7PM, Venue: Test Arena, Please bring ID' }
        sleep_end: 3000

    expect_result:
        assertions:
            # ===== T3684: Order Confirmation - Additional Details =====
            # These assertions run after all test steps complete, when on Order Placed page
            - assertion_type: "element_visible_by_text"
              text: "Test Note - Concert at 7PM, Venue: Test Arena, Please bring ID"


# ==============================================================================
# Test Case: T3686
# T3686: Verify the order confirmation note is displayed on order placed page when purchased through Coseller's shop
#
# Step description:
# 1. Coseller logs into Pear.us and navigates to the original Post
# 2. Click "Add to shop" to resell the Post (with is_coseller: true)
# 3. Navigate to the Coseller's resold Post page
# 4. Guest adds to cart, checkout, place order
# 5. Verify confirmation note displayed on order placed page
#
# Expected result:
# 1. Coseller can successfully resell the Post via "Add to shop"
# 2. Order Confirmation Note displayed below order details on order placed page
#    (same note content as set by Curator on the original Post)
# ==============================================================================

testT3686_CosellerResell:
#Auth: Linda Zhou
    is_coseller: true
    # Deferred: seat-map purchase needs a logged-in +997 buyer; this flow logs out to
    # guest (and owner-via-coseller-link blocked), so the seat table can't be selected.
    description: "Verify Order Confirmation Note is displayed when purchasing through Coseller's resold Post"
    test_step:

        # T3686 Step 1 2: Navigate to original Post and click "Add to shop" to resell
        open_post: 
          url: "{BASE_URL}/autotestshop/post/event-for-ui-auto-venue-map"
          # cookie_file: 'test_case/UI/cookie_{ENV}_co_seller.json"'
        sleep_step: 5000

        # Refresh page to ensure latest state
        reload_page: {}
        sleep_step: 2000
        
        # Click "Add to shop" button to resell the Post (is_coseller: true)
        # [Idempotency 2026-09-01] "Add to shop" only renders when the post is NOT yet in the co-seller's
        # shop. Once it is (either resold by a previous run, or pushed automatically when the owner added
        # this co-seller via T3991's "Add to co-seller Pear Shops" flow), the button is replaced by a
        # "Find in my shop" link (href="/autotest-coseller") — verified in the failing run's DOM capture,
        # which contained NO add-style button at all. The whole resell chain is therefore optional; the
        # real guard is `R_click_resold_post` + `verify_note_content` below, which still fail loudly if
        # the post is genuinely missing from the co-seller's shop.
        R_click_add_to_shop: { locator: "button:has-text('Add to shop')", timeout: 8000, optional: true }
        sleep_step: 3000

        # Handle onboarding modal: check "Do not show me this again" and click "Customize Now"
        check_do_not_show: { locator: "input[name='display']", optional: true }
        sleep_step: 500
        R_click_customize_now: { locator: "span:has-text('Customize Now')", optional: true, timeout: 5000 }
        sleep_step: 3000

        # Click Publish button to publish the resold post (first click may open confirmation dialog)
        # Using smart_click_retry: element exists for sure, but click may be unstable (animation overlay etc.), needs retry
        # smart_click_retry_publish_resold: { role: 'button', name: 'Publish', timeout: 5000, retry: 3, delay: 500 }
        # sleep_step: 2000

        # # Second click on Publish confirmation dialog (modal button)
        # # Confirm popup appears with delay, increase wait time and retry count; only 1 Publish in popup, use index: 0
        # smart_click_retry_publish_confirm: { role: 'button', name: 'Publish', index: 0, timeout: 8000, retry: 6, delay: 800 }
        # sleep_step: 1000


        # Handle optional success dialog after publishing: check "Do not show me this again" and click Save
        # check_do_not_show_gotit: { locator: "input[name='display']", optional: true }
        # sleep_step: 500
        # R_click_customize_now: { locator: "span:has-text('Customize Now')", optional: true, timeout: 5000 }
        # sleep_step: 3000

        # # Click Publish button to publish the resold post (first click may open confirmation dialog)
        # # 使用 smart_click_retry: 元素一定存在，但点击可能不稳定（动画遮罩等），需要重试
        # smart_click_retry_publish_resold: { role: 'button', name: 'Publish', timeout: 5000, retry: 3, delay: 500 }
        # sleep_step: 2000

        # # Second click on Publish confirmation dialog (modal button)
        # # 确认弹框出现有延迟，增加等待时间和重试次数；弹框里只有1个Publish，用index: 0
        # smart_click_retry_publish_confirm: { role: 'button', name: 'Publish', index: 0, timeout: 8000, retry: 6, delay: 800 }
        # sleep_step: 1000


        # # Handle optional "Got it" dialog after publishing: check "Do not show me this again" and click Got it
        # # check_do_not_show_gotit: { locator: "input[name='display']", optional: true }
        # # sleep_step: 500
        # R_click_got_it: { role: 'button', name: 'Got it', optional: true, timeout: 3000 }
        # sleep_step: 2000

        # [Idempotency 2026-09-01] This Save belongs to the "Customize Now" dialog opened by the resell
        # flow above. When the post is already in the co-seller's shop that dialog never opens, so Save
        # must be optional too.
        click_save_btn: { role: 'button', name: 'Save', optional: true }


        # Wait for toast message "Post published and added to your shop."
        # wait_toast_publish: { message: "Adding posts to selected co-seller shops. This may take a few seconds. Click Refresh to see the latest progress.", timeout: 10000 }
        sleep_step: 3000

        # =========================================================================
        # T3686: Verify Order confirmation note is inherited and non-editable in Coseller's Post
        # =========================================================================

        # Step 3.1: Navigate to Coseller's shop page
        open_coseller_shop: "{BASE_URL}/autotest-coseller"
        sleep_step: 3000

        # [UI drift 2026-09-01] The co-seller's OWN shop root now renders the storefront EDITOR
        # (Storefront / Add / Preview / Customize / Rearrange sections / My content); resold posts are no
        # longer listed on it, so `text=event-for-ui-auto-venue-map` was never found there. Posts now live
        # behind "My content", which navigates to /autotest-coseller/archive (tabs: Posts | Links | Forms).
        # Verified live with co-seller cookies; same pattern already used in T2705's teardown.
        R_click_my_content: { role: "button", name: "My content" }
        sleep_after_my_content: 4000

        # Step 3.2: Find and click the resold Post to edit
        # From /archive this lands on /post/<id>/view (Content|Selling|Coupons tabs + Content/Style/
        # Settings/Tools action cards), where the "Settings" card below opens /post/<id>/settings and the
        # inherited "Order confirmation note" text is rendered (verified live).
        R_click_resold_post: { locator: "text=event-for-ui-auto-venue-map", exact: true, index: 0 }
        sleep_step: 3000

        # Step 3.3: Switch to Settings tab
        R_click_settings_card: { role: 'button', name: 'Settings' }
        sleep_step: 2000


        # Step 3.4: Verify the note content is displayed and matches original (implies toggle is ON)
        verify_note_content: { text: 'Test Note - Concert at 7PM, Venue: Test Arena, Please bring ID' }
        sleep_step: 500



        # =========================================================================
        # T3686: Guest checkout from Coseller's resold Post to verify confirmation note
        # =========================================================================

        # T3686 Step 3: Log out from Coseller account
        open_account: "{BASE_URL}/account"
        sleep_step: 3000

        R_click_logout: { role: 'button', name: 'Log out' }
        sleep_step: 3000

        # T3686 Step 4: Navigate to Coseller's resold Post page as guest
        open_resold_post: "{BASE_URL}/autotest-coseller/post/event-for-ui-auto-venue-map"
        sleep_step: 3000

        # T3686 Step 5: Guest clicks Buy Ticket (from Coseller's shop General Admission 01)
        # [2026-10-10 replicated from T3683 hardened recipe] Pin the GA01 card by accessible
        # name — every card owns a "Buy Ticket" button and near_text+name:'Buy Ticket' hits
        # the FIRST card ("General Admission", $0.00 qty-picker flow). The resold post mirrors
        # the original's products, so the accessible name still contains "General Admission 01".
        R_click_buy_ticket_ga01: { role: 'button', name: 'General Admission 01', index: 0 }
        # Wait for the seat map to finish loading before clicking (instruction text renders
        # after the progressbar; earlier clicks land on a pre-render map and never register).
        wait_select_dialog_loaded: { text: "Please select tables in the map", timeout: 20000 }
        # [2026-10-10] Seat = SVG circle[data-id] (the sibling transparent rect sits below and
        # is intercepted). SOLD seats render stroke="transparent" — :not() picks the first
        # AVAILABLE seat so the step self-heals as runs sell seats.
        R_click_select_table: { locator: '[role="dialog"] circle[data-id]:not([stroke="transparent"])', index: 0 }
        # Loud gate: panel must flip from "No tables selected" to "1 table selected".
        wait_table_selected: { text: "table selected", timeout: 8000 }
        # Required (not optional): "Buy now" only renders after a successful seat selection.
        # NOTE (2026-10-10): the old "seat selection requires a LOGGED-IN buyer" assumption is
        # DISPROVEN — T3683 buys fine as guest (2 consecutive green runs).
        R_click_buy_now: { role: 'button', name: 'Buy now', timeout: 10000 }

        # T3686 Step 7: [2026-10-10] optional — checkout may land directly on /checkout
        R_click_continue: { role: 'button', name: 'Continue', optional: true }
        sleep_step: 2000

        # T3686 Step 8: Fill Contact info
        fill_first_name: { locator: 'input[name="contact.firstName"]', value: 'Coseller' }
        sleep_step: 500

        fill_last_name: { locator: 'input[name="contact.lastName"]', value: 'Guest' }
        sleep_step: 500

        fill_phone: { locator: 'input[name="contact.phoneNumber"]', value: '+1 6502396646' }
        sleep_step: 500

        fill_email: { locator: 'input[name="contact.email"]', value: 'linda.zhou.ext+10@1m.app' }
        sleep_step: 500

        # T3686 Step 8.5: Fill Credit Card information (Stripe iframe)
        fill_stripe_iframe:
            card_number: '4242424242424242'
            expiry: '02/45'
            cvc: '345'
            card_name: 'linda 4650'
            zipcode: '90021'
        sleep_step: 1000

        # T3686 Step 9: Place Order
        R_click_place_order: { role: 'button', name: 'Place order', optional: true }
        # [2026-10-10] RSVP fallback for a free order (leftover auto-coupon) — see T3683.
        R_click_place_order_rsvp_fallback: { role: 'button', name: 'RSVP', optional: true }

        # Wait for order confirmation page to load ("Access Your Order" button appears)
        wait_for_access_order_button: { role: 'button', name: 'Access Your Order', timeout: 20000 }
        sleep_step: 2000

        # T3686 Expected: Verify confirmation note is displayed
        verify_note_on_order_placed: { text: 'Test Note - Concert at 7PM, Venue: Test Arena, Please bring ID' }
        sleep_end: 3000

    expect_result:
        assertions:
            # ===== T3686 Expected Result =====
            # Order Confirmation Note displayed below order details on order placed page
            # Note content matches what was set by Curator on the original Post
            - assertion_type: "element_visible_by_text"
              text: "Test Note - Concert at 7PM, Venue: Test Arena, Please bring ID"


