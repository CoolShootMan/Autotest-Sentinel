    test_step:
        # Step 1: Open Events list page
        open: "{BASE_URL}/events"
        sleep_after_open: 5000

        # Step 2: Find and click "Test event post variant settings" event
        R_click_event: { locator: "text=event-for-UI-auto-venue-map", exact: true }
        sleep_step: 4000

        # Step 2.2: Click Posts tab to ensure post cards are visible
        R_click_posts_tab: { role: "tab", name: "Post" }
        sleep_step: 2000

        # Step 3: Click post card to enter post landing page
        # [UI drift 2026-08-31] Post tab now shows the post directly; card click removed.
        #sleep_step: 3000

        # Step 4: Click Seting tab
        R_click_settings_card: { role: "button", name: "Settings" }
        sleep_step: 2000


