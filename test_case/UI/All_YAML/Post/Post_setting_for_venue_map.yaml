              text: "Post settings"


# T2515 Guest verifies purchase is blocked at limit=5 via the seat-map drawer
# [2026-10-13 rewrite] Target post switched to 12061-phase2-auto-event; entry is the
# "Show venue map drawer" button (no variant rows in the seat dialog). The seat map
# allows selecting any number of tables in the dialog, but the LIMIT IS ENFORCED
# SERVER-SIDE at checkout: with 6 seats (> limit 5) the cart panel shows
# "Each customer can buy up to 5 items from this post."
# Seat clicking: each table renders a 102px transparent hit-rect (pointer-events:all)
# that overlaps its neighbours, so plain clicks miss. Zooming in 4x separates the
# rects; we then pick a rect whose center elementFromPoint() returns the rect itself,
# and real-mouse click it via its data-id (JS-synthesized clicks don't register).
testT2515_VerifyDisabled_WithVariant_venue_map:
    guest: true
    description: "Verify purchase is blocked at limit=5 (seat map: 5 seats added, 6th seat shows cart limit warning)"
    test_step:
        # Step 1: Open 12061 post detail page as guest
        open: "{BASE_URL}/autotestshop/post/12061-phase2-auto-event"
        sleep_after_open: 6000

        # Step 2: Open venue map drawer (the post's seat-map entry button)
        R_click_drawer: { role: "button", name: "Show venue map drawer" }

        # Step 3: Seat dialog must finish loading before seat clicks register
        wait_seat_dialog: { text: "Select tickets", timeout: 25000 }

        # Step 4: Select 5 seats. smart_seat_click does everything self-contained:
        # zoom-in 4x (and waits for the animation to settle), collects self-hit seat
        # candidates, real-mouse clicks them until the "N table selected" counter
        # reaches 5 (skipping clicks that cancel a previously selected seat), and
        # asserts the final count.
        smart_seat_click_1: { target: 5 }

        # Step 5: Add the 5 selected seats to cart
        R_click_add_to_cart: { role: "button", name: "Add to cart" }

        # Step 6: Reopen the drawer and add a 6th seat (over the limit=5). The drawer
        # reset the map, so smart_seat_click re-zooms and only targets seats that are
        # not in window.__picked (the 5 already-selected ones).
        # NOTE: uses a global CSS locator (not role) because after "Add to cart" a modal
        # (cart panel) may be open and smart_click's modal-scoped role lookup would search
        # inside that dialog, missing the post-body button.
        R_click_drawer_2: { locator: 'button:has-text("Show venue map drawer")' }
        wait_seat_dialog_2: { text: "Select tickets", timeout: 25000 }
        smart_seat_click_2: { target: 6 }

        # Step 7: Update cart now holds 6 seats (> limit 5)
        R_click_update_cart: { role: "button", name: "Update cart" }

        # Step 8: Open the cart — the server enforces limit=5 and the cart panel shows
        # the limit warning instead of offering checkout (verified 2026-10-13, probe60).
        R_click_view_cart: { locator: '[aria-label="View cart"]', index: 0 }
        verify_purchase_limit_warning: { text: "Each customer can buy up to 5 items", timeout: 10000 }
        sleep_end: 2000

    expect_result:
        description: "Cart with 6 seats (> limit 5) shows the server-enforced limit message 'Each customer can buy up to 5 items'"


    teardown_step:
        # Step 1: Inject partner cookies to login as partner
        add_cookies: {}
        sleep_step: 1000

        # Step 2: Open Events list page
        open: "{BASE_URL}/events"
        sleep_step: 3000

        # Step 2.1: Click event card first to enter event detail page (Posts tab lives inside event detail now)
        R_click_event_teardown: { locator: "text=12061 phase2 auto event", exact: true }
        sleep_step: 4000

        # Step 2.2: Click Posts tab (now inside event detail)
        R_click_posts_tab: { role: "tab", name: "Post" }
        sleep_step: 2000

        # Step 3: Scroll down to reveal post card
        scroll_to_bottom: { iterations: 3, delay: 500 }
        sleep_step: 1000

        # Step 4: Click post card to enter post landing page
        # [UI drift 2026-08-31] Post tab now shows the post directly; card click removed.
        sleep_step: 3000

        # Step 5: Click Settings tab
        R_click_settings_card_teardown: { role: "button", name: "Settings" }
        sleep_step: 2000


        # Step 6: Disable "Purchase quantity limit" toggle
        uncheck_purchase_limit: { locator: "input[name='isPurchaseQuantityLimited']", checked: false }
        sleep_step: 1000

        # Step 7: Save
        R_click_save_teardown: { role: "button", name: "Save" }
        sleep_step: 3000
        wait_toast_save_teardown: { message: "Post settings updated", timeout: 15000 }


