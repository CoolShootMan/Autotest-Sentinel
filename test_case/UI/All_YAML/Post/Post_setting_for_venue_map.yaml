# T4955: Partner enables Payment Restriction and sets access code
testT4955_Partner_SetPaymentRestriction:
    description: "Partner enables Payment Restriction and sets access code 'demi123'"
    test_step:
        # Step 1: Open Events list page
        open: "{BASE_URL}/events"
        sleep_after_open: 5000

        # Step 2: Find and click "Test event post variant" event
        R_click_event: { locator: "text=event-for-UI-auto-venue-map", exact: true }
        sleep_step: 4000

        # Step 2.2: Click Posts tab to ensure post cards are visible
        R_click_posts_tab: { role: "tab", name: "Post" }
        sleep_step: 2000

        # Step 3: Click post card to enter post landing page
        # [UI drift 2026-08-31] Post tab now shows the post directly; card click removed.
        sleep_step: 3000

        # Step 4: Click Seting tab
        R_click_settings_card: { role: "button", name: "Settings" }
        sleep_step: 2000


        # Step 5: [2026-10-10 UI rewrite, browser-verified] "Set checkout restrictions" is now
        # a DIALOG: clicking the toggle row turns it ON and opens the dialog (a payment
        # dropdown + a "Set access restriction" card). The old inline flow and the "Set up
        # access code" button no longer exist. The access code [demi123] persists
        # server-side, so Apply -> Save is enough; if the code is ever lost it must be
        # re-added via the card's Edit button manually.
        check_payment_restriction: { locator: "input[name='enablePaymentRestriction']" }
        sleep_step: 1500

        # Step 9: Click Apply button (closes the dialog, checkbox stays ON)
        R_click_apply: { role: "button", name: "Apply" }
        sleep_step: 2000

        # Step 10: Click Save button on main page
        R_click_save: { role: "button", name: "Save" }
        sleep_step: 5000

    expect_result:
        description: "Payment Restriction with access code saved successfully"
        assertions:
            - assertion_type: "element_visible_by_text"
              text: "Post settings updated"


