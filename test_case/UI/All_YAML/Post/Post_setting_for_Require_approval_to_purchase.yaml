    # Select 1 seat
    smart_seat_click: { target: 1, stroke: "#E9803D", optional: true }
    sleep_step: 1000

    # Add to cart
    R_click_add_to_cart: { locator: 'button:has-text("Add to cart"), button:has-text("Update cart")', optional: true }
    sleep_step: 2000

    # Click Checkout
    R_click_checkout: { locator: 'button:has-text("Checkout")', optional: true }
    sleep_step: 3000

    R_click_continue: { role: 'button', name: 'Continue', timeout: 15000, optional: true }
    sleep_step: 2000
    R_click_continue_cc: { role: 'button', name: 'Continue with credit card', optional: true }
    sleep_step: 1000

    fill_first_name: { locator: 'div[role="dialog"] input >> nth=0', value: 'Auto' }
    sleep_step: 300
    fill_last_name: { locator: 'div[role="dialog"] input >> nth=1', value: 'Buyer' }
    sleep_step: 300
    fill_phone: { locator: 'div[role="dialog"] input >> nth=2', value: '+1 6502396646' }
    sleep_step: 300
    fill_email: { locator: 'div[role="dialog"] input >> nth=3', value: 'autotest.buyer@example.com' }
    sleep_step: 300

    fill_stripe_iframe:
      card_number: '4242424242424242'
      expiry: '02/45'
      cvc: '345'
      card_name: 'Auto Buyer'
      zipcode: '90021'
    sleep_step: 8000

    R_click_place_order: { role: 'button', name: 'Place order', optional: true }
    sleep_step: 5000
    R_click_place_order_retry: { role: 'button', name: 'Place order', optional: true }
