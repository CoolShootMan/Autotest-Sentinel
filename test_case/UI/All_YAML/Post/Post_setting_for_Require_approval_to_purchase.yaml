# ==============================================================================
# Test Case: T5685 (Partner approves the After-approval application)
# The Waitlist is per event, so the after-approval application shows up in the
# same list - it just has no item/unit (nothing was picked yet).
# ==============================================================================

testT5685_after_partner_approve:
#Auth: Linda Zhou
  guest: false
  description: "Partner approves the pending After-approval application"
  test_step:
    open: "{BASE_URL}/events"
    sleep_after_open: 5000

    R_click_event: { locator: "text=post setting require approval to purchase", exact: true }
    sleep_step: 4000

    R_click_attendees: { role: 'tab', name: 'Attendees', optional: true }
    sleep_step_2: 2000

    R_click_waitlist_tab: { locator: "button:has-text('Waitlist')", timeout: 10000 }
    sleep_step_3: 5000

    # Rows accumulate across runs -> filter by this run's applicant email.
    fill_waitlist_search: { placeholder: 'Search by name or email', value: '{{approval_after_email}}', timeout: 10000, optional: true }
    sleep_step_4: 3000

    verify_applicant_row: { text: "{{approval_after_email}}", timeout: 20000 }
    sleep_step_5: 1000

    R_click_pending_row: { locator: "tr:has-text('{{approval_after_email}}')", timeout: 10000 }
    sleep_step_6: 2000

    R_click_approve: { role: 'button', name: 'Approve' }
    sleep_step_7: 2000

    R_click_approve_send: { role: 'button', name: 'Approve & send email' }
    sleep_step_8: 3000

    wait_approved: { text: "Approved", timeout: 10000 }
    sleep_step_9: 1000

    # Re-open the approved row -> Application detail dialog.
    R_click_approved_row: { locator: "tr:has-text('{{approval_after_email}}')", timeout: 10000 }
    sleep_step_10: 2000

    # Application detail fields. In "After approval" mode the customer applied
    # BEFORE choosing anything, so there is no item / unit / total here.
    verify_name: { text: "Tester, After" }
    verify_email: { text: "{{approval_after_email}}" }
    verify_phone: { text: "+1 (650) 239-6646" }
    verify_submitted_at: { text: "Submitted at" }
    verify_reviewed_at: { text: "Reviewed at" }

    # The approved customer gets a link that unlocks buying ANY product.
    # It is only exposed through the "Copy link" element (never rendered as
    # text), so hook clipboard.writeText and capture whatever it puts there.
    execute_js_hook_clipboard:
        script: |
            (() => {
              window.__approvalCopiedLink = null;
              const orig = navigator.clipboard && navigator.clipboard.writeText
                ? navigator.clipboard.writeText.bind(navigator.clipboard) : null;
              if (navigator.clipboard) {
                navigator.clipboard.writeText = (t) => {
                  window.__approvalCopiedLink = t;
                  try { return orig ? orig(t) : Promise.resolve(); } catch (e) { return Promise.resolve(); }
                };
              }
              return 'hooked';
            })()
    sleep_step_11: 300

    R_click_copy_link: { locator: 'div[role="dialog"]:has-text("Purchase link:") div[data-testid="mui-stack"]:has-text("Copy link")', timeout: 10000, optional: true }
    sleep_step_12: 1500

    execute_js_read_copied_link:
        save_as: "approved_after_purchase_link"
        global: true
        script: |
            (() => {
              const v = window.__approvalCopiedLink;
              if (!v) throw new Error('Copy link captured nothing (clipboard.writeText was not called)');
              return v;
            })()
    sleep_step_13: 500

  expect_result:
    assertions:
      - assertion_type: "element_visible_by_text"
        text: "Approved"


