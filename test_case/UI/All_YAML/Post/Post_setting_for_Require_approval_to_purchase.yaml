# ==============================================================================
# Test Case: T5669 (Teardown: disable approval, restore direct buy)
# ==============================================================================

testT5669_teardown_disable:
#Auth: Linda Zhou
  guest: false
  description: "Teardown: disable Require approval to purchase on both posts"
  test_step:
    open: "{BASE_URL}/events"
    sleep_after_open: 5000

    R_click_event: { locator: "text=post setting require approval to purchase", exact: true }
    sleep_step: 4000

    R_click_posts_tab: { role: "tab", name: "Post" }
    sleep_step_2: 2000

    # ---- the "-before" post ----
    R_click_post_selector: { locator: '[data-testid="post-selector-chevron-pill"] svg[data-testid="DownLineIcon"]', timeout: 10000 }
    sleep_step_3: 2000

    R_click_post_before: { locator: 'div[role="presentation"] button[data-testid="mui-box"]:has-text("post-setting-require-approval-to-purchase-before")', timeout: 10000 }
    sleep_step_4: 3000

    R_click_settings_tab: { role: 'button', name: 'Settings' }
    sleep_step_5: 2000

    # Only switch it off when it is actually on - a blind click would turn the
    # approval back ON (and pop the mode dialog) when the file is re-run.
    execute_js_turn_off_before:
        save_as: "approval_off_before"
        script: |
            (() => {
              const el = document.querySelector('input[name="isPurchaseApprovalRequired"]');
              if (!el) return 'switch-missing';
              if (!el.checked) return 'already-off';
              el.click();
              return 'turned-off';
            })()
    sleep_step_6: 2000

    R_click_save: { role: 'button', name: 'Save', skip_if_disabled: true }
    wait_toast: { message: "Post settings updated", timeout: 15000, optional: true }
    sleep_step_7: 1000

    R_click_close: { locator: '[data-testid="CloseIcon"]', optional: true, disable_ai: true }
    sleep_step_8: 2000

    # ---- the "-after" post ----
    # The post settings screen is its own route, so the Post tab (and with it the
    # post selector) is only reachable again after re-opening the event.
    open_event_again: "{BASE_URL}/events"
    sleep_after_open_2: 6000

    R_click_event_2: { locator: "text=post setting require approval to purchase", exact: true }
    sleep_step_9: 4000

    R_click_posts_tab_2: { role: "tab", name: "Post" }
    sleep_step_9_2: 2000

    R_click_post_selector_2: { locator: '[data-testid="post-selector-chevron-pill"] svg[data-testid="DownLineIcon"]', timeout: 10000 }
    sleep_step_9_3: 2000

    R_click_post_after: { locator: 'div[role="presentation"] button[data-testid="mui-box"]:has-text("post-setting-require-approval-to-purchase-after")', timeout: 10000 }
    sleep_step_10: 3000

    R_click_settings_tab_2: { role: 'button', name: 'Settings' }
    sleep_step_11: 2000

    execute_js_turn_off_after:
        save_as: "approval_off_after"
        script: |
            (() => {
              const el = document.querySelector('input[name="isPurchaseApprovalRequired"]');
              if (!el) return 'switch-missing';
              if (!el.checked) return 'already-off';
              el.click();
              return 'turned-off';
            })()
    sleep_step_12: 2000

    R_click_save_2: { role: 'button', name: 'Save', skip_if_disabled: true }
    wait_toast_2: { message: "Post settings updated", timeout: 15000, optional: true }
    sleep_step_13: 1000

    R_click_close_2: { locator: '[data-testid="CloseIcon"]', optional: true, disable_ai: true }
    sleep_step_14: 2000

  expect_result:
    assertions: []

