# ==============================================================================
# Test Case: T3779
# T3779: Set up auto-applied coupon on the designated venue-map post
#
# Precondition:
#   Curator is logged in; the venue-map event exists with its designated post
#
# Step description:
#   Navigate to post Promotion tab → Create a coupon → Enable auto-apply toggle →
#   Fill title/description "autotest3779" → Set value 100 → Click Create →
#   If info drawer appears click Got it → Save → Verify toast "Post promotions updated"
#
# Expected result:
#   Coupon created successfully with auto-apply enabled; toast "Post promotions updated" shown
# ==============================================================================

testT3779_TDC:
#Auth: Linda Zhou
    description: "Create an auto-applied coupon on the venue-map post"
    test_step:
        # Step 1: Navigate to the venue-map event (the coupon is created on ITS post)
        # [2026-10-13] event switched to 12061-phase2-auto-event (same as T2515/T4955;
        # the old event-for-UI-auto-venue-map post has an empty seat map).
        open: "{BASE_URL}/events"
        sleep_step: 5000

        R_click_my_event: { locator: "xpath=//*[normalize-space(.)='{{event_tdc}}']", index: 0, fallback_scan: true }
        sleep_step: 4000

        # Step 2: Scroll down to reveal post card
        scroll_to_bottom: { iterations: 5, delay: 500 }
        sleep_step: 2000

        # Step 2.1: Click Posts tab to ensure post cards are visible
        R_click_posts_tab: { role: "tab", name: "Post" }
        sleep_step: 2000

        # Step 3: Click into the designated post (index: 1 to skip event name)
        # [UI drift 2026-08-31] "View post" button removed (Post tab shows post directly)
        sleep_step: 4000

        # Step 3: Coupons tab (Selling no longer needed; Coupons is reachable directly)
        R_click_coupons_tab: { role: 'tab', name: 'Coupons' }
        sleep_step: 1500


        # Step 3.5: Enable "Hide Coupon Box at Checkout"
        check_hide_coupon_box: { locator: 'input[name="hideCouponBox"]', skip_if_checked: true }
        sleep_step: 500
        # Step 4: Click "Create" button to create a new coupon
        R_click_create_coupon_btn: { role: 'button', name: 'Create' }
        sleep_step: 1500

        # Which products? --- default All products
        R_click_continue_products: { role: 'button', name: 'Continue' }

        # What type? --- default Percentage off
        R_click_continue_type: { role: 'button', name: 'Continue' }

        # Fill discount value (100%)
        fill_coupon_value: { locator: 'input[name="betterDeals.0.value"]', value: '100' }
        sleep_step: 300

        R_click_continue_discount: { role: 'button', name: 'Continue' }
        sleep_step: 1000

        # Select "Automatic discount"
        R_click_auto_discount: { role: 'radio', name: 'Automatic discount' }
        sleep_step: 500

        # Fill display title and description
        fill_coupon_title: { locator: 'input[placeholder="Title"]', value: 'autotest3779' }
        sleep_step: 300
        fill_coupon_desc: { locator: 'input[placeholder="Description"]', value: 'autotest3779' }
        sleep_step: 300

        R_click_continue_apply: { role: 'button', name: 'Continue' }

        # Set availability --- default
        R_click_continue_limits: { role: 'button', name: 'Continue' }

        # Review your coupon
        R_click_finish: { role: 'button', name: 'Finish' }
        sleep_step: 2000

        # If "Hide Coupon Box at Checkout" disabled info dialog appears
        smart_click_optional_got_it: { role: 'button', name: 'Got it', timeout: 5000 }
        sleep_step: 1000

        # Save and verify toast
        R_click_save: { role: 'button', name: 'Save' }
        wait_toast_saved: { message: "Post promotions updated", timeout: 15000 }

    expect_result:
        description: "Auto-applied coupon 'autotest3779' created successfully; Post promotions updated toast shown"
        assertions:
            - assertion_type: "toast_visible"
              text: "Post promotions updated"


# ==============================================================================
# Test Case: T3767
# T3767: Verify the auto-applied coupon is applied at guest checkout
#
# Precondition:
#   T3779 has been executed to set up the auto-applied coupon 'autotest3779'
#   on the designated venue-map post (event-for-ui-auto-venue-map, 100% off)
#
# Step description:
#   Guest opens the venue-map post → GA01 seat selection → Buy now →
#   /checkout shows the coupon row → contact info → place order
#
# Expected result:
#   Guest checkout successful with coupon applied; order page displayed
# ==============================================================================

testT3767_TDC:
#Auth: Linda Zhou
    guest: true
    description: "Verify auto-applied coupon 'autotest3779' applies at guest checkout (TDC no-map post)"
    test_step:
        # Step 1: TDC no-map post (dynamic {{post_url}} from prefill); T3779 created the
        # auto-applied coupon on this post.
        open: "{{post_url}}"
        sleep_after_open: 6000

        # Step 2: TDC no-map purchase - click "Buy Ticket", then "Buy now" (the
        # auto-applied coupon row is visible on the checkout dialog that follows).
        R_click_buy_ticket: { role: 'button', name: 'Buy Ticket' }
        # "Select tickets" dialog: click "+" to add 1 ticket
        sleep_step: 2000
        R_click_plus_qty: { locator: "button[aria-label='Add']", timeout: 10000 }
        sleep_step: 1000
        smart_click_optional_buy_now: { role: 'button', name: 'Buy now', timeout: 5000 }
        sleep_step: 3000

        # Step 7: The auto coupon row shows its display title on the checkout dialog
        verify_coupon_exists: { text: "autotest3779", timeout: 10000 }
        sleep_step: 500

        # Step 8: The 100% coupon makes the order FREE — the checkout dialog shows a
        # plain "Continue" (no "Continue with credit card" CTA, since no payment method
        # is needed). Clicking it expands the Contact form.
        R_click_continue_cc: { role: "button", name: "Continue" }
        wait_place_order_visible: { text: "Place order", timeout: 20000 }

        # Step 9: Fill Contact info
        fill_first_name: { locator: 'input[name="contact.firstName"]', value: 'autoTest' }
        sleep_step: 500
        fill_last_name: { locator: 'input[name="contact.lastName"]', value: 'User' }
        sleep_step: 500
        fill_phone: { role: "textbox", name: "Phone number", value: '+1 (650) 900-6646' }
        sleep_step: 500
        fill_email: { locator: 'input[name="contact.email"]', value: 'linda.zhou.ext+10@1m.app' }
        sleep_step: 500

        # Step 10: Place order — the 100% coupon makes the total Free, so no Stripe
        # payment fields exist at all. Place order fires once; retries/RSVP fallback
        # were legacy 400-race workarounds and are not needed on the free-order path.
        sleep_step: 8000
        R_click_place_order: { role: "button", name: "Place order", optional: true }
        sleep_step: 5000
        wait_for_url: { url: "*order*", timeout: 45000 }
        sleep_step: 2000


    expect_result:
        description: "Guest checkout successful with auto-applied coupon; order page displayed, amount shows Free"
        assertions:
            - assertion_type: "url_contains"
              text: "order"
            - assertion_type: "element_visible_by_text"
              text: "Free"
            - assertion_type: "element_visible_by_text"
              text: "How to access your tickets"
            - assertion_type: "element_visible_by_text"
              text: "You're all set"


    teardown_step:
        # Partner cleans up: Delete the coupon via Edit -> Delete
        add_cookies: {}
        sleep_step: 1000

        open: "{BASE_URL}/events"
        sleep_step: 5000

        # [2026-10-13] event switched to 12061-phase2-auto-event
        R_click_my_event: { locator: "xpath=//*[normalize-space(.)='{{event_tdc}}']", index: 0, fallback_scan: true }
        sleep_step: 4000

        # Step 2: Scroll down to reveal post card
        scroll_to_bottom: { iterations: 5, delay: 500 }
        sleep_step: 2000

        # Step 2.1: Click Posts tab to ensure post cards are visible
        R_click_posts_tab: { role: "tab", name: "Post" }
        sleep_step: 2000

        # Step 3: Click into the designated post (index: 1 to skip event name)
        # [UI drift 2026-08-31] "View post" button removed (Post tab shows post directly)
        sleep_step: 4000

        # [2026-10-13] Selling no longer needed; Coupons is reachable directly
        R_click_coupons_tab_td: { role: 'tab', name: 'Coupons' }
        sleep_step: 1500

        # Step 1: Click the Edit (pencil) icon on the coupon card to open "Edit a coupon".
        # [2026-10-13] copied from Post_setting.yaml T3767: the coupon card icons are
        # enhance-buttons Copy / Edit / Redemption Stats. Do NOT use an index — the first
        # 6 enhance-buttons (Content/Style/Settings/Tools/Customize/Change cover) are
        # hidden DOM copies, so index 1 resolves to "Style".
        click_edit_coupon: { locator: '[data-testid="enhance-button"][aria-label="Edit"]' }
