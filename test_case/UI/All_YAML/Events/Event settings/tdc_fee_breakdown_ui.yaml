# --- testT5649_tdc: TDC-tagged event, verify the product is priced (non-zero), fee breakdown, guest checkout (no refund flow: TDC tickets are not refundable upstream) ---
testT5649_tdc:
    is_mobile: true
    description: "Find a TDC-tagged event, verify its product price is not 0, then open Settings, enable 'Show fee breakdown at checkout', and save"
    test_step:
        # 1. Go to the event list page
        open: "{BASE_URL}/events"
        sleep_list: 5000

        # 1b. [HARD ASSERTION] the target TDC-tagged event is on the list.
        #     Poll: the list is long (other suites keep creating events) and hydration can outlast
        #     `sleep_list`; a one-shot find would report "not found" for a merely-slow list.
        #     NOTE: if this still fails, first check the SESSION — an expired cookie redirects
        #     /events to /login, which looks exactly like "event not found".
        #     Refresh with: ./venv/bin/python tools/get_all_cookies.py
        execute_js_verify_tdc_event:
            script: |
                (async () => {
                  const NAME='09/26 Baseball Stadium Tours';
                  const nz = e => (e.textContent||'').replace(/\s+/g,' ').trim();
                  const nameLeaf = () => [...document.querySelectorAll('*')].find(e => e.children.length===0 && nz(e)===NAME);
                  let nameEl=null;
                  for(let i=0;i<30;i++){
                    if(/\/login/.test(location.pathname)) throw new Error('session expired: /events redirected to '+location.href+' (refresh cookies with tools/get_all_cookies.py)');
                    nameEl = nameLeaf();
                    if(nameEl) break;
                    await new Promise(r=>setTimeout(r,500));
                  }
                  if(!nameEl) throw new Error('event "'+NAME+'" not found in the event list (url='+location.href+')');
                  // the tag badge sits in the same row as the name: the row's text concatenates to
                  // "<name>TDC", so match "TDC" only when it is NOT followed by a letter
                  // (otherwise "<name>TDC<venue>" from the outer card would false-positive)
                  let el=nameEl, tagged=false;
                  for(let k=0;k<4 && el;k++){ if(/TDC(?![A-Za-z])/.test(nz(el))){ tagged=true; break; } el=el.parentElement; }
                  if(!tagged) throw new Error('event "'+NAME+'" does not carry the TDC tag');
                  return 'TDC event card verified: '+NAME;
                })()

        # 2. Click that TDC event card. Selected BY NAME so the choice is order-independent
        R_click_tdc_event: { locator: "xpath=//p[normalize-space(.)='09/26 Baseball Stadium Tours']" }
        sleep_event: 5000

        # 3. Open the "Tickets & Merch" tab where ticket names are listed
        R_click_tickets_tab: { role: "tab", name: "Tickets & Merch" }
        sleep_tickets: 3000

        # 4. Verify every product on the Tickets & Merch tab has a NON-ZERO price.
        execute_js_verify_price:
            script: |
                () => {
                    // product cards on the Tickets & Merch tab look like:
                    //   <name><$price>(incl. $fees)<N> sold<Tools>
                    const nz = e => (e.textContent || '').replace(/\s+/g, ' ').trim();
                    const raw = [...document.querySelectorAll('*')]
                        .map(nz)
                        .filter(t => t.includes('Tools') && /sold/i.test(t) && t.includes('$') && t.length < 400);
                    // keep only the leaf-most cards (drop wrappers that merely contain them)
                    const cards = raw.filter(t => !raw.some(o => o !== t && o.length < t.length && t.includes(o)));
                    if (cards.length === 0) throw new Error('No product card (price + "sold" + Tools) found on the Tickets & Merch tab');

                    const priced = cards.map(t => {
                        const m = t.match(/\$([\d,]+(?:\.\d+)?)/);
                        return { text: t, price: m ? parseFloat(m[1].replace(/,/g, '')) : null };
                    });
                    const bad = priced.filter(p => !(p.price > 0));
                    if (bad.length) throw new Error('Product price is 0 (or missing) for: ' + JSON.stringify(bad.map(p => p.text)));
                    return 'all ' + priced.length + ' product(s) priced, e.g. $' + priced[0].price.toFixed(2) + ' | ' + priced[0].text;
                }

        # 5. Open event Settings (drawer). Reachable from the Tickets & Merch tab too.
        R_click_settings: { role: "button", name: "Settings" }
        sleep_settings: 3000

        # 6. Enable "Show fee breakdown at checkout".
        check_fee_breakdown: { locator: "xpath=//input[@name='showFeesBreakdown']", checked: true }
        sleep_fee: 1500

        # 7. Verify the checkbox is now ON (throws -> step fails if it isn't).
        execute_js_verify_fee:
            script: |
                () => {
                    const i = document.querySelector('input[name="showFeesBreakdown"]');
                    if (!i) throw new Error('fee breakdown checkbox not found in Settings panel');
                    if (!i.checked) throw new Error('"Show fee breakdown at checkout" was not checked');
                    return 'fee breakdown checked';
                }

        # 8. Save the settings (drawer closes on success).
        R_click_save: { name: "Save" }
        sleep_save: 3000

        # 9. Extract the target ticket: the name of the first non-"Sold out" product card.
        #    [WHY NOT "0 sold"] every run of this case BUYS one ticket, so the sold counter of the
        #    chosen product grows and the pool of "0 sold" products shrinks. Once all four products
        #    had 1 sold this step threw `No 0-sold non-Sold-out ticket found` — the case was
        #    one-shot. The real intent is "a product that still has inventory", i.e. NOT sold out;
        #    the cards are listed in a stable order (T1000 first), so this is deterministic.
        execute_js_extract_name:
            script: |
                () => {
                  const all=[...document.querySelectorAll('*')];
                  const roots=[];
                  for (const el of all){ const t=el.textContent||''; if(t.includes('Tools')&&/\$/.test(t)&&/sold/i.test(t)){ if((t.match(/Tools/g)||[]).length===1) roots.push(el); } }
                  const uniq=[]; for(const r of roots){ if(!uniq.some(u=>u.contains(r)&&u!==r)) uniq.push(r); }
                  for(const r of uniq){
                    const t=r.textContent.replace(/\s+/g,' ').trim();
                    const isSoldOut=/Sold out/i.test(t);
                    if(!isSoldOut){
                      const name=(t.match(/([^$]+?)\$[\d.]+/)[1]).replace(/Tools$/,'').replace(/^Ticket/,'').replace(/\s+/g,' ').trim();
                      return name;
                    }
                  }
                  throw new Error('No non-Sold-out ticket found');
                }
            save_as: "ticket_tdc"
        sleep_extract_name: 800

        # 10. Extract the target ticket's price (the first $ amount on the card = retail price)
        #     -> temp var ticket-retails-price
        execute_js_extract_retail_price:
            script: |
                () => {
                  const all=[...document.querySelectorAll('*')];
                  const roots=[];
                  for (const el of all){ const t=el.textContent||''; if(t.includes('Tools')&&/\$/.test(t)&&/sold/i.test(t)){ if((t.match(/Tools/g)||[]).length===1) roots.push(el); } }
                  const uniq=[]; for(const r of roots){ if(!uniq.some(u=>u.contains(r)&&u!==r)) uniq.push(r); }
                  for(const r of uniq){
                    const t=r.textContent.replace(/\s+/g,' ').trim();
                    const isSoldOut=/Sold out/i.test(t);
                    if(!isSoldOut){
                      const priceM=t.match(/\$([\d.]+)/);
                      if(!priceM) throw new Error('Ticket price not found in card: '+t);
                      return +parseFloat(priceM[1]).toFixed(2);
                    }
                  }
                  throw new Error('No non-Sold-out ticket found');
                }
            save_as: "ticket-retails-price"
        sleep_extract_price: 500

        # 10b. Extract the "incl." amount and compute my_revenve = price - incl -> temp var my_revenve
        execute_js_extract_revenue:
            script: |
                () => {
                  const all=[...document.querySelectorAll('*')];
                  const roots=[];
                  for (const el of all){ const t=el.textContent||''; if(t.includes('Tools')&&/\$/.test(t)&&/sold/i.test(t)){ if((t.match(/Tools/g)||[]).length===1) roots.push(el); } }
                  const uniq=[]; for(const r of roots){ if(!uniq.some(u=>u.contains(r)&&u!==r)) uniq.push(r); }
                  for(const r of uniq){
                    const t=r.textContent.replace(/\s+/g,' ').trim();
                    const isSoldOut=/Sold out/i.test(t);
                    if(!isSoldOut){
                      const priceM=t.match(/\$([\d.]+)/); const inclM=t.match(/incl\.?\s*\$([\d.]+)/i);
                      const price=parseFloat(priceM[1]); const incl=parseFloat(inclM[1]);
                      return +(price-incl).toFixed(2);
                    }
                  }
                  throw new Error('No non-Sold-out ticket found');
                }
            save_as: "my_revenve"
        sleep_extract_rev: 800

        # === Open the ticket-tdc product -> Edit ticket page -> read the fee breakdown -> go back ===

        # 11. Click the ticket-tdc product (located by the temp var name) to enter the Edit ticket page
        R_click_ticket: { locator: "xpath=//p[normalize-space(.)='{{ticket_tdc}}']" }
        sleep_edit_ticket: 6000

        # 12. Click the price under "Fees + Taxes" (the 2nd match = the price; the 1st match is
        #     just an explanatory tooltip) to open the breakdown popover
        R_click_fees_taxes: { locator: "xpath=//*[normalize-space(.)='Fees + Taxes']/following-sibling::*[1]", index: 1 }
        sleep_fees_tip: 2000

        # 13. Extract "Platform fees" from the popover -> temp var transaction-fees
        execute_js_extract_platform_fees:
            script: |
                () => {
                  const pop=[...document.querySelectorAll('.MuiPopover-root, .MuiPaper-root')].find(e=>/Platform fees/i.test(e.textContent));
                  if(!pop) throw new Error('fees breakdown popover not found');
                  const m=pop.textContent.replace(/\s+/g,' ').match(/Platform fees\s*\$?\s*([\d.]+)/i);
                  if(!m) throw new Error('Platform fees not found in popover');
                  return parseFloat(m[1]);
                }
            save_as: "transaction-fees"

        # 14. Extract "Taxes" from the popover -> temp var taxes
        execute_js_extract_taxes:
            script: |
                () => {
                  const pop=[...document.querySelectorAll('.MuiPopover-root, .MuiPaper-root')].find(e=>/Platform fees/i.test(e.textContent));
                  if(!pop) throw new Error('fees breakdown popover not found');
                  const m=pop.textContent.replace(/\s+/g,' ').match(/Taxes\s*\$?\s*([\d.]+)/i);
                  if(!m) throw new Error('Taxes not found in popover');
                  return parseFloat(m[1]);
                }
            save_as: "taxes"

        # 15. This price popover is a modal and covers the Back button, so press Escape to close it
        #     first, then click the Back button (header CloseIcon, aria-label="Back") to go back
        press_close_popover: { key: "Escape" }
        sleep_after_esc: 1200
        R_click_close_ticket: { locator: "button[aria-label='Back']" }
        sleep_back: 3000

        # 16. Open the event's "Post" tab — it renders the public post URL as plain text
        R_click_post_tab: { locator: "xpath=//*[@role='tab' or self::button][normalize-space(.)='Post']", index: 0 }
        sleep_post_tab: 4000

        # 17. Read the guest-accessible public post URL straight off the page -> temp var post_url
        execute_js_extract_url:
            script: |
                () => {
                  // the Post tab renders the URL as one element's own text, e.g.
                  //   "release.pear.us/autotestshop/post/0926-baseball-stadium-tours"
                  // so require the element's whole text to be a post URL (anchored) — a loose
                  // scan would swallow the neighbouring tab labels / section names.
                  const RE = /^(?:https?:\/\/)?[A-Za-z0-9.-]+\.pear\.us\/[A-Za-z0-9._-]+\/post\/[A-Za-z0-9._-]+\/?$/;
                  const els = [...document.querySelectorAll('*')].filter(e => RE.test((e.textContent||'').replace(/\s+/g,'')));
                  if (!els.length) throw new Error('public post URL not found on the event "Post" tab');
                  const raw = (els[0].textContent||'').replace(/\s+/g,'').replace(/\/$/,'');
                  return raw.startsWith('http') ? raw : 'https://' + raw;
                }
            save_as: "post_url"
        sleep_extract_url: 800

        # 18. Create the guest session (no cookie = visitor); saved temp vars are copied into it
        create_session_guest: { name: "guest" }

        # 19. As a guest, open the public post (location.href triggers navigation; the next step runs on the already-navigated page)
        session_guest__execute_js_goto:
            script: "() => { location.href='{{post_url}}'; return 'navigating'; }"
        sleep_guest_post: 5000

        # 20. As a guest, find the product by name in the post and assert its displayed price
        #     == my_revenve (net).
        #     [PRICING FACT] the post's product row and the "Select tickets" drawer both show the
        #     NET price ("T1000 - …$102.88$102.88"), while the Checkout drawer itemises
        #     Subtotal (net) + Transaction fees + Service fee. Do not compare the post row against
        #     ticket-retails-price: the page also renders a separate "featured product" block higher
        #     up that carries the retail price with an "(incl. fees)" note — that is a different element.
        session_guest__execute_js_verify:
            script: |
                (async () => {
                  const name='{{ticket_tdc}}';
                  const rev={{my_revenve}};
                  const nz = e => (e.textContent||'').replace(/\s+/g,' ').trim();
                  // [DOM FACT] the post renders the featured product at the top and the full
                  // product list below; the list can hydrate well after domcontentloaded, while
                  // the 5s sleep starts at the *navigation request*. So poll for the name leaf
                  // instead of assuming it already exists (the featured product renders first,
                  // which is why a "top" product used to pass while a listed one did not).
                  const nameLeaf = () => [...document.querySelectorAll('p,span,div,h1,h2,h3,h4,h5,h6')]
                      .filter(e => e.children.length===0 && nz(e)===name)
                      .sort((a,b)=>nz(a).length-nz(b).length)[0];
                  let nameEl=null;
                  for(let i=0;i<40;i++){ nameEl=nameLeaf(); if(nameEl) break; await new Promise(r=>setTimeout(r,500)); }
                  if(!nameEl) throw new Error('guest: product "'+name+'" not found in public post (after 20s)');
                  // (b) climb to the nearest ancestor that carries a price but is still small —
                  //     that is the product card (a bigger ancestor would swallow the whole list)
                  let card=null, el=nameEl;
                  for(let k=0;k<5 && el;k++){
                    const t=nz(el);
                    if(/\$\s*[\d,]/.test(t) && t.length <= name.length + 80){ card=el; break; }
                    el=el.parentElement;
                  }
                  if(!card) throw new Error('guest: no price found next to "'+name+'" in public post');
                  const cardText=nz(card);
                  const prices=[...cardText.matchAll(/\$\s*([\d,]+(?:\.\d+)?)/g)].map(m=>parseFloat(m[1].replace(/,/g,'')));
                  if(!prices.length) throw new Error('guest: no $ amount in the product card: '+cardText);
                  const shown=prices[0];
                  if(Math.abs(shown-rev)>0.01) throw new Error('guest: product "'+name+'" shows $'+shown.toFixed(2)+' but my revenue = $'+rev.toFixed(2));
                  return 'guest verified: '+name+' shows $'+shown.toFixed(2)+' = my revenue $'+rev.toFixed(2)+' | card = '+cardText;
                })()

        # ==================== guest checkout flow ====================
        # 21. As a guest, click the ticket-tdc product name on the public post to open the "Select tickets" drawer
        session_guest__R_click_product: { locator: "xpath=//*[normalize-space(.)='{{ticket_tdc}}']", index: 0 }

        # 22. Assert the price shown in the "Select tickets" drawer == my_revenve (net)
        session_guest__execute_js_verify_drawer:
            script: |
                (async () => {
                  const rev={{my_revenve}};
                  const nz = s => String(s).replace(/\s+/g,' ').trim();
                  // [DOM FACT] for a TDC hub ticket the drawer is the "Select tickets" one:
                  //   "Select tickets Select tickets by section Baseball Venue Tour 10:00 AM - 11:00 AM
                  //    $102.88 Add to cart Buy now"
                  // It shows the VENUE + time ("Baseball Venue Tour 10:00 AM - 11:00 AM"), NOT the
                  // product title ("T1000 - …"), so identify it by its heading. Fall back to "any
                  // drawer holding a quantity input" because innerText can briefly read empty.
                  const byHeading = () => [...document.querySelectorAll('.MuiDrawer-root')]
                      .find(x => /Select tickets/i.test(x.innerText));
                  const byQty = () => [...document.querySelectorAll('.MuiDrawer-root')]
                      .find(x => x.querySelector('input[type="number"]'));
                  let d=null;
                  for(let i=0;i<30;i++){ d=byHeading(); if(d && /\$/.test(d.innerText)) break; await new Promise(r=>setTimeout(r,500)); }
                  if(!d) d = byQty();
                  if(!d) throw new Error('guest: "Select tickets" drawer did not open');
                  const txt=nz(d.innerText);
                  const prices=[...txt.matchAll(/\$\s*([\d,]+(?:\.\d+)?)/g)].map(m=>parseFloat(m[1].replace(/,/g,'')));
                  if(!prices.length) throw new Error('guest: no price shown in the Select tickets drawer; text = '+txt);
                  const shown=prices[0];
                  if(Math.abs(shown-rev)>0.01) throw new Error('guest: drawer price $'+shown.toFixed(2)+' != my revenue $'+rev.toFixed(2)+'; text = '+txt);
                  return 'select-tickets drawer price verified: $'+shown.toFixed(2)+' == my revenue; text = '+txt;
                })()

        # 23. Normalise the quantity to 1.
        #     [DOM FACT] the "Select tickets" drawer opens at 0 (a "0-selected" section picker), and
        #     its quantity input has NO name attribute — target it as input[type=number].
        session_guest__execute_js_ensure_qty:
            script: |
                (async () => {
                  const pick = () => document.querySelector('.MuiDrawer-root input[type="number"]');
                  let el=null;
                  for(let i=0;i<20;i++){ el=pick(); if(el) break; await new Promise(r=>setTimeout(r,300)); }
                  if(!el) throw new Error('guest: quantity input not found in the Select tickets drawer');
                  const val = () => String(pick().value).trim();
                  const start = val();
                  if(start==='0'){
                    const add=[...document.querySelectorAll("button[aria-label='Add']")].find(b=>!b.disabled);
                    if(!add) throw new Error('guest: quantity is 0 but no enabled "+" button was found');
                    add.click();
                    for(let i=0;i<20;i++){ if(val()==='1') break; await new Promise(r=>setTimeout(r,300)); }
                  }
                  if(val()!=='1') throw new Error('guest: quantity is "'+val()+'", expected "1" (started at "'+start+'")');
                  return 'quantity = 1 (started at '+start+')';
                })()

        # 24. Assert the quantity really is 1
        session_guest__execute_js_verify_qty:
            script: |
                (async () => {
                  const sheet = () => [...document.querySelectorAll('.MuiDrawer-root')]
                      .find(x => /Select tickets/i.test(x.innerText))
                      || [...document.querySelectorAll('.MuiDrawer-root')].find(x => x.querySelector('input[type="number"]'));
                  let inp=null;
                  for(let i=0;i<20;i++){
                    const d=sheet();
                    if(d){ const e=d.querySelector('input[type="number"]'); if(e){ inp=e; if(String(e.value).trim()==='1') break; } }
                    await new Promise(r=>setTimeout(r,400));
                  }
                  if(!inp) throw new Error('guest: quantity input not found in the Select tickets drawer');
                  const v=String(inp.value).trim();
                  if(v!=='1') throw new Error('guest: quantity is "'+v+'", expected "1"');
                  return 'qty verified = 1';
                })()

        # 25. Click Buy now and wait 3s to reach the Checkout drawer
        session_guest__R_click_buy_now: { role: "button", name: "Buy now" }
        sleep_guest_checkout: 3000

        # 26. Assert on the Checkout drawer:
        #     product name == ticket-tdc; unit price == my_revenve; no "(incl. $ fees)" suffix;
        #     Total == my_revenve + transaction-fees + taxes
        session_guest__execute_js_verify_checkout:
            script: |
                (async () => {
                  const name='{{ticket_tdc}}';
                  const rev={{my_revenve}}, fee={{transaction-fees}}, tax={{taxes}};
                  const norm = s => String(s).replace(/Pear\.US/i,'').replace(/[\u2014\u2013-]\s*$/,'').replace(/\s+/g,' ').trim().toLowerCase();
                  const money = s => { const m=String(s).match(/\$\s*([\d,]+(?:\.\d+)?)/); return m?parseFloat(m[1].replace(/,/g,'')):null; };
                  const drawer = () => [...document.querySelectorAll('.MuiDrawer-root')].find(x=>/Checkout/i.test(x.innerText));
                  let d=null;
                  for(let i=0;i<30;i++){ d=drawer(); if(d && /Subtotal/i.test(d.innerText)) break; await new Promise(r=>setTimeout(r,500)); }
                  if(!d) throw new Error('guest checkout: Checkout drawer did not open after Buy now');
                  const txt=d.innerText.replace(/\s+/g,' ').trim();

                  // (a) product name
                  if(!norm(txt).includes(norm(name))) throw new Error('guest checkout: product "'+name+'" not shown; drawer text = '+txt);
                  // (b) [PRICING FACT] the TDC line price is the NET price and carries NO
                  //     "(incl. $ fees)" suffix — the fees are itemised as their own rows below
                  //     (Subtotal + Transaction fees + Service fee = Total).
                  if(/incl\.?\s*\$/i.test(txt)) throw new Error('guest checkout: price still carries an "(incl. $ fees)" suffix');
                  // (c) line unit price == my_revenve (net)
                  const leaves=[...d.querySelectorAll('*')].filter(e=>e.children.length===0 && e.textContent.trim());
                  const iName=leaves.findIndex(e=>norm(e.textContent)===norm(name));
                  let linePrice=null;
                  if(iName>=0){ for(let k=iName+1;k<Math.min(iName+8, leaves.length);k++){ const v=money(leaves[k].textContent); if(v!==null){ linePrice=v; break; } } }
                  if(linePrice===null) throw new Error('guest checkout: product line price not found');
                  if(Math.abs(linePrice-rev)>0.01) throw new Error('guest checkout: product price $'+linePrice.toFixed(2)+' != my revenue $'+rev.toFixed(2));
                  // (d) rows
                  //     [DOM FACT] detail rows come in two shapes:
                  //       - Total   : <p>Total</p> ... <p>$72.75</p>   -> the leaf's text IS 'Total'
                  //       - Subtotal: <X>Subtotal<span>$64.48</span></X> -> 'Subtotal' is a direct text node
                  //     So match the label by "direct text node", then walk up to the nearest ancestor
                  //     that contains an amount.
                  const directText = el => [...el.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join(' ').replace(/\s+/g,' ').trim();
                  const isVisible = el => { const r=el.getBoundingClientRect(); return r.width>0 && r.height>0; };
                  const rowVal = label => {
                    const cands=[...d.querySelectorAll('*')].filter(x=>directText(x)===label && isVisible(x));
                    for(const c of cands){
                      let el=c;
                      for(let k=0; k<4 && el; k++){ const v=money(el.textContent); if(v!==null) return v; el=el.parentElement; }
                    }
                    return null;
                  };
                  // [PRICING FACT] a TDC hub ticket itemises as
                  //   Subtotal (net) + Transaction fees + Service fee = Total
                  // The Service fee is specific to TDC hub tickets; there is no such row on the
                  // AXS/Pear.US checkout.
                  const sub=rowVal('Subtotal');
                  if(sub===null) throw new Error('guest checkout: "Subtotal" row not found');
                  if(Math.abs(sub-rev)>0.01) throw new Error('guest checkout: Subtotal $'+sub.toFixed(2)+' != my revenue $'+rev.toFixed(2));
                  const feeShown=rowVal('Transaction fees');
                  if(feeShown===null) throw new Error('guest checkout: "Transaction fees" row not shown');
                  if(Math.abs(feeShown-fee)>0.01) throw new Error('guest checkout: Transaction fees $'+feeShown.toFixed(2)+' != transaction-fees $'+fee.toFixed(2));
                  const svc=rowVal('Service fee');
                  if(svc===null) throw new Error('guest checkout: "Service fee" row not found (expected for a TDC hub ticket)');
                  const total=rowVal('Total');
                  if(total===null) throw new Error('guest checkout: Total not found');
                  const expect=+(sub+feeShown+svc).toFixed(2);
                  if(Math.abs(total-expect)>0.01) throw new Error('guest checkout: Total $'+total.toFixed(2)+' != Subtotal $'+sub.toFixed(2)+' + Transaction fees $'+feeShown.toFixed(2)+' + Service fee $'+svc.toFixed(2)+' = $'+expect.toFixed(2));
                  return 'checkout verified: line=$'+linePrice.toFixed(2)+' (net), subtotal=$'+sub.toFixed(2)+', transaction fees=$'+feeShown.toFixed(2)+', service fee=$'+svc.toFixed(2)+', total=$'+total.toFixed(2);
                })()

        # 27. Click Total to expand the fee breakdown
        session_guest__R_click_total: { locator: "xpath=//*[normalize-space(.)='Total']", index: 0 }

        # 28. Assert in the expanded breakdown:
        #     Subtotal == my_revenve; Transaction fees == transaction-fees;
        #     when taxes != 0 a "Taxes" row must show Taxes == taxes, when taxes == 0 it must not appear
        session_guest__execute_js_verify_breakdown:
            script: |
                (async () => {
                  const rev={{my_revenve}}, fee={{transaction-fees}}, tax={{taxes}};
                  const drawer = () => [...document.querySelectorAll('.MuiDrawer-root')].find(x=>/Checkout/i.test(x.innerText));
                  let d=null;
                  for(let i=0;i<25;i++){ d=drawer(); if(d && /Subtotal/i.test(d.innerText)) break; await new Promise(r=>setTimeout(r,400)); }
                  if(!d) throw new Error('guest breakdown: Checkout drawer not found');
                  // [DOM FACT] the label of the Subtotal / Transaction fees / Taxes rows is a
                  //   DIRECT TEXT NODE (<X>Subtotal<span>$64.48</span></X>), while the Total row is a
                  //   standalone element (<p>Total</p>). So match the label by "direct text node",
                  //   then walk up to the nearest ancestor that contains an amount.
                  const money2 = s => { const m=String(s).match(/\$\s*([\d,]+(?:\.\d+)?)/); return m?parseFloat(m[1].replace(/,/g,'')):null; };
                  const directText = el => [...el.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join(' ').replace(/\s+/g,' ').trim();
                  const isVisible = el => { const r=el.getBoundingClientRect(); return r.width>0 && r.height>0; };
                  const rowVal = label => {
                    const cands=[...d.querySelectorAll('*')].filter(x=>directText(x)===label && isVisible(x));
                    for(const c of cands){
                      let el=c;
                      for(let k=0; k<4 && el; k++){ const v=money2(el.textContent); if(v!==null) return v; el=el.parentElement; }
                    }
                    return null;
                  };

                  const sub=rowVal('Subtotal');
                  if(sub===null) throw new Error('guest breakdown: "Subtotal" row not found');
                  if(Math.abs(sub-rev)>0.01) throw new Error('guest breakdown: Subtotal $'+sub.toFixed(2)+' != my revenue $'+rev.toFixed(2));

                  const feeShown=rowVal('Transaction fees');
                  if(feeShown===null) throw new Error('guest breakdown: "Transaction fees" row not shown under Subtotal');
                  if(Math.abs(feeShown-fee)>0.01) throw new Error('guest breakdown: Transaction fees $'+feeShown.toFixed(2)+' != transaction-fees $'+fee.toFixed(2));

                  // [PRICING FACT] a TDC hub ticket adds a Service fee row on top of
                  // Subtotal + Transaction fees; it has no counterpart on the AXS/Pear.US checkout.
                  const svc=rowVal('Service fee');
                  if(svc===null) throw new Error('guest breakdown: "Service fee" row not shown (expected for a TDC hub ticket)');
                  if(!(svc>0)) throw new Error('guest breakdown: Service fee is $'+svc+', expected > 0');

                  const taxShown=rowVal('Taxes');
                  if(tax!==0){
                    if(taxShown===null) throw new Error('guest breakdown: taxes='+tax+' (non-zero) but no "Taxes" row is shown');
                    if(Math.abs(taxShown-tax)>0.01) throw new Error('guest breakdown: Taxes $'+taxShown.toFixed(2)+' != taxes $'+tax.toFixed(2));
                  } else {
                    if(taxShown!==null) throw new Error('guest breakdown: taxes=0 but a "Taxes" row is shown ($'+taxShown+')');
                  }
                  return 'breakdown verified: subtotal=$'+sub.toFixed(2)+' (net), transaction fees=$'+feeShown.toFixed(2)+', service fee=$'+svc.toFixed(2)+', taxes='+(taxShown===null?'(hidden, taxes=0)':'$'+taxShown.toFixed(2));
                })()

        # 28b. Save the Service fee so the confirmation-page check (step 37) can assert
        #      Total == Item(s) total + Service fee.
        session_guest__execute_js_extract_service_fee:
            script: |
                (async () => {
                  const money = s => { const m=String(s).match(/\$\s*([\d,]+(?:\.\d+)?)/); return m?parseFloat(m[1].replace(/,/g,'')):null; };
                  const directText = el => [...el.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join(' ').replace(/\s+/g,' ').trim();
                  const d = [...document.querySelectorAll('.MuiDrawer-root')].find(x=>/Checkout/i.test(x.innerText));
                  if(!d) throw new Error('service fee: Checkout drawer not found');
                  for(const c of [...d.querySelectorAll('*')].filter(x=>directText(x)==='Service fee')){
                    let el=c;
                    for(let k=0;k<4 && el;k++){ const v=money(el.textContent); if(v!==null) return v; el=el.parentElement; }
                  }
                  throw new Error('service fee: "Service fee" row not found');
                })()
            save_as: "service_fee"

        # 29. Click Continue with credit card to reach the contact + payment form
        session_guest__R_click_continue_cc: { role: "button", name: "Continue with credit card" }
        sleep_guest_cc_form: 5000

        # 30. Fill in Contact (First name / Last name / Phone / Email)
        session_guest__fill_first_name: { locator: "input[name='contact.firstName']", value: "Lury" }
        session_guest__fill_last_name: { locator: "input[name='contact.lastName']", value: "UIAutomation" }
        session_guest__fill_phone: { locator: "input[name='contact.phoneNumber']", value: "2524001111" }
        session_guest__fill_email: { locator: "input[name='contact.email']", value: "dian.yuhong.ext+111@1m.app" }
        sleep_guest_contact: 1000

        # 31. Fill in Payment (the three Stripe fields live in separate iframes; locate them by
        #     visible iframe order: nth=0 card number / nth=1 expiry / nth=2 CVC)
        session_guest__fill_card_number:
            frame: "iframe[src*='elements-inner-card'] >> nth=0"
            locator: "input[name='cardnumber']"
            value: "4242424242424242"
        sleep_card_number: 1200

        session_guest__fill_expiry:
            frame: "iframe[src*='elements-inner-card'] >> nth=1"
            locator: "input[name='exp-date']"
            value: "830"

        session_guest__fill_cvc:
            frame: "iframe[src*='elements-inner-card'] >> nth=2"
            locator: "input[name='cvc']"
            value: "999"
        sleep_card_rest: 1500

        # Cardholder name + billing zip (zip 90021 is the agreed value, following the existing
        # case convention when the case does not specify one)
        session_guest__fill_card_name: { locator: "input[name='cardName']", value: "lury UI automation" }
        session_guest__fill_zipcode: { locator: "input[name='billingAddress.zipcode']", value: "90021" }
        sleep_guest_payment: 1500

        # 32. Assert the payment form was filled correctly (contact + cardholder name + billing zip;
        #     the card number / expiry / CVC live inside Stripe iframes, written by the framework's
        #     fill steps and traceable in the Allure log)
        session_guest__execute_js_verify_payment_form:
            script: |
                (async () => {
                  const read = n => { const e=document.querySelector('input[name="'+n+'"]'); return e? e.value : null; };
                  const OUT = {
                    firstName: read('contact.firstName'),
                    lastName:  read('contact.lastName'),
                    phone:     read('contact.phoneNumber'),
                    email:     read('contact.email'),
                    cardName:  read('cardName'),
                    zip:       read('billingAddress.zipcode'),
                  };
                  const nonEmpty = s => String(s||'').trim().length > 0;
                  const digits = s => String(s||'').replace(/\D/g,'');
                  if(!nonEmpty(OUT.firstName))      throw new Error('payment form: first name is empty');
                  if(!nonEmpty(OUT.lastName))       throw new Error('payment form: last name is empty');
                  if(digits(OUT.phone).length < 10) throw new Error('payment form: phone is incomplete');
                  if(!/@/.test(OUT.email||''))      throw new Error('payment form: email is empty/invalid');
                  if(String(OUT.cardName||'').trim().split(/\s+/).length < 2) throw new Error('payment form: name on card is empty');
                  if(digits(OUT.zip).length < 5)    throw new Error('payment form: billing zip code is incomplete');
                  return 'payment form filled: '+JSON.stringify(OUT);
                })()

        # 33. Click Place order
        session_guest__R_click_place_order: { role: "button", name: "Place order" }
        sleep_place_order: 8000

        # ==================== order placed + order confirmation page checks ====================
        # 34. [HARD ASSERTION] order placed: the URL must land on /order/<id>/confirmation and
        #     "Your order is confirmed" must appear
        session_guest__execute_js_verify_order_placed:
            script: |
                (async () => {
                  // (1) First wait until we have left the checkout UI. Do NOT loosely match /order/i —
                  //     "Place order" itself contains "order" and would be misjudged on the first poll.
                  const inCheckout = () => /Continue with credit card/i.test(document.body.innerText) || /Place order/i.test(document.body.innerText);
                  for(let i=0;i<60;i++){ if(!inCheckout()) break; await new Promise(r=>setTimeout(r,500)); }

                  // (2) Hard-assert the URL: /order/<orderId>/confirmation
                  const m = String(location.href).match(/\/order\/([A-Za-z0-9_-]+)\/confirmation/);
                  if(!m) throw new Error('order not placed: URL does not match /order/<id>/confirmation -> '+location.href);

                  // (3) Hard-assert the confirmation copy appears in the body
                  let ok=false;
                  for(let i=0;i<40;i++){
                    if(/Your order is confirmed/i.test(document.body.innerText)){ ok=true; break; }
                    await new Promise(r=>setTimeout(r,500));
                  }
                  if(!ok) throw new Error('order not confirmed: "Your order is confirmed" not found; url='+location.href);

                  const body = document.body.innerText.replace(/\s+/g,' ').trim();
                  const c = body.match(/Confirmation\s*#\s*([A-Za-z0-9]+)/);
                  return 'order placed OK | orderId='+m[1]+' | confirmation='+(c?c[1]:'(n/a)')+' | url='+location.href;
                })()
            save_as: "order_result"

        # 35. Assert the price next to "Show summary" == ticket-retails-price
        session_guest__execute_js_verify_show_summary_price:
            script: |
                (async () => {
                  const retail={{ticket-retails-price}};
                  const norm = s => String(s).replace(/\s+/g,' ').trim();
                  const money = s => { const m=String(s).match(/\$\s*([\d,]+(?:\.\d+)?)/); return m?parseFloat(m[1].replace(/,/g,'')):null; };
                  const directText = el => [...el.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join(' ').replace(/\s+/g,' ').trim();
                  const isVisible = el => { const r=el.getBoundingClientRect(); return r.width>0 && r.height>0; };
                  const labelEl = t => [...document.querySelectorAll('*')].find(e=>directText(e)===t && isVisible(e));
                  const headerAmount = () => {
                    const el = labelEl('Show summary');
                    if(!el) return null;
                    const lab = norm(el.textContent);
                    let n = el.parentElement;
                    for(let k=0;k<4 && n;k++){
                      const tail = norm(n.textContent).replace(lab,'').trim();
                      if(tail && tail.length<=16) return tail;   // only a short tail counts as this row's amount
                      n = n.parentElement;
                    }
                    return null;
                  };

                  let raw=null;
                  for(let i=0;i<20;i++){
                    raw = headerAmount();
                    if(raw!==null && money(raw)!==null) break;
                    await new Promise(r=>setTimeout(r,400));
                  }
                  if(raw===null) throw new Error('order page: "Show summary" row not found');
                  const shown = money(raw);
                  if(shown===null) throw new Error('order page: price next to "Show summary" is "'+raw+'", not a $ amount (expected $'+retail.toFixed(2)+')');
                  // [PRICING FACT] on a TDC hub order the header may show the item total (retail) or the
                  // grand total (retail + Service fee); step 37 hard-asserts the detailed rows either way.
                  const grand=+(retail+{{service_fee}}).toFixed(2);
                  if(Math.abs(shown-retail)>0.01 && Math.abs(shown-grand)>0.01)
                    throw new Error('order page: "Show summary" shows $'+shown.toFixed(2)+', expected ticket-retails-price $'+retail.toFixed(2)+' or retail + service fee $'+grand.toFixed(2));
                  return 'show summary price verified: $'+shown.toFixed(2)+' == '+(Math.abs(shown-retail)<=0.01?'ticket-retails-price':'retail + service fee');
                })()

        # 36. Click Show summary to expand the order details
        session_guest__R_click_show_summary: { locator: "xpath=//*[normalize-space(.)='Show summary']" }

        # 37. Assert the details: Item(s) total == Subtotal == ticket-retails-price, and
        #     Total == Item(s) total + Service fee (the TDC hub settlement model), plus an
        #     "(incl. $a fees)" row where a == transaction-fees
        session_guest__execute_js_verify_order_totals:
            script: |
                (async () => {
                  const retail={{ticket-retails-price}}, fee={{transaction-fees}}, svc={{service_fee}};
                  const norm = s => String(s).replace(/\s+/g,' ').trim();
                  const money = s => { const m=String(s).match(/\$\s*([\d,]+(?:\.\d+)?)/); return m?parseFloat(m[1].replace(/,/g,'')):null; };
                  const directText = el => [...el.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join(' ').replace(/\s+/g,' ').trim();
                  const isVisible = el => { const r=el.getBoundingClientRect(); return r.width>0 && r.height>0; };
                  // expanded detail rows: check the tail length first, then read the amount, so we do
                  // not climb too far up and grab the first amount of the whole region
                  const rowVal = (root, label, maxTail) => {
                    maxTail = maxTail || 24;
                    const els=[...root.querySelectorAll('*')].filter(x=>directText(x)===label && isVisible(x));
                    for(const c of els){
                      let el=c;
                      for(let k=0;k<4 && el;k++){
                        const tail = norm(el.textContent).replace(label,'').trim();
                        if(tail.length > maxTail) break;
                        const v = money(tail);
                        if(v!==null) return v;
                        el=el.parentElement;
                      }
                    }
                    return null;
                  };

                  // wait for the details to expand
                  let bodyTxt='';
                  for(let i=0;i<25;i++){
                    bodyTxt = norm(document.body.innerText);
                    if(/Item\(s\) total/i.test(bodyTxt)) break;
                    await new Promise(r=>setTimeout(r,400));
                  }

                  const itemTotal = rowVal(document.body,'Item(s) total');
                  const subtotal  = rowVal(document.body,'Subtotal');
                  const total     = rowVal(document.body,'Total');
                  const chk = (name, v) => {
                    if(v===null) throw new Error('order summary: "'+name+'" row not found (or has no amount)');
                    if(Math.abs(v-retail)>0.01) throw new Error('order summary: '+name+' $'+v.toFixed(2)+' != ticket-retails-price $'+retail.toFixed(2));
                  };
                  chk('Item(s) total', itemTotal);
                  chk('Subtotal', subtotal);
                  // [PRICING FACT] the TDC Total carries the Service fee on top of the item total
                  if(total===null) throw new Error('order summary: "Total" row not found (or has no amount)');
                  const totalExpect=+(retail+svc).toFixed(2);
                  if(Math.abs(total-totalExpect)>0.01) throw new Error('order summary: Total $'+total.toFixed(2)+' != ticket-retails-price $'+retail.toFixed(2)+' + service fee $'+svc.toFixed(2)+' = $'+totalExpect.toFixed(2));

                  // "(including $a fees)" — the actual copy is "(incl. $5.27 fees)"; accept both
                  const amounts=[...bodyTxt.matchAll(/(?:including|incl\.?)\s*\$([\d,]+(?:\.\d+)?)\s*fees/gi)].map(m=>parseFloat(m[1].replace(/,/g,'')));
                  if(!amounts.length) throw new Error('order summary: no "(incl. $x fees)" line found');
                  if(!amounts.some(a=>Math.abs(a-fee)<=0.01)) throw new Error('order summary: $ fees amount is '+JSON.stringify(amounts)+' but transaction-fees = '+fee);
                  return 'order totals verified: item(s) total=$'+itemTotal.toFixed(2)+', subtotal=$'+subtotal.toFixed(2)+', total=$'+total.toFixed(2)+' (retail $'+retail.toFixed(2)+' + service fee $'+svc.toFixed(2)+'), fees=$'+fee.toFixed(2);
                })()

        # 38. Assert the TDC access copy under "Create an account to access your order anytime."
        #     (TDC ticket messageTemplate; the "MLB.com username" shown is the BUYER's email)
        session_guest__execute_js_verify_access_block:
            script: |
                (async () => {
                  // keep in sync with the checkout contact email (step 30 fill_email) and step 39
                  const EMAIL='dian.yuhong.ext+111@1m.app';
                  // normalise curly quotes and en/em dashes and collapse whitespace, so the match
                  // survives the template's soft line breaks ("1\u20132\nhours") and typography
                  const norm = s => String(s)
                    .replace(/[\u2018\u2019\u02bc\u201b]/g, "'")
                    .replace(/[\u2013\u2014\u2012\u2015]/g, '-')
                    .replace(/\s+/g, ' ').trim();
                  const ANCHOR = norm('Create an account to access your order anytime.');
                  const expected = [
                    'How to access your tickets',
                    "You're all set - tickets confirmed! Tickets typically show up in 1-2 hours, and will be available before the event.",
                    'Click View Tickets and log in with your MLB.com username ('+EMAIL+') and password to view your tickets.'
                  ].map(norm);

                  let body='';
                  for(let i=0;i<20;i++){
                    body = norm(document.body.innerText);
                    if(body.includes(ANCHOR) && body.includes(expected[0])) break;
                    await new Promise(r=>setTimeout(r,400));
                  }
                  if(!body.includes(ANCHOR)) throw new Error('order page: anchor "'+ANCHOR+'" not found');
                  const after = body.slice(body.indexOf(ANCHOR) + ANCHOR.length);   // only check what comes BELOW the anchor
                  const missing = expected.filter(l=>!after.includes(l));
                  if(missing.length) throw new Error('TDC access block mismatch, missing under the anchor: '+JSON.stringify(missing));
                  return 'TDC access block verified: '+expected.length+' lines present under the anchor';
                })()

        # 39. Assert Confirmation details: contact information / payment method / billing zip code.
        #     [ORDER MATTERS] this runs BEFORE the "View Tickets" jump (step 38c-38e): jumping to
        #     mpvsb.tickets.com and navigating back to the confirmation URL is unreliable (the
        #     magic-link `?code=` page can hang / not re-render), so we assert while we are already
        #     on the confirmation page and make the jump the LAST thing the guest does.
        session_guest__execute_js_verify_confirmation_details:
            script: |
                (async () => {
                  const retail={{ticket-retails-price}};
                  // [PRICING FACT] on a TDC hub order the "Payment method" line shows the amount
                  // actually CHARGED to the card = grand total = retail + Service fee.
                  const svc={{service_fee}};
                  const NAME='Lury UIAutomation';
                  const PHONE='2524001111';                 // the page formats it as 252-400-1111, so compare digits
                  const EMAIL='dian.yuhong.ext+111@1m.app'; // keep in sync with step 30 fill_email
                  const ZIP='90021';                        // keep in sync with step 31 fill_zipcode
                  const norm = s => String(s).replace(/\s+/g,' ').trim();
                  const digits = s => String(s||'').replace(/\D/g,'');
                  const directText = el => [...el.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join(' ').replace(/\s+/g,' ').trim();
                  const isVisible = el => { const r=el.getBoundingClientRect(); return r.width>0 && r.height>0; };
                  const labelEl = t => [...document.querySelectorAll('*')].find(e=>directText(e)===t && isVisible(e));
                  const valuesAfter = (label, take) => {
                    const el = labelEl(label);
                    if(!el || !el.parentElement) return null;
                    const box = el.parentElement;
                    const leaves=[...box.querySelectorAll('*')].filter(e=>e.children.length===0 && e.textContent.trim());
                    const i = leaves.indexOf(el);
                    return i<0 ? null : leaves.slice(i+1, i+1+take).map(e=>e.textContent.trim());
                  };

                  let contact=null, pay=null, zip=null;
                  for(let i=0;i<30;i++){
                    contact = valuesAfter('Contact information', 3);
                    pay     = valuesAfter('Payment method', 1);
                    zip     = valuesAfter('Billing zip code', 1);
                    if(contact && contact.length>=3 && pay && zip) break;
                    await new Promise(r=>setTimeout(r,500));
                  }

                  if(!contact || contact.length<3) throw new Error('confirmation details: contact information not found (url='+location.href+')');
                  if(norm(contact[0]) !== NAME)          throw new Error('contact information name: got "'+contact[0]+'" want "'+NAME+'"');
                  if(digits(contact[1]) !== PHONE)       throw new Error('contact information phone: got "'+contact[1]+'" want "'+PHONE+'"');
                  if(norm(contact[2]) !== EMAIL)         throw new Error('contact information email: got "'+contact[2]+'" want "'+EMAIL+'"');

                  if(!pay) throw new Error('confirmation details: payment method not found');
                  const pm = norm(pay[0]);
                  const mm = pm.match(/^Visa\s*x(\d{4})\s*-\s*\$?([\d,]+(?:\.\d+)?)$/i);
                  if(!mm) throw new Error('payment method: got "'+pm+'", expected "Visa x4242 - $<ticket-retails-price + service_fee>"');
                  if(mm[1]!=='4242') throw new Error('payment method: card tail is x'+mm[1]+', expected x4242');
                  const paid = parseFloat(mm[2].replace(/,/g,''));
                  const paidExpect=+(retail+svc).toFixed(2);
                  if(Math.abs(paid-paidExpect)>0.01) throw new Error('payment method amount: $'+paid.toFixed(2)+' != ticket-retails-price $'+retail.toFixed(2)+' + service fee $'+svc.toFixed(2)+' = $'+paidExpect.toFixed(2));

                  if(!zip) throw new Error('confirmation details: billing zip code not found');
                  if(digits(zip[0]) !== ZIP) throw new Error('billing zip code: got "'+zip[0]+'" want "'+ZIP+'"');

                  return 'confirmation details verified: contact='+NAME+' / '+contact[1]+' / '+contact[2]
                       + ' | payment='+pm+' | billing zip='+zip[0];
                })()

        # 38c. Locate the "View Tickets" control under the access copy and assert it points at
        #      https://mpvsb.tickets.com/ -> temp var view_tickets_url
        session_guest__execute_js_capture_view_tickets:
            script: |
                () => {
                  const pick = () => [...document.querySelectorAll('a,button,[role="button"]')]
                    .filter(e => /View\s*Tickets/i.test((e.textContent||'').replace(/\s+/g,' ').trim()))
                    .sort((a,b)=>(a.textContent||'').length-(b.textContent||'').length)[0] || null;
                  const el = pick();
                  if(!el) throw new Error('order page: "View Tickets" button not found');
                  const url = el.getAttribute('href') || el.href || '';
                  if(url && !/^https:\/\/mpvsb\.tickets\.com\//i.test(url))
                    throw new Error('order page: "View Tickets" href is "'+url+'", expected https://mpvsb.tickets.com/...');
                  return url || '(no href; destination verified by the click in 38e)';
                }
            save_as: "view_tickets_url"
        sleep_view_tickets_href: 500

        # 38d. Click "View Tickets". Force a same-tab jump (also redirect any window.open) so the
        #      destination can be asserted in the next step.
        session_guest__execute_js_click_view_tickets:
            script: |
                () => {
                  const pick = () => [...document.querySelectorAll('a,button,[role="button"]')]
                    .filter(e => /View\s*Tickets/i.test((e.textContent||'').replace(/\s+/g,' ').trim()))
                    .sort((a,b)=>(a.textContent||'').length-(b.textContent||'').length)[0] || null;
                  const el = pick();
                  if(!el) throw new Error('order page: "View Tickets" button not found');
                  try { if(el.tagName === 'A') el.setAttribute('target','_self'); } catch(_){}
                  window.open = function(u){ const s=(typeof u==='string')?u:(u&&u.toString?u.toString():''); if(s) location.href = s; return window; };
                  // fire on the next tick so this evaluate returns before the navigation starts
                  setTimeout(()=>el.click(), 0);
                  return 'clicked "View Tickets" -> {{view_tickets_url}}';
                }
        sleep_view_tickets_nav: 6000

        # 38e. [HARD ASSERTION] the "View Tickets" click must land on https://mpvsb.tickets.com/
        session_guest__execute_js_verify_view_tickets_nav:
            script: |
                (async () => {
                  const EXPECT='mpvsb.tickets.com';
                  for(let i=0;i<30;i++){
                    if(String(location.host).includes(EXPECT)) break;
                    await new Promise(r=>setTimeout(r,500));
                  }
                  if(!String(location.host).includes(EXPECT))
                    throw new Error('View Tickets did not reach '+EXPECT+'; current url = '+location.href);
                  return 'View Tickets navigation verified: '+location.href;
                })()

        # NOTE: the AXS sibling case (axs_fee_breakdown_ui.yaml) continues after this point with a
        #       partner session and a full-refund flow that asserts Net Earning == -transaction-fees.
        #       Both are intentionally ABSENT here:
