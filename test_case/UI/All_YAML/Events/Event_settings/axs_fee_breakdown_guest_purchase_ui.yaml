# author: Lury
# time: 2026/10/12 17:24
# optimized: 2026/10/14 — rewritten to use framework-native actions only (no `script` fields),
#           step design follows the clean native style (scope / conditional assertions).

# --- testT5649_axs: Guest place order and check fee breakdown ---
testT5649_axs_guest_purchase:
    is_mobile: true
    description: "Verify the fee breakdown for AXS ticket on checkout - then place order - check AXS info on order confirmation page - refund"
    test_step:
        # 1. Create the guest session (no cookie = visitor); saved temp vars are copied into it
        create_session_guest: { name: "guest" }

        # 2. As a guest, open the public post (native open replaces the old execute_js goto)
        session_guest__open: { url: "{{post_url}}" }
        sleep_guest_post: 5000

        # 3. As a guest, find the product by name in the post and assert its displayed price.
        #    [DOM FACT verified 2026-10-15] the guest-facing product card shows the NET price
        #    (face value, e.g. GA Pit $114.90) — the partner-side retail price incl. fees
        #    (ticket-retails-price = 128.77) never appears on the public post, so assert
        #    my_revenve (= retail - incl. fees, computed by the seeder) here.
        session_guest__verify_product_name: { text: "{{ticket_axs}}" }
        session_guest__verify_product_price: { text: "{{my_revenve}}" }

        # ==================== guest checkout flow ====================
        # 4. As a guest, click the ticket-axs product name on the public post to open the "Select tickets" drawer
        session_guest__R_click_product: { locator: "xpath=//*[normalize-space(.)='{{ticket_axs}}']", index: 0 }

        # 5. Assert the "Select tickets" drawer opened and its price == my_revenve
        #    (same display semantics as the product card: the guest sees the net price)
        session_guest__verify_select_drawer_open: { text: "Select tickets" }
        session_guest__verify_select_drawer_price: { text: "{{my_revenve}}" }

        # 6. Click "+" to raise the quantity from 0 to 1
        session_guest__R_click_qty_add: { locator: "button[aria-label='Add']", index: 0 }

        # 7. Assert the quantity really went from 0 to 1 (Playwright-native input_value check)
        session_guest__verify_value_qty: { locator: ".MuiDrawer-root input[type='number']", value: "1", timeout: 15000 }

        # 8. Click Buy now and wait to reach the Checkout drawer
        session_guest__R_click_buy_now: { role: "button", name: "Buy now" }
        sleep_guest_checkout: 3000

        # 9. Assert on the Checkout drawer: product name == ticket-axs; unit price == my_revenve;
        #     no "(incl. $ fees)" all-inclusive suffix; Total row is present.
        #     (The computed Total == my_revenve + transaction-fees + taxes check from the old JS step is
        #      replaced by visible-label assertions, since native `verify` cannot do arithmetic.)
        session_guest__verify_checkout_open: { text: "Checkout" }
        session_guest__verify_checkout_product: { text: "{{ticket_axs}}" }
        session_guest__verify_checkout_unit_price: { text: "{{my_revenve}}" }
        session_guest__verify_checkout_no_incl: { text: "incl.", assert_not_visible: true }
        session_guest__verify_checkout_total_label: { text: "Total" }

        # 10. Click Total to expand the fee breakdown
        session_guest__R_click_total: { locator: "xpath=//*[normalize-space(.)='Total']", index: 0 }

        # 11. In the expanded breakdown: Subtotal == my_revenve; Transaction fees == transaction-fees;
        #     when taxes != 0 a "Taxes" row must show Taxes == taxes, when taxes == 0 it must not appear.
        session_guest__verify_subtotal_label: { text: "Subtotal" }
        session_guest__verify_subtotal_value: { text: "{{my_revenve}}" }
        session_guest__verify_txn_fees_label: { text: "Transaction fees" }
        session_guest__verify_txn_fees_value: { text: "{{transaction-fees}}" }
        session_guest__if_taxes_row:
            condition: { text: "Taxes", timeout: 5000 }
            then:
                verify_taxes_value: { text: "{{taxes}}" }
            else:
                verify_taxes_hidden: { text: "Taxes", assert_not_visible: true }

        # 12. Click Continue with credit card to reach the contact + payment form
        session_guest__R_click_continue_cc: { role: "button", name: "Continue with credit card" }
        sleep_guest_cc_form: 5000

        # 13. Fill in Contact (First name / Last name / Phone / Email)
        session_guest__fill_first_name: { locator: "input[name='contact.firstName']", value: "Lury" }
        session_guest__fill_last_name: { locator: "input[name='contact.lastName']", value: "UIAutomation" }
        session_guest__fill_phone: { locator: "input[name='contact.phoneNumber']", value: "2524001111" }
        session_guest__fill_email: { locator: "input[name='contact.email']", value: "dian.yuhong.ext+111@1m.app" }
        sleep_guest_contact: 1000

        # 14. Fill in Payment (the three Stripe fields live in separate iframes; locate them by
        #     visible iframe order: nth=0 card number / nth=1 expiry / nth=2 CVC)
        session_guest__fill_card_number:
            frame: "iframe[src*='elements-inner-card'] >> nth=0"
            locator: "input[name='cardnumber']"
            value: "4242424242424242"
        sleep_card_number: 1200

        session_guest__fill_expiry:
            frame: "iframe[src*='elements-inner-card'] >> nth=1"
            locator: "input[name='exp-date']"
            value: "830"

        session_guest__fill_cvc:
            frame: "iframe[src*='elements-inner-card'] >> nth=2"
            locator: "input[name='cvc']"
            value: "999"
        sleep_card_rest: 1500

        # Cardholder name + billing zip (zip 90021 is the agreed value, following the existing
        # case convention when the case does not specify one)
        session_guest__fill_card_name: { locator: "input[name='cardName']", value: "lury UI automation" }
        session_guest__fill_zipcode: { locator: "input[name='billingAddress.zipcode']", value: "90021" }
        sleep_guest_payment: 1500

        # 15. Assert the payment form was filled correctly (Playwright-native input_value assertions;
        #     the phone field is auto-formatted, so its format is checked later as visible text)
        session_guest__verify_value_first_name: { locator: "input[name='contact.firstName']", value: "Lury" }
        session_guest__verify_value_last_name: { locator: "input[name='contact.lastName']", value: "UIAutomation" }
        session_guest__verify_value_email: { locator: "input[name='contact.email']", value: "dian.yuhong.ext+111@1m.app" }
        session_guest__verify_value_card_name: { locator: "input[name='cardName']", value: "lury UI automation" }
        session_guest__verify_value_zipcode: { locator: "input[name='billingAddress.zipcode']", value: "90021" }

        # 16. Click Place order
        session_guest__R_click_place_order: { role: "button", name: "Place order" }
        sleep_place_order: 8000

        # ==================== order placed + order confirmation page checks ====================
        # 17. [HARD ASSERTION] order placed (Playwright-native): wait_for_url polls until the
        #     URL lands on /order/<id>/confirmation, then the confirmation copy must be visible.
        session_guest__wait_for_url_order_confirmation:
            url: "**/order/**/confirmation"
            timeout: 30000
        session_guest__verify_order_confirmed: { text: "Your order is confirmed", timeout: 20000 }

        # 18. Assert the price next to "Show summary" == ticket-retails-price
        session_guest__verify_show_summary_price: { text: "{{ticket-retails-price}}" }

        # 19. Click Show summary to expand the order details
        session_guest__R_click_show_summary: { locator: "xpath=//*[normalize-space(.)='Show summary']" }

        # 20. Assert the details: Item(s) total / Subtotal / Total all equal ticket-retails-price,
        #     and an "(incl. $a fees)" row exists where a == transaction-fees
        session_guest__verify_item_total_label: { text: "Item(s) total" }
        session_guest__verify_item_total_value: { text: "{{ticket-retails-price}}" }
        session_guest__verify_order_subtotal_label: { text: "Subtotal" }
        session_guest__verify_order_subtotal_value: { text: "{{ticket-retails-price}}" }
        session_guest__verify_order_total_label: { text: "Total" }
        session_guest__verify_order_total_value: { text: "{{ticket-retails-price}}" }
        session_guest__verify_order_incl_fees: { text: "incl." }
        session_guest__verify_order_incl_fees_value: { text: "{{transaction-fees}}" }

        # 21. Assert the AXS hint copy under "Create an account to access your order anytime."
        #     (Playwright-native text assertions; each line is unique on the page. The AXS hint
        #     shows the BUYER's email — keep in sync with step 13 fill_email.)
        session_guest__verify_axs_anchor: { text: "Create an account to access your order anytime.", timeout: 20000 }
        session_guest__verify_axs_title: { text: "Access your tickets in AXS" }
        session_guest__verify_axs_app_line: { text: "Your tickets will be available through AXS Mobile ID in the AXS app." }
        session_guest__verify_axs_entry_line: { text: "Open the app and show your Mobile ID at entry to scan and enter — no paper tickets required." }
        session_guest__verify_axs_started: { text: "Getting started" }
        session_guest__verify_axs_step1: { text: "1. Download the AXS app" }
        session_guest__verify_axs_step2: { text: "2. Sign in to your AXS account with (dian.yuhong.ext+111@1m.app)" }
        session_guest__verify_axs_step3: { text: "3. Open your Mobile ID at the door to scan and enter" }
        session_guest__verify_axs_note: { text: "Some events may delay or disable ticket delivery or transfer." }

        # 22. Assert Confirmation details: contact information / payment method / billing zip code
        #     (Playwright-native text assertions for the static parts; the paid amount equals ticket-retails-price)
        session_guest__verify_contact_name: { text: "Lury UIAutomation", timeout: 20000 }
        session_guest__verify_contact_phone: { text: "252-400-1111" }
        session_guest__verify_contact_email: { text: "dian.yuhong.ext+111@1m.app" }
        session_guest__verify_card_tail: { text: "Visa x4242" }
        session_guest__verify_zip_code: { text: "90021", exact: true }
        session_guest__verify_paid_amount: { text: "{{ticket-retails-price}}" }

    expect_result:
        description: "Guest purchase of the AXS ticket completes and the confirmation page shows correct fee breakdown, totals and AXS info"
        assertions: []
