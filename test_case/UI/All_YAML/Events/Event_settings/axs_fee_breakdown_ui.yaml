# time: 2026/9/22 14:16

# --- testT5649_axs: AXS-tagged event, verify a ticket name ends with "Pear.Us" ---
testT5649_axs:
    is_mobile: true
    description: "Verify the fee breakdown for AXS ticket on checkout - then place order - check AXS info on order confirmation page - refund"
    expect_result: "Checkout shows a fee breakdown for the AXS ticket; order can be placed and the confirmation page shows AXS info; partner can refund the order"
    test_step:
        # 1. Go to the event list page
        open: "{BASE_URL}/events"
        sleep_list: 5000

        # 2. Save the event name of the event card that carries the AXS tag -> GLOBAL event_axs.
        #    [DE-JS 2026-10-16] was a 30 x 500ms polling execute_js over
        #    document.querySelectorAll('span'). [DOM FACT] the badge is a leaf <span>AXS</span> and
        #    its parent row holds a single <p>, which IS the event name; `extract_value` polls
        #    internally, so the manual retry loop disappears.
        extract_value_axs_event:
            locator: "xpath=(//span[normalize-space(.)='AXS']/parent::*//p)[1]"
            source: text
            numeric: false
            save_as: "event_axs"
            global: true
            timeout: 20000
        sleep_extract_axs_event: 800

        # 2b. Click the event card that carries the AXS tag.
        R_click_axs_event: { locator: "xpath=//span[normalize-space(.)='AXS']/parent::*", index: 0, fallback_scan: true }
        sleep_event: 5000

        # 3. Open the "Tickets & Merch" tab where ticket names are listed
        R_click_tickets_tab: { role: "tab", name: "Tickets & Merch" }
        sleep_tickets: 3000

        # 4. [ASSERTION, native] at least one ticket name ENDS WITH "Pear.Us", and save the first
        #    such name into ticket_axs.
        #    [DE-JS 2026-10-16] the JS scanned every element and ran `endsWith('pear.us')`. Natively:
        #    the card filter `contains(., 'Pear.US')` narrows to Pear.US-listed tickets, and the
        #    anchored `Pear\.US$` regex on the NAME element states the "ends with" claim exactly.
        verify_text_regex_pear_us_ticket_name:
            scope:
                locator: "xpath=(//div[@data-testid='mui-stack'][.//button[@data-testid='enhance-button']][contains(., 'Pear.US')]//p)[1]"
            pattern: "Pear\\.US$"
            flags: "i"
            timeout: 20000
        extract_value_pear_us_ticket:
            locator: "xpath=(//div[@data-testid='mui-stack'][.//button[@data-testid='enhance-button']][contains(., 'Pear.US')][not(contains(., 'Sold out'))]//p)[1]"
            source: text
            numeric: false
            save_as: "ticket_axs"
            global: true
            timeout: 20000
        sleep_extract_pear_us: 800

        # 5. Open event Settings (drawer). Reachable from the Tickets & Merch tab too.
        R_click_settings: { role: "button", name: "Settings" }
        sleep_settings: 3000

        # 6. Enable "Show fee breakdown at checkout".
        #    smart_check is idempotent (set_checked no-ops when already ON) and Playwright's
        #    set_checked hard-asserts the resulting state ("Clicking the checkbox did not
        #    change its state" on failure) -> no extra JS check needed.
        check_fee_breakdown: { locator: "xpath=//input[@name='showFeesBreakdown']", checked: true }
        sleep_fee: 1500

        # 7. Save the settings (drawer closes on success).
        R_click_save: { name: "Save" }
        sleep_save: 3000

        # 9. [REMOVED 2026-10-16] the old `execute_js_extract_name` re-scanned the whole DOM for
        #    "the first non-Sold-out Pear.US card" and re-saved ticket_axs — but step 4's
        #    `extract_value_pear_us_ticket` above already saves EXACTLY that value from the same
        #    card (identical locator, identical `[not(contains(., 'Sold out'))]` filter). The JS
        #    block was pure duplication, so it is deleted rather than translated.

        # 10. Save the target ticket's retail price (the first "$" amount on that card)
        #     -> GLOBAL ticket-retails-price.
        #     Playwright-native (was execute_js): read the card element's text and pull the first
        #     money token out of it with a regex — `extract_value` supports `regex` + `source: text`.
        extract_value_retail_price:
            locator: "xpath=(//div[@data-testid='mui-stack'][.//button[@data-testid='enhance-button']][contains(., 'Pear.US')][not(contains(., 'Sold out'))])[1]"
            source: text
            regex: "\\$\\s*([\\d,]+(?:\\.\\d+)?)"
            save_as: "ticket-retails-price"
            global: true
            timeout: 20000
        sleep_extract_price: 500

        # 10b. Save the "(incl. $x fees)" amount, then compute my_revenve = retail - incl.
        #      Playwright-native (was execute_js): `extract_value` + `regex` reads the incl amount,
        #      `compute_value` does the money math — no JS arithmetic.
        extract_value_incl_fees:
            locator: "xpath=(//div[@data-testid='mui-stack'][.//button[@data-testid='enhance-button']][contains(., 'Pear.US')][not(contains(., 'Sold out'))])[1]"
            source: text
            regex: "incl\\.?\\s*\\$\\s*([\\d,]+(?:\\.\\d+)?)"
            save_as: "incl_fees_price"
            timeout: 20000
        compute_value_my_revenue:
            expression: "{{ticket-retails-price}} - {{incl_fees_price}}"
            save_as: "my_revenve"
            global: true
        sleep_extract_rev: 800

        # === Open the ticket-axs product -> Edit ticket page -> read the fee breakdown -> go back ===

        # 11. Click the ticket-axs product (located by the temp var name) to enter the Edit ticket page
        R_click_ticket: { locator: "xpath=//p[normalize-space(.)='{{ticket_axs}}']" }

        # 11b. [RACE FIX 2026-10-16] the SPA product route can mount before its data, leaving the
        #      "Edit ticket" page blank (header only) so the "Fees + Taxes" value never renders (this
        #      is what took tdc_fee_breakdown_ui.yaml down on release). Wait for the value natively;
        #      when the page is still blank, reload once and wait again. No JS — smart_if +
        #      wait_for_selector + reload are all framework-native actions.
        if_edit_ticket_form_rendered:
            condition:
                locator: "xpath=//*[normalize-space(.)='Fees + Taxes']/following-sibling::*[1][not(self::button)]"
                state: visible
                timeout: 12000
            else:
                reload_edit_ticket: { sleep_after: 4000 }
                wait_for_selector_edit_ticket_form:
                    locator: "xpath=//*[normalize-space(.)='Fees + Taxes']/following-sibling::*[1][not(self::button)]"
                    timeout: 30000
        sleep_edit_ticket: 1000

        # 12. Click the price under "Fees + Taxes" to open the breakdown popover.
        #     [LOCATOR FIX 2026-10-16] was `.../following-sibling::*[1]` with `index: 1` (1st match
        #     = tooltip <button>, 2nd = the value <div>); excluding the tooltip selects the value
        #     directly and no longer depends on the exact match count.
        R_click_fees_taxes:
            locator: "xpath=//*[normalize-space(.)='Fees + Taxes']/following-sibling::*[1][not(self::button)]"
        sleep_fees_tip: 2000

        # 13. Extract "Platform fees" from the popover -> GLOBAL transaction-fees.
        #     Playwright-native (was execute_js): `extract_row_value` walks the labelled MUI row.
        #     `signed: false` — a fee row can never be negative; the default signed walk would
        #     otherwise fold a neighbouring "−" glyph into the amount and publish a dirty value
        #     (observed as -7.77 on the buyer-side drawer).
        extract_row_value_platform_fees:
            label: "Platform fees"
            scope: ".MuiPopover-root"
            save_as: "transaction-fees"
            global: true
            signed: false
            timeout: 15000

        # 14. Extract "Taxes" from the popover -> GLOBAL taxes (same native row walk).
        extract_row_value_taxes:
            label: "Taxes"
            scope: ".MuiPopover-root"
            save_as: "taxes"
            global: true
            signed: false
            timeout: 15000

        # 15. This price popover is a modal and covers the Back button, so press Escape to close it
        press_close_popover: { key: "Escape" }
        sleep_after_esc: 1200
        R_click_close_ticket: { locator: "button[aria-label='Back']" }
        sleep_back: 3000

        # 15b. Conditional unsaved-changes guard: clicking Back may pop an in-app
        smart_click_optional_leave_without_saving: { text: "Leave without saving" }
        sleep_leave: 1500

        # 16. Read the event's PUBLIC post URL straight from the "Post" tab -> GLOBAL post_url.
        #     [DE-JS 2026-10-16] was two JS blocks: one scraped the event name out of document.body
        #     innerText, the next lower-cased it and slugified it into an ASSUMED
        #     `.../autotestshop/post/<slug>` URL. That guess silently rots whenever the slug rule or
        #     the event name changes. The Post tab renders the real, published post link in a button
        #     whose text contains "/post/", so we read the link itself — no name, no slugify, no JS.
        R_click_post_tab: { locator: "xpath=//*[@role='tab' or self::button][normalize-space(.)='Post']", index: 0 }
        sleep_post_tab: 4000
        extract_value_post_url_raw:
            locator: "xpath=//button[contains(., '/post/')]"
            source: content
            strip_whitespace: true
            regex: "[A-Za-z0-9.-]+\\.pear\\.us/[A-Za-z0-9._-]+/post/[A-Za-z0-9._-]+"
            numeric: false
            save_as: "post_url_raw"
            timeout: 20000
        set_value_post_url:
            value: "https://{{post_url_raw}}"
            save_as: "post_url"
            global: true
        sleep_post_url: 800

