# time: 2026/9/22 14:16

# --- testT5649_axs: AXS-tagged event, verify a ticket name ends with "Pear.Us" ---
testT5649_axs:
    is_mobile: true
    description: "Verify the fee breakdown for AXS ticket on checkout - then place order - check AXS info on order confirmation page - refund"
    expect_result: "Checkout shows a fee breakdown for the AXS ticket; order can be placed and the confirmation page shows AXS info; partner can refund the order"
    test_step:
        # 1. Go to the event list page
        open: "{BASE_URL}/events"
        sleep_list: 5000

        # 2. Find the event card that carries the AXS tag and save its event name into the
        execute_js_extract_axs_event:
            save_as: "event_axs"
            global: true
            script: |
                (async () => {
                  // [DOM FACT] the AXS badge's parent row has a single <p> holding the event name;
                  // the list renders asynchronously, so poll (30 x 500ms)
                  const nz = e => (e.textContent||'').replace(/\s+/g,' ').trim();
                  for (let i = 0; i < 30; i++) {
                    const badge = [...document.querySelectorAll('span')].find(s => !s.children.length && nz(s) === 'AXS');
                    const name = badge && badge.parentElement.querySelector('p');
                    if (name && nz(name)) return nz(name);
                    await new Promise(r => setTimeout(r, 500));
                  }
                  throw new Error('AXS event card not found in the event list (or its name <p> is empty)');
                })()
        sleep_extract_axs_event: 800

        # 2b. Click the event card that carries the AXS tag.
        R_click_axs_event: { locator: "xpath=//span[normalize-space(.)='AXS']/parent::*", index: 0, fallback_scan: true }
        sleep_event: 5000

        # 3. Open the "Tickets & Merch" tab where ticket names are listed
        R_click_tickets_tab: { role: "tab", name: "Tickets & Merch" }
        sleep_tickets: 3000

        # 4. Verify a ticket name ends with "Pear.Us", and save the first such name into the
        execute_js_extract_pear_us_ticket:
            save_as: "ticket_axs"
            global: true
            script: |
                () => {
                    const nz = e => (e.textContent||'').replace(/\s+/g,' ').trim();
                    const hits = [...document.querySelectorAll('h1,h2,h3,h4,h5,h6,p,span,div,li,label,a,button')]
                        .filter(e => !e.children.length && nz(e).toLowerCase().endsWith('pear.us'))
                        .map(nz);
                    if (!hits.length) throw new Error('No ticket name ends with "Pear.Us"');
                    return hits[0];
                }

        # 5. Open event Settings (drawer). Reachable from the Tickets & Merch tab too.
        R_click_settings: { role: "button", name: "Settings" }
        sleep_settings: 3000

        # 6. Enable "Show fee breakdown at checkout".
        #    smart_check is idempotent (set_checked no-ops when already ON) and Playwright's
        #    set_checked hard-asserts the resulting state ("Clicking the checkbox did not
        #    change its state" on failure) -> no extra JS check needed.
        check_fee_breakdown: { locator: "xpath=//input[@name='showFeesBreakdown']", checked: true }
        sleep_fee: 1500

        # 7. Save the settings (drawer closes on success).
        R_click_save: { name: "Save" }
        sleep_save: 3000

        # 9. Extract the target ticket: the name of the first non-"Sold out"
        #    product on the Tickets tab -> temp var ticket-axs, re-published to the
        #    cross-case global var ticket_axs (overrides step 4's sold-out-prone first hit)
        execute_js_extract_name:
            save_as: "ticket_axs"
            global: true
            script: |
                () => {
                  // product card = outermost element containing exactly one "Pear.US" + $/sold/Tools
                  const cards=[...document.querySelectorAll('*')].filter(el => {
                    const t=el.textContent||'';
                    return /Pear\.US/.test(t) && t.includes('Tools') && /\$/.test(t) && /sold/i.test(t) && (t.match(/Pear\.US/g)||[]).length===1;
                  });
                  const card=cards.filter(c => !cards.some(o => o!==c && o.contains(c)))
                    .map(c => (c.textContent||'').replace(/\s+/g,' ').trim())
                    .find(t => !/Sold out/i.test(t));
                  if(!card) throw new Error('No non-Sold-out ticket found');
                  return (card.match(/([^$]+?)\$[\d.]+/)[1]).replace(/Tools$/,'').replace(/^Ticket/,'').trim();
                }
        sleep_extract_name: 800

        # 10. Extract the target ticket's price (the first $ amount on the card = retail price)
        #     -> temp var ticket-retails-price
        execute_js_extract_retail_price:
            save_as: "ticket-retails-price"
            global: true
            script: |
                () => {
                  const cards=[...document.querySelectorAll('*')].filter(el => {
                    const t=el.textContent||'';
                    return /Pear\.US/.test(t) && t.includes('Tools') && /\$/.test(t) && /sold/i.test(t) && (t.match(/Pear\.US/g)||[]).length===1;
                  });
                  const card=cards.filter(c => !cards.some(o => o!==c && o.contains(c)))
                    .map(c => (c.textContent||'').replace(/\s+/g,' ').trim())
                    .find(t => !/Sold out/i.test(t));
                  if(!card) throw new Error('No non-Sold-out ticket found');
                  const priceM=card.match(/\$([\d.]+)/);
                  if(!priceM) throw new Error('Ticket price not found in card: '+card);
                  return +parseFloat(priceM[1]).toFixed(2);
                }
        sleep_extract_price: 500

        # 10b. Extract the "incl." amount and compute my_revenve = price - incl -> temp var my_revenve
        execute_js_extract_revenue:
            save_as: "my_revenve"
            global: true
            script: |
                () => {
                  const cards=[...document.querySelectorAll('*')].filter(el => {
                    const t=el.textContent||'';
                    return /Pear\.US/.test(t) && t.includes('Tools') && /\$/.test(t) && /sold/i.test(t) && (t.match(/Pear\.US/g)||[]).length===1;
                  });
                  const card=cards.filter(c => !cards.some(o => o!==c && o.contains(c)))
                    .map(c => (c.textContent||'').replace(/\s+/g,' ').trim())
                    .find(t => !/Sold out/i.test(t));
                  if(!card) throw new Error('No non-Sold-out ticket found');
                  const price=parseFloat(card.match(/\$([\d.]+)/)[1]);
                  const incl=parseFloat(card.match(/incl\.?\s*\$([\d.]+)/i)[1]);
                  return +(price-incl).toFixed(2);
                }
        sleep_extract_rev: 800

        # === Open the ticket-axs product -> Edit ticket page -> read the fee breakdown -> go back ===

        # 11. Click the ticket-axs product (located by the temp var name) to enter the Edit ticket page
        R_click_ticket: { locator: "xpath=//p[normalize-space(.)='{{ticket_axs}}']" }
        sleep_edit_ticket: 6000

        # 12. Click the price under "Fees + Taxes" (the 2nd match = the price; the 1st match is
        R_click_fees_taxes: { locator: "xpath=//*[normalize-space(.)='Fees + Taxes']/following-sibling::*[1]", index: 1 }
        sleep_fees_tip: 2000

        # 13. Extract "Platform fees" from the popover -> temp var transaction-fees
        execute_js_extract_platform_fees:
            save_as: "transaction-fees"
            global: true
            script: |
                () => {
                  const pop=[...document.querySelectorAll('.MuiPopover-root, .MuiPaper-root')].find(e => /Platform fees/i.test(e.textContent));
                  const m=pop && (pop.textContent.replace(/\s+/g,' ').match(/Platform fees\s*\$?\s*([\d.]+)/i)||[])[1];
                  if(!m) throw new Error('fees breakdown popover / "Platform fees" amount not found');
                  return parseFloat(m);
                }

        # 14. Extract "Taxes" from the popover -> temp var taxes
        execute_js_extract_taxes:
            save_as: "taxes"
            global: true
            script: |
                () => {
                  const pop=[...document.querySelectorAll('.MuiPopover-root, .MuiPaper-root')].find(e => /Platform fees/i.test(e.textContent));
                  const m=pop && (pop.textContent.replace(/\s+/g,' ').match(/Taxes\s*\$?\s*([\d.]+)/i)||[])[1];
                  if(!m) throw new Error('fees breakdown popover / "Taxes" amount not found');
                  return parseFloat(m);
                }

        # 15. This price popover is a modal and covers the Back button, so press Escape to close it
        press_close_popover: { key: "Escape" }
        sleep_after_esc: 1200
        R_click_close_ticket: { locator: "button[aria-label='Back']" }
        sleep_back: 3000

        # 15b. Conditional unsaved-changes guard: clicking Back may pop an in-app
        smart_click_optional_leave_without_saving: { text: "Leave without saving" }
        sleep_leave: 1500

        # 16. Extract the event name (used to build the guest public post URL) -> temp var event_name
        execute_js_extract_event:
            save_as: "event_name"
            script: |
                () => {
                  const m=document.body.innerText.replace(/\s+/g,' ').match(/([A-Za-z0-9_'’\- ]{1,50}?)\s*(Mon|Tue|Wed|Thu|Fri|Sat|Sun|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d/i);
                  const h=document.querySelector('h1,h2');
                  return (m && m[1].trim()) || (h && h.textContent.trim()) || document.title.trim();
                }

        # 17. Slugify the event name into the guest-accessible public post URL -> GLOBAL var post_url
        #     (published cross-case so axs_fee_breakdown_guest_purchase_ui.yaml can reuse it)
        execute_js_extract_url:
            save_as: "post_url"
            global: true
            script: "() => 'https://release.pear.us/autotestshop/post/' + '{{event_name}}'.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')"

