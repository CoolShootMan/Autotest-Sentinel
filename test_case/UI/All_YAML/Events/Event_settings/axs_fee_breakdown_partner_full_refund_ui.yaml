# author: Lury
# time: 2026/10/12 17:30
# optimized: 2026/10/15 — rewritten to use framework-native actions only (no `script` fields).
#           The first order id is no longer extracted via execute_js; the first order in the
#           list is clicked directly with a native locator. The post-refund Net Earning
#           assertion waits for the native negative value text instead of polling inside JS.

# --- testT5649_axs_partner_full_refund: Partner full refund the axs order ---
testT5649_axs_partner_full_refund:
    is_mobile: true
    description: "Partner full refund of the AXS order — verify Net Earning flips to -transaction-fees"
    test_step:
        # 1. Create the partner session and open the event list
        session_partner__open: { url: "{BASE_URL}/events", cookie_file: "test_case/UI/cookie_{ENV}.json" }
        sleep_partner_events: 6000

        # 2. Enter the AXS event (same locator as the seeder, lands on the event page)
        session_partner__R_click_axs_event: { locator: "xpath=//span[normalize-space(.)='AXS']/parent::*", index: 0, fallback_scan: true }
        sleep_partner_event: 6000

        # 3. As the partner, click the Sales tab on the event page
        session_partner__R_click_sales_tab: { locator: "xpath=//button[@role='tab'][normalize-space(.)='Sales']" }
        sleep_partner_sales: 3500

        # 4. Then click the Orders sub-tab under Sales
        session_partner__R_click_orders_tab: { locator: "xpath=//*[@role='tab'][normalize-space(.)='Orders']" }
        sleep_partner_orders: 5000

        # 5. Click the FIRST order in the list to open the Sale details page.
        #    Native locator: the first span whose text is an order id (#Pxxxxx) — no JS extraction.
        #    NOTE: use the [0-9] character class, NOT \d — Playwright's CSS engine consumes a
        #    single backslash as a CSS escape, so "\d" degrades to "d" and never matches.
        session_partner__R_click_first_order: { locator: "span:text-matches('#P[0-9]+')" }
        sleep_partner_sale_details: 6000

        # 6. On the Sale details page, click the "I want to ..." dropdown trigger
        session_partner__R_click_i_want_to: { locator: "xpath=//*[normalize-space(.)='I want to']" }
        sleep_partner_i_want_to: 2500

        # 7. Choose Full refund from the dropdown
        session_partner__R_click_full_refund: { locator: "[role=menuitem]:has-text('Full refund')" }
        sleep_partner_full_refund: 3500

        # 8. Type the refund notes into the "Confirm Full Refund" drawer
        session_partner__fill_refund_notes: { locator: "textarea[placeholder='Add a short note for yourself (optional)']", value: "AXS UI automation" }
        sleep_partner_notes: 800

        # 9. Verify the refund notes were written (Playwright-native input_value check;
        #     guard: do not click Refund if the fill failed)
        session_partner__verify_value_refund_notes:
            locator: "textarea[placeholder='Add a short note for yourself (optional)']"
            value: "AXS UI automation"

        # 10. Click Refund to submit (full refund, irreversible)
        session_partner__R_click_refund_confirm: { locator: ".MuiDrawer-root:has-text('Confirm Full Refund') button:has-text('Refund')" }
        sleep_partner_refund: 6000

        # 11. [HARD ASSERTION] after a full refund, Net Earning == -transaction-fees.
        #     The refund settles asynchronously on the server, so wait (up to 30s) for the
        #     negative value text to appear; verify_text_visible polls until it is visible.
        session_partner__verify_net_earning_refunded: { text: "-${{transaction-fees}}", timeout: 30000 }

    expect_result:
        description: "Partner full refund of the AXS order — Net Earning flips to -transaction-fees, refund confirmation shown"
        assertions: []
