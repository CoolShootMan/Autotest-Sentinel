# time: 2026/10/12 17:30

# --- testT5649_axs_partner_full_refund: Patner full refund the axs order" ---
#
# [REFACTOR 2026-10-16] The two execute_js blocks were replaced by framework-native actions,
# mirroring the already-refactored venue_map twin (venue_map_fee_breakdown_partner_full_refund.yaml):
#   - order-id extraction  -> extract_value (source: text + regex "#(P\d+)")
#   - Net Earning check    -> compute_value + verify_row_value(retry_until_match)
# No JS left in this case.
testT5649_axs_partner_full_refund:
    is_mobile: true
    description: "Partner full refund the axs order"
    expect_result: "After a full refund the partner's Net Earning equals -transaction-fees on the sale details page"
    test_step:
        # [GLOBAL NS 2026-10-21] AXS chain namespace (see use_globals in actions/base.py).
        use_globals: { namespace: axs }
        # 0. [CROSS-CASE GUARD — global vars are PERSISTENT since 2026-10-20]
        #    `transaction-fees` is published with `global: true` by the ADMIN-side case that
        #    measures it:
        #        All_YAML/Events/Event_settings/axs_fee_breakdown_ui.yaml
        #    (the "Platform fees" row of the Fees + Taxes popover).
        #    [2026-10-21] The guest purchase case no longer measures/publishes it either — it
        #    now CONSUMES the same globals, so the producer chain is:
        #        axs_fee_breakdown_ui.yaml      -> publishes transaction-fees/taxes/ticket*/post_url
        #        axs_fee_breakdown_guest_purchase_ui.yaml -> places the AXS order (this case's data)
        #        (this case)                    -> refunds that order
        #    Since `actions/global_state.py` became disk-backed, the value does not depend on
        #    run order or on sharing one pytest process: it is written through to
        #    test_case/UI/global_vars_<env>.json and re-read by every process
        #    (`{{var}}` / get_global / has_global all refresh from that file).
        #    => running THIS case on its own works, as long as the producing case has run at
        #       least once against the same environment (the store is per-env).
        #    Remaining data prerequisite: the partner's Orders tab must not be empty — an order
        #    can only exist if a real purchase happened ("No sales yet" = nothing to refund).
        #    Inspect the store any time with:
        #        ./venv/bin/python tools/globals_store.py
        verify_defined_globals: { vars: [transaction-fees] }

        # 1. Create the partner session and open the event list
        session_partner__open: { url: "{BASE_URL}/events", cookie_file: "test_case/UI/cookie_{ENV}.json" }
        sleep_partner_events: 6000

        # 2. Enter the same AXS event (same locator as step 2, so we land on the DANNA event page)
        session_partner__R_click_axs_event: { locator: "xpath=//span[normalize-space(.)='AXS']/parent::*", index: 0, fallback_scan: true }
        sleep_partner_event: 6000

        # 3. As the partner, click the Sales tab on the event page.
        #     [RACE FIX 2026-10-20] The event header tab strip (Event | Post | Attendees |
        #     Co-hosts | Sales) renders AFTER the event body, so clicking too early let
        #     smart_click's `fallback_scan` fall back to some other "Sales" text: the click
        #     reported success but the page stayed on the Event tab, and step 4 then died with
        #     "element not found: //*[@role='tab'][.='Orders']". Waiting for the real tab to be
        #     visible first keeps the primary locate path (verified: probe sees exactly 1
        #     `button[role=tab]` with text Sales, and clicking it yields the Orders sub-tab).
        session_partner__wait_sales_tab:
            locator: "xpath=//button[@role='tab'][normalize-space(.)='Sales']"
            timeout: 30000
        session_partner__R_click_sales_tab: { locator: "xpath=//button[@role='tab'][normalize-space(.)='Sales']" }
        sleep_partner_sales: 3500

        # 4. Then click the Orders sub-tab under Sales (wait for it to render first — it only
        #    exists once the Sales panel is mounted).
        session_partner__wait_orders_tab:
            locator: "xpath=//*[@role='tab'][normalize-space(.)='Orders']"
            timeout: 30000
        session_partner__R_click_orders_tab: { locator: "xpath=//*[@role='tab'][normalize-space(.)='Orders']" }
        sleep_partner_orders: 5000

        # 5. Extract the FIRST order id in the list -> temp var first_order_id
        #     (was execute_js: document.body.innerText.match(/#(P\d+))/ -> extract_value + regex)
        session_partner__extract_value_first_order:
            locator: "body"
            source: text
            regex: "#(P\\d+)"
            numeric: false
            save_as: "first_order_id"
            timeout: 30000
        sleep_partner_extract: 800

        # 6. Click that order to open the Sale details page
        session_partner__R_click_first_order: { locator: "xpath=//*[normalize-space(.)='#{{first_order_id}}']" }
        sleep_partner_sale_details: 6000

        # 7. On the Sale details page, click the "I want to ..." dropdown trigger
        session_partner__R_click_i_want_to: { locator: "xpath=//*[normalize-space(.)='I want to']" }
        sleep_partner_i_want_to: 2500

        # 8. Choose Full refund from the dropdown
        session_partner__R_click_full_refund: { locator: "[role=menuitem]:has-text('Full refund')" }
        sleep_partner_full_refund: 3500

        # 9. Type the refund notes into the "Confirm Full Refund" drawer
        session_partner__fill_refund_notes: { locator: "textarea[placeholder='Add a short note for yourself (optional)']", value: "AXS UI automation" }
        sleep_partner_notes: 800

        # 10. Verify the refund notes were written (Playwright-native input_value check;
        #     guard: do not click Refund if the fill failed)
        session_partner__verify_value_refund_notes:
            locator: "textarea[placeholder='Add a short note for yourself (optional)']"
            value: "AXS UI automation"

        # 11. Click Refund to submit (full refund, irreversible)
        session_partner__R_click_refund_confirm: { locator: ".MuiDrawer-root:has-text('Confirm Full Refund') button:has-text('Refund')" }
        sleep_partner_refund: 6000

        # 12. [HARD ASSERTION] after a full refund, Net Earning == -transaction-fees.
        #     (was a long execute_js computing the row value with its own 50 x 500ms polling
        #      loop -> compute_value + verify_row_value, fully native.)
        #     [WHY retry_until_match] the refund settles ASYNCHRONOUSLY on the server and the
        #     "Net Earning" row stays VISIBLE the whole time, flipping from +fees to -fees.
        #     A plain read would return the still-positive amount and fail; retry_until_match
        #     re-reads until it matches (or `timeout` runs out) — the native equivalent of the
        #     old `for(i<50){ if(net<0) break; await 500 }` loop. `signed: true` keeps the minus.
        session_partner__compute_value_expected_net_earning:
            expression: "0 - {{transaction-fees}}"
            save_as: "expected_net_earning"
        session_partner__verify_row_value_net_earning:
            label: "Net Earning"
            value: "{{expected_net_earning}}"
            tolerance: 0.01
            retry_until_match: true
            timeout: 30000
            levels: 4
