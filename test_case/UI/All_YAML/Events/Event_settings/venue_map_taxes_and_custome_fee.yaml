# author: Lury
# time: 2026/10/13 12:37
# refactor: all execute_js replaced by framework-native actions (verify_* / verify_value /
#           extract_value / compute_value / smart_fill / smart_click); new generic actions
#           extract_value & compute_value live next to verify_value in actions/base.py.

# --- testT4652_venue_map: partner sets a 2% tax rate on a venue_map event's settings,
#     then retail / Fees+Taxes / My revenue are recalculated (guest verification lives in
#     venue_map_taxes_custom_fee_guest_purchase_ui.yaml) ---
testT4652_venue_map:
    is_mobile: true
    description: "Verify partner can set tax rate on events settings for venue map - retail / Fees+Taxes / My revenue recalculated"
    test_step:
        # 1. Go to the event list page
        open: "{BASE_URL}/events"
        sleep_list: 5000

        # 2. Search for the event named "event-for-ui-auto-venue-map" and open it.
        R_click_venue_map_event: { locator: "xpath=//*[normalize-space(.)='event-for-ui-auto-venue-map']", index: 0, fallback_scan: true }
        sleep_event: 5000

        # 3. Precondition: the cross-case global "ticket_venue_map" (published by
        #    venue_map_fee_breakdown_ui.yaml in the same pytest process) must resolve.
        #    [GUARD FIX 2026-10-16] the old form was a single
        #    `verify_ticket_venue_map: { text: "{{ticket_venue_map}}", timeout: 10000 }`, which
        #    failed in the worst possible way: an unresolved `{{var}}` stays a LITERAL, so the
        #    case searched the page for the text "{{ticket_venue_map}}" and timed out 10s later
        #    with a message that never named the missing variable. `verify_defined` names the
        #    missing key(s) and stops immediately — before any state-changing step runs.
        verify_defined_globals: { vars: [ticket_venue_map] }
        # 3b. ...and the product must actually be listed on the event page.
        verify_ticket_venue_map: { text: "{{ticket_venue_map}}", timeout: 10000 }

        # 4. Click the venue_map product (located by the temp var name) to open the Edit ticket page.
        R_click_ticket_venue_map: { locator: "xpath=//p[normalize-space(.)='{{ticket_venue_map}}']" }

        # 4b. [RACE FIX 2026-10-16] the SPA product route can mount before its data, leaving the
        #     "Edit ticket" page blank (header only) so no price input ever renders. Wait for the
        #     "Fees + Taxes" value natively; when it is still blank, reload once and wait again.
        #     No JS — smart_if + wait_for_selector + reload are all framework-native actions.
        if_edit_ticket_form_rendered_1:
            condition:
                locator: "xpath=//*[normalize-space(.)='Fees + Taxes']/following-sibling::*[1][not(self::button)]"
                state: visible
                timeout: 12000
            else:
                reload_edit_ticket_1: { sleep_after: 4000 }
                wait_for_selector_edit_ticket_form_1:
                    locator: "xpath=//*[normalize-space(.)='Fees + Taxes']/following-sibling::*[1][not(self::button)]"
                    timeout: 30000
        sleep_edit_ticket: 1000

        # 5. Read "My revenue" (input variants.0.ticketPrice) -> temp var my_revenue_venue_map.
        #    extract_value polls until the input is readable, parses the number and saves it
        #    as a 2-decimal string ("100.00") so it can be asserted as text later.
        extract_value_my_revenue:
            locator: "input[name='variants.0.ticketPrice']"
            save_as: "my_revenue_venue_map"
            timeout: 12000
        sleep_extract_rev_vm: 800

        # 6. Close the Edit ticket page (top-left Back) -> return to the event detail page.
        R_click_close_edit_ticket: { locator: "button[aria-label='Back']" }
        sleep_back_vm: 3000

        # 7. Conditional unsaved-changes guard: click "Leave without saving" only when that
        #    dialog appeared (smart_click_optional silently skips when it is not there).
        smart_click_optional_leave_without_saving: { text: "Leave without saving" }
        sleep_leave_vm: 1500

        # 8. Go to the event Settings page (tax configuration lives here).
        R_click_settings: { locator: "xpath=//*[normalize-space(.)='Settings']", index: 0, fallback_scan: true }
        sleep_settings: 3000

        # 8b. [RESET] Before enabling tax, make sure EVERY checkbox/toggle inside the Event
        #     settings panel is OFF, so step 9's click reliably ENABLES tax (not toggles it off).
        #     Uses the reusable native action `uncheck_all` (base.py, next to smart_check) — no
        #     inline JS. It unchecks all visible checked checkboxes in the active settings drawer;
        #     any drawer a plain toggle opens (e.g. reveal address) is auto-dismissed. The tax
        #     toggle (isTaxEnabled) is EXCLUDED on purpose: it is dialog-driven and its on/off is
        #     re-established by step 9 (rate 2 -> tax ON). To turn tax off here too, extend
        #     uncheck_all with a dialog-off flow or call a dedicated set_tax_off action.
        uncheck_all_settings: { exclude: ["isTaxEnabled"] }
        sleep_reset: 1500

        # 9. Click the "Charge tax on tickets" checkbox (input isTaxEnabled). A plain click is
        #    used (not smart_check): the click itself opens the tax-rate dialog in either
        #    state, and the rate entered below decides the final on/off state.
        R_click_charge_tax: { locator: "xpath=//input[@name='isTaxEnabled']", index: 0, fallback_scan: true }
        sleep_charge_tax: 1500

        # 10. In the "Charge tax on tickets" dialog, type 2 into the rate input (customTaxRate).
        #     Playwright-native fill triggers the React onChange reliably (the % is an adornment).
        fill_tax_rate: { locator: "input[name='customTaxRate']", value: "2" }
        sleep_tax_input: 800

        # 11. Apply the rate.
        R_click_apply_tax: { locator: "xpath=//button[normalize-space(.)='Apply']", index: 0, fallback_scan: true }
        sleep_apply_tax: 2000

        # 12. Verify the "Tax rate updated - please review" confirmation dialog copy.
        verify_tax_rate_updated: { text: "Tax rate updated" }
        verify_new_rate_applied: { text: "Your new tax rate has been applied" }
        verify_prices_shown_to_buyers: { text: "Ticket prices shown to buyers" }
        verify_revenue_recalculated: { text: "expected revenue have been recalculated" }
        verify_review_amounts: { text: "Please review the updated amounts carefully" }

        # 13. Dismiss the dialog with "Got it".
        R_click_got_it: { locator: "xpath=//button[normalize-space(.)='Got it']", index: 0, fallback_scan: true }
        sleep_got_it: 1500

        # 14. Click Save to persist the 2% tax setting.
        R_click_save_settings: { name: "Save" }
        sleep_save_settings: 3000

        # 15. Compute the expected amounts from my_revenue_venue_map (tax = 2%):
        #     retail = (my_revenue + 1) / (1 - 0.1 - tax)
        #     fees + taxes = retail - my_revenue ;  tax amount = retail * 0.02
        compute_value_retails_price:
            expression: "({{my_revenue_venue_map}} + 1) / (1 - 0.1 - 0.02)"
            save_as: "retails_price_venue_map"
            global: true
        compute_value_fees_taxes:
            expression: "{{retails_price_venue_map}} - {{my_revenue_venue_map}}"
            save_as: "fees_taxes_venue_map"
        compute_value_tax_amount:
            expression: "{{retails_price_venue_map}} * 0.02"
            save_as: "tax_amount_venue_map"
        sleep_compute: 500

        # 16. On the event page, the product card must show the recalculated retail price and
        #     the incl. (= fees + taxes) amount. Card text format: "<name> $retail (incl. $fees fees)".
        verify_event_card_retail:
            scope: { locator: "xpath=//p[normalize-space(.)='{{ticket_venue_map}}']/ancestor::*[contains(., 'incl.')][1]" }
            text: "${{retails_price_venue_map}}"
        verify_event_card_incl:
            scope: { locator: "xpath=//p[normalize-space(.)='{{ticket_venue_map}}']/ancestor::*[contains(., 'incl.')][1]" }
            text: "${{fees_taxes_venue_map}}"
        sleep_event_card: 800

        # 17. Re-open the product (Edit ticket page) and verify the three price inputs:
        #     My revenue (ticketPrice) unchanged, Fees + Taxes (fees) and Retail price (price)
        #     recalculated for the 2% tax. tolerance 0.01 covers full-precision stored values.
        R_click_ticket_venue_map_2: { locator: "xpath=//p[normalize-space(.)='{{ticket_venue_map}}']" }

        # 17b. [RACE FIX 2026-10-16] the SPA product route can mount before its data, leaving the
        #      "Edit ticket" page blank (header only) so no price input/value ever renders. Wait for
        #      the "Fees + Taxes" value natively; when it is still blank, reload once (a fresh load
        #      of the product route always renders) and wait again. No JS — smart_if +
        #      wait_for_selector + reload are all framework-native actions.
        if_edit_ticket_form_rendered_2:
            condition:
                locator: "xpath=//*[normalize-space(.)='Fees + Taxes']/following-sibling::*[1][not(self::button)]"
                state: visible
                timeout: 12000
            else:
                reload_edit_ticket_2: { sleep_after: 4000 }
                wait_for_selector_edit_ticket_form_2:
                    locator: "xpath=//*[normalize-space(.)='Fees + Taxes']/following-sibling::*[1][not(self::button)]"
                    timeout: 30000
        sleep_edit_ticket_2: 1000
        verify_value_my_revenue: { locator: "input[name='variants.0.ticketPrice']", value: "{{my_revenue_venue_map}}", tolerance: 0.01 }
        verify_value_fees_taxes: { locator: "input[name='variants.0.fees']", value: "{{fees_taxes_venue_map}}", tolerance: 0.01 }
        verify_value_retail_price: { locator: "input[name='variants.0.price']", value: "{{retails_price_venue_map}}", tolerance: 0.01 }
        sleep_edit_verify: 800

        # 18. Click the price under "Fees + Taxes" to open the breakdown popover, then verify the
        #     platform-fee line and the 2% tax amount.
        #     [LOCATOR FIX 2026-10-16] was `.../following-sibling::*[1]` with `index: 1` (1st match
        #     = tooltip <button>, 2nd = the value <div>); excluding the tooltip selects the value
        #     directly and no longer depends on the exact match count.
        R_click_fees_taxes_vm:
            locator: "xpath=//*[normalize-space(.)='Fees + Taxes']/following-sibling::*[1][not(self::button)]"
        sleep_fees_tip_vm: 2000
        verify_popover_platform_fees: { scope: { locator: ".MuiPopover-root" }, text: "Platform fees" }
        verify_popover_tax_amount: { scope: { locator: ".MuiPopover-root" }, text: "${{tax_amount_venue_map}}" }

    expect_result:
        description: "On a venue_map event: read My Revenue, enable 'Charge tax on tickets' at 2%, then verify retail / Fees+Taxes / My Revenue and the 2% tax portion reconcile with retail = (my_revenue + 1) / (1 - 0.1 - tax)"
        assertions: []
