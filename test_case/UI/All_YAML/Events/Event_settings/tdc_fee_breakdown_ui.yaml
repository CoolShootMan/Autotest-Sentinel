# --- testT5649_tdc: TDC-tagged event, verify the product is priced (non-zero), fee breakdown, guest checkout (no refund flow: TDC tickets are not refundable upstream) ---
#
# [REFACTOR 2026-10-13] All execute_js blocks were replaced by framework-native actions
# (extract_value / compute_value / extract_row_value / set_value / verify_number ...).
# No JS left in this case.
#
# [2026-10-16] The event is no longer the FIRST TDC badge on the list: several TDC events exist and
# the products of some are entirely "Sold out". The seed now uses the native action
# `select_event_with_sellable_product` (actions/base.py), which walks the TDC events and closes an
# all-sold-out one with the header X before trying the next (see the comment at step 1b-3).
testT5649_tdc:
    is_mobile: true
    description: "Verify the fee breakdown for TDC ticket on checkout - then place order - check TDC info and link on order confirmation page"
    expect_result: "Checkout shows a fee breakdown for the TDC ticket; order can be placed and the confirmation page shows TDC info and link"
    test_step:
        # [GLOBAL NS 2026-10-21] TDC chain namespace — each chain keeps its own
        # transaction-fees / my_revenve / ticket-retails-price / post_url.
        use_globals: { namespace: tdc }
        # 1. Go to the event list page
        open: "{BASE_URL}/events"
        sleep_list: 5000

        # 1b-3. Pick a USABLE TDC event and open its "Tickets & Merch" tab.
        #    [WHY A LOOP - 2026-10-16] the events list carries SEVERAL TDC-tagged events and the
        #    FIRST one may have every product "Sold out" (measured on release: "Parking - League
        #    Championship Series TDC" = 3/3 sold out, while the next one, "League Championship
        #    Series TDC", has 28 sellable products). The previous seed hard-picked the FIRST badge
        #    event, so step 4 then died with
        #      extract_value: could not read 'xpath=//div[@data-testid='mui-stack']
        #       [...][not(contains(., 'Sold out'))]' within 20000ms
        #    The native action below walks the TDC events in list order; when an event's products
        #    are ALL sold out it clicks the header X (`button[aria-label='Close']`, the top-left
        #    close icon) to return to the event list and tries the NEXT TDC event. It ends ON a
        #    usable event with the "Tickets & Merch" tab open, and publishes the chosen event name
        #    as `event_tdc` — still located BY TAG, never by a hard-coded name (release names keep
        #    being renamed by other people).
        select_event_with_sellable_product_tdc:
            badge: "TDC"
            open_tab: "Tickets & Merch"
            save_as: "event_tdc"
            global: true
            max_events: 5
        sleep_event: 2500

        # 4. [HARD ASSERTION] every product on the Tickets & Merch tab has a NON-ZERO price.
        #    (was execute_js: the JS collected all "(price + sold + Tools)" cards and failed if any
        #     price was 0. Here each product card is read natively and asserted > 0.)
        #    NOTE: `ticket_tdc` (the cross-case global) is published by the dedicated extraction
        #    step 9 below, which uses the same "first non-Sold-out card" rule.
        extract_value_tdc_card_price_1:
            locator: "xpath=//div[@data-testid='mui-stack'][.//button[@data-testid='enhance-button']][not(contains(., 'Sold out'))]"
            index: 0
            source: text
            regex: "\\$\\s*([\\d,]+(?:\\.\\d+)?)"
            save_as: "tdc_card_price_1"
            timeout: 20000
        verify_number_tdc_card_price_1: { value: "{{tdc_card_price_1}}", op: "gt", expected: "0" }
        extract_value_tdc_card_price_2:
            locator: "xpath=//div[@data-testid='mui-stack'][.//button[@data-testid='enhance-button']][not(contains(., 'Sold out'))]"
            index: 1
            source: text
            regex: "\\$\\s*([\\d,]+(?:\\.\\d+)?)"
            save_as: "tdc_card_price_2"
            timeout: 20000
        verify_number_tdc_card_price_2: { value: "{{tdc_card_price_2}}", op: "gt", expected: "0" }
        extract_value_tdc_card_price_3:
            locator: "xpath=//div[@data-testid='mui-stack'][.//button[@data-testid='enhance-button']][not(contains(., 'Sold out'))]"
            index: 2
            source: text
            regex: "\\$\\s*([\\d,]+(?:\\.\\d+)?)"
            save_as: "tdc_card_price_3"
            timeout: 20000
        verify_number_tdc_card_price_3: { value: "{{tdc_card_price_3}}", op: "gt", expected: "0" }
        extract_value_tdc_card_price_4:
            locator: "xpath=//div[@data-testid='mui-stack'][.//button[@data-testid='enhance-button']][not(contains(., 'Sold out'))]"
            index: 3
            source: text
            regex: "\\$\\s*([\\d,]+(?:\\.\\d+)?)"
            save_as: "tdc_card_price_4"
            timeout: 20000
        verify_number_tdc_card_price_4: { value: "{{tdc_card_price_4}}", op: "gt", expected: "0" }

        # 5. Open event Settings (drawer). Reachable from the Tickets & Merch tab too.
        R_click_settings: { role: "button", name: "Settings" }
        sleep_settings: 3000

        # 6. Enable "Show fee breakdown at checkout".
        #    smart_check is idempotent (set_checked no-ops when already ON) and Playwright's
        #    set_checked hard-asserts the resulting state -> no extra JS check needed.
        check_fee_breakdown: { locator: "xpath=//input[@name='showFeesBreakdown']", checked: true }
        sleep_fee: 1500

        # 7. Save the settings (drawer closes on success).
        R_click_save: { name: "Save" }
        sleep_save: 3000

        # 9. Extract the target ticket: the name of the first non-"Sold out" product card.
        #    [WHY NOT "0 sold"] every run of this case BUYS one ticket, so the sold counter of the
        #    chosen product grows and the pool of "0 sold" products shrinks. Once all four products
        #    had 1 sold this step threw `No 0-sold non-Sold-out ticket found` — the case was
        #    one-shot. The real intent is "a product that still has inventory", i.e. NOT sold out;
        #    the cards are listed in a stable order (T1000 first), so this is deterministic.
        #    [GLOBAL VARIABLE] `global: true` publishes ticket_tdc to the cross-case store.
        extract_value_ticket_name:
            locator: "xpath=(//div[@data-testid='mui-stack'][.//button[@data-testid='enhance-button']][not(contains(., 'Sold out'))]//p)[1]"
            source: text
            numeric: false
            save_as: "ticket_tdc"
            global: true
            timeout: 20000
        sleep_extract_name: 800

        # 10. Extract the target ticket's price (the first $ amount on the card = retail price)
        #     -> temp var ticket-retails-price
        extract_value_retail_price:
            locator: "xpath=(//div[@data-testid='mui-stack'][.//button[@data-testid='enhance-button']][not(contains(., 'Sold out'))])[1]"
            source: text
            regex: "\\$\\s*([\\d,]+(?:\\.\\d+)?)"
            save_as: "ticket-retails-price"
            global: true
            timeout: 20000
        sleep_extract_price: 500

        # 10b. Extract the "(incl. $x fees)" amount, then compute my_revenve = price - incl
        #      -> temp var my_revenve
        extract_value_incl_fees:
            locator: "xpath=(//div[@data-testid='mui-stack'][.//button[@data-testid='enhance-button']][not(contains(., 'Sold out'))])[1]"
            source: text
            regex: "incl\\.?\\s*\\$\\s*([\\d,]+(?:\\.\\d+)?)"
            save_as: "incl_fees_price"
            timeout: 20000
        compute_value_my_revenue:
            expression: "{{ticket-retails-price}} - {{incl_fees_price}}"
            save_as: "my_revenve"
            global: true
        sleep_extract_rev: 800

        # === Open the ticket-tdc product -> Edit ticket page -> read the fee breakdown -> go back ===

        # 11. Click the ticket-tdc product (located by the temp var name) to enter the Edit ticket page
        #     [WHY dispatch_click] The T1000 card sits low in the list and, once the event Settings
        #     drawer has been opened/saved, the drawer content still overlays that area
        #     (measured on release 2026-10-13: the top-most element at the card's centre is the
        #     "Show fee breakdown at checkout" row), so a real Playwright click times out on the
        #     hit-target check and a force-click is swallowed by the overlay. Dispatching the
        #     pointer/mouse sequence navigates correctly. See actions/base.py `dispatch_click`.
        dispatch_click_ticket:
            locator: "xpath=//p[normalize-space(.)='{{ticket_tdc}}']"
            timeout: 15000

        # 11b. [RACE FIX 2026-10-16] the SPA product route sometimes mounts BEFORE its data
        #      arrives: the "Edit ticket" page then stays COMPLETELY BLANK (header only — captured
        #      in step_captures/testT5649_tdc/step_019.jpg), so the "Fees + Taxes" value never
        #      exists and step 12 burned ~43s of click attempts and failed. Wait for the value
        #      natively (Playwright polls); when the page is still blank, reload once — a fresh
        #      load of the same product route always renders (verified on release, desktop AND
        #      mobile) — and wait again. No JS: smart_if + wait_for_selector + reload are all
        #      framework-native actions.
        if_edit_ticket_form_rendered:
            condition:
                locator: "xpath=//*[normalize-space(.)='Fees + Taxes']/following-sibling::*[1][not(self::button)]"
                state: visible
                timeout: 12000
            else:
                reload_edit_ticket: { sleep_after: 4000 }
                wait_for_selector_edit_ticket_form:
                    locator: "xpath=//*[normalize-space(.)='Fees + Taxes']/following-sibling::*[1][not(self::button)]"
                    timeout: 30000
        sleep_edit_ticket: 1000

        # 12. Click the price under "Fees + Taxes" to open the breakdown popover.
        #     [LOCATOR FIX 2026-10-16] was `.../following-sibling::*[1]` with `index: 1`, which
        #     silently depended on the page rendering EXACTLY the old number of matches (the 1st
        #     match is an explanatory tooltip <button>, the 2nd the value <div>). Excluding the
        #     tooltip selects the value directly — verified on release: 1 match, "$ 61.25" — and
        #     the click no longer breaks when only one match is present.
        R_click_fees_taxes:
            locator: "xpath=//*[normalize-space(.)='Fees + Taxes']/following-sibling::*[1][not(self::button)]"
        sleep_fees_tip: 2000

        # 13. Extract "Platform fees" from the popover -> GLOBAL var transaction-fees
        #     [signed FIX 2026-10-21] `signed: false` — the guest case now does ARITHMETIC with
        #     this value (`my_revenve + transaction-fees + service_fee`), and with the default
        #     `signed: true` the climb from the label to the amount can swallow a stray '-' from a
        #     neighbouring node (measured on the venue_map checkout: the fee read back as -7.77 and
        #     poisoned the published global). An organizer-side fee is NEVER negative.
        extract_row_value_platform_fees:
            label: "Platform fees"
            scope: ".MuiPopover-root"
            save_as: "transaction-fees"
            signed: false
            global: true
            timeout: 15000

        # 14. Extract "Taxes" from the popover -> GLOBAL var taxes
        #     ([PRICING FACT] a TDC hub ticket has no tax -> this is "0.00"; same `signed` reason)
        extract_row_value_taxes:
            label: "Taxes"
            scope: ".MuiPopover-root"
            save_as: "taxes"
            signed: false
            global: true
            timeout: 15000

        # 15. This price popover is a modal and covers the Back button, so press Escape to close it
        #     first, then click the Back button (header CloseIcon, aria-label="Back") to go back
        press_close_popover: { key: "Escape" }
        sleep_after_esc: 1200
        R_click_close_ticket: { locator: "button[aria-label='Back']" }
        sleep_back: 3000

        # 15b. Conditional unsaved-changes guard: clicking Back may pop an in-app
        #      "Leave this page?" confirmation (only when there ARE unsaved changes).
        #      smart_click_optional clicks the button when present and silently skips
        #      when the dialog is not there (Playwright-native, no JS).
        smart_click_optional_leave_without_saving: { text: "Leave without saving" }
        sleep_leave: 1500

        # 16. Open the event's "Post" tab — it renders the public post URL as plain text
        R_click_post_tab: { locator: "xpath=//*[@role='tab' or self::button][normalize-space(.)='Post']", index: 0 }
        sleep_post_tab: 4000

        # 17. Read the guest-accessible public post URL straight off the page -> GLOBAL var post_url
        #     (published cross-case so tdc_fee_breakdown_guest_purchase_ui.yaml can reuse it)
        #     [REFACTOR] the old JS found the element whose whole text IS a post URL (anchored) and
        #     prefixed "https://" when missing; the label is a <button> and its textContent is the
        #     bare URL -> extract with an anchored regex, then normalise with set_value.
        extract_value_post_url_raw:
            locator: "xpath=//button[contains(., '/post/')]"
            source: content
            strip_whitespace: true
            regex: "([A-Za-z0-9.-]+\\.pear\\.us/[A-Za-z0-9._-]+/post/[A-Za-z0-9._-]+)"
            numeric: false
            save_as: "post_url_raw"
            timeout: 15000
        set_value_post_url:
            value: "https://{{post_url_raw}}"
            save_as: "post_url"
            global: true
        sleep_extract_url: 800
