# author: Lury
# time: 2026/10/12 17:24

# --- testT5649_tdc_guest_purchase: Guest check fee breakdown and purchase tdc ticket ---
#
# [REFACTOR 2026-10-13] All execute_js blocks were replaced by framework-native actions.
# The ONLY JS that remains is step 23 (`execute_js_click_view_tickets`): the order page's
# "View Tickets" link opens a new tab / window and the framework has no popup handling, so a
# forced same-tab navigation is required to let wait_for_url assert the destination.
testT5649_tdc_guest_purchase:
    is_mobile: true
    description: "Guest check fee breakdown and purchase tdc ticket, check TDC info and link on order confirmation page"
    expect_result: "The TDC product must be priced (non-zero); the guest checkout ends with a confirmed order; pricing/fee assertions cover the post, the Select tickets drawer, the checkout breakdown and the order confirmation (no partner refund flow: TDC tickets are not refundable upstream)"
    test_step:
        # 0. (guard) Fail fast with a clear message if the cross-case globals from the parent case
        #     are missing (was execute_js_ensure_globals).
        verify_defined_globals:
            vars: [post_url, ticket_tdc, ticket-retails-price, my_revenve, transaction-fees, taxes]

        # 1. Create the guest session (no cookie = visitor); saved temp vars are copied into it
        create_session_guest: { name: "guest" }

        # 2. As a guest, open the public post (`open` backfills {{post_url}}, no JS navigation)
        session_guest__open: { url: "{{post_url}}" }
        sleep_guest_post: 5000

        # 3. As a guest, find the product by name in the post and assert its displayed price.
        #     [PRICING FACT - verified on release 2026-10-13] a TDC hub PUBLIC POST renders the
        #     RETAIL price (e.g. "$115.42 (incl. fees)"), NOT the organizer's net revenue:
        #       event card  : $115.42 (incl. $12.54 fees) -> ticket-retails-price = 115.42
        #       edit ticket : My revenue = $102.88, Fees + Taxes = $12.54
        #     So the post is asserted against `ticket-retails-price`. (The previous JS compared it
        #     with my_revenve, which could never match: 115.42 != 102.88.)
        #     [DOM FACT] the post card = the NEAREST ancestor of the product-name leaf carrying a "$".
        session_guest__verify_text_regex_post_price:
            scope: "xpath=//*[normalize-space(.)='{{ticket_tdc}}']/ancestor::*[contains(., '$')][1]"
            pattern: "\\$\\s*{{ticket-retails-price}}\\b"
            timeout: 20000

        # ==================== guest checkout flow ====================
        # 4. As a guest, click the ticket-tdc product name on the public post to open the "Select tickets" drawer
        session_guest__R_click_product: { locator: "xpath=//*[normalize-space(.)='{{ticket_tdc}}']", index: 0 }

        # 5. Assert the price shown in the "Select tickets" drawer.
        #     [PRICING FACT - verified on release 2026-10-13] the drawer lists the RETAIL price
        #     ("T1000 ... / $115.42", Total after 1 item = $115.42), i.e. the same amount the public
        #     post shows — NOT the organizer's net revenue ($102.88). Asserted against
        #     `ticket-retails-price` for the same reason as step 3.
        #     [DOM FACT] for a TDC hub ticket the drawer shows the VENUE + time, NOT the product
        #     title, so identify it by its heading; fall back to "any drawer holding a quantity
        #     input" because innerText can briefly read empty.
        #     (`:has-text()` is Playwright's case-insensitive text matcher, mirroring the
        #      /Select tickets/i test the old JS used.)
        session_guest__verify_text_regex_drawer_price:
            scope: ".MuiDrawer-root:has-text('Select tickets'), .MuiDrawer-root:has(input[type='number'])"
            pattern: "\\$\\s*{{ticket-retails-price}}\\b"
            timeout: 20000

        # 6. Raise the quantity from 0 to 1 (the drawer opens at 0 for hub seat tickets)
        session_guest__R_click_qty_add: { locator: "button[aria-label='Add']", index: 0 }

        # 7. Assert the quantity really is 1 (Playwright-native input_value check)
        session_guest__verify_value_qty:
            locator: ".MuiDrawer-root input[type='number']"
            value: "1"
            timeout: 15000

        # 8. Click Buy now and wait 3s to reach the Checkout drawer
        session_guest__R_click_buy_now: { role: "button", name: "Buy now" }
        sleep_guest_checkout: 3000

        # 9. Assert on the Checkout drawer:
        #     product name == ticket-tdc; unit price == my_revenve; no "(incl. $ fees)" suffix;
        #     Subtotal == my_revenve; Transaction fees == transaction-fees; Service fee > 0;
        #     Total == Subtotal + Transaction fees + Service fee
        session_guest__verify_text_visible_checkout_name:
            text: "{{ticket_tdc}}"
            scope: { locator: ".MuiDrawer-root:has-text('Checkout')" }
            timeout: 20000
        # [PRICING FACT] the TDC line price is the NET price and carries NO "(incl. $ fees)"
        # suffix — the fees are itemised as their own rows below
        session_guest__verify_text_regex_no_incl_suffix:
            scope: ".MuiDrawer-root:has-text('Checkout')"
            pattern: "incl\\.?\\s*\\$"
            assert_not_match: true
            timeout: 15000
        session_guest__verify_text_regex_line_price:
            scope: ".MuiDrawer-root:has-text('Checkout')"
            pattern: "\\$\\s*{{my_revenve}}\\b"
            timeout: 15000
        session_guest__verify_row_value_subtotal:
            label: "Subtotal"
            scope: ".MuiDrawer-root:has-text('Checkout')"
            value: "{{my_revenve}}"
            tolerance: 0.01
            timeout: 20000
        session_guest__verify_row_value_transaction_fees:
            label: "Transaction fees"
            scope: ".MuiDrawer-root:has-text('Checkout')"
            value: "{{transaction-fees}}"
            tolerance: 0.01
            timeout: 20000
        # [PRICING FACT] a TDC hub ticket adds a Service fee row on top of Subtotal +
        # Transaction fees; it has no counterpart on the AXS/Pear.US checkout.
        session_guest__extract_row_value_service_fee:
            label: "Service fee"
            scope: ".MuiDrawer-root:has-text('Checkout')"
            save_as: "service_fee"
            timeout: 20000
        session_guest__verify_number_service_fee_positive:
            value: "{{service_fee}}"
            op: "gt"
            expected: "0"
        # Total == Subtotal (net) + Transaction fees + Service fee
        session_guest__compute_value_checkout_total:
            expression: "{{my_revenve}} + {{transaction-fees}} + {{service_fee}}"
            save_as: "checkout_total_tdc"
        session_guest__verify_row_value_total:
            label: "Total"
            scope: ".MuiDrawer-root:has-text('Checkout')"
            value: "{{checkout_total_tdc}}"
            tolerance: 0.01
            timeout: 20000

        # 10. Click Total to expand the fee breakdown
        session_guest__R_click_total: { locator: "xpath=//*[normalize-space(.)='Total']", index: 0 }

        # 11. Assert in the expanded breakdown:
        #     Subtotal == my_revenve; Transaction fees == transaction-fees; Service fee > 0;
        #     when taxes != 0 a "Taxes" row must show Taxes == taxes, when taxes == 0 it may be hidden.
        session_guest__verify_row_value_breakdown_subtotal:
            label: "Subtotal"
            scope: ".MuiDrawer-root:has-text('Checkout')"
            value: "{{my_revenve}}"
            tolerance: 0.01
            timeout: 20000
        session_guest__verify_row_value_breakdown_transaction_fees:
            label: "Transaction fees"
            scope: ".MuiDrawer-root:has-text('Checkout')"
            value: "{{transaction-fees}}"
            tolerance: 0.01
            timeout: 20000
        session_guest__verify_number_service_fee_positive_breakdown:
            value: "{{service_fee}}"
            op: "gt"
            expected: "0"
        session_guest__verify_row_value_breakdown_taxes:
            label: "Taxes"
            scope: ".MuiDrawer-root:has-text('Checkout')"
            value: "{{taxes}}"
            tolerance: 0.01
            absent_when_zero: true
            timeout: 20000

        # 12. Re-save the Service fee from the expanded breakdown so the confirmation-page checks
        #      (steps 20/22) assert Total == Item(s) total + Service fee.
        session_guest__extract_row_value_service_fee_final:
            label: "Service fee"
            scope: ".MuiDrawer-root:has-text('Checkout')"
            save_as: "service_fee"
            timeout: 20000

        # 13. Click the Checkout CTA to reach the contact + payment form.
        #     [UI DRIFT 2026-10-13] the old "Continue with credit card" button no longer exists:
        #     the shared Checkout drawer renders a single CTA
        #     `button[data-testid='checkout-in-post-continue-cta']` labelled "Continue", and
        #     clicking it swaps the drawer body to the contact form (input[name='contact.*'])
        #     with a "Place order" CTA. Verified on the venue-map checkout (same shared
        #     component, see venue_map_fee_breakdown_guest_purchase.yaml step 12); not re-verified
        #     here because the TDC purchase is currently blocked upstream by
        #     "Ticket pricing unavailable" (product-side).
        session_guest__R_click_checkout_continue:
            locator: "button[data-testid='checkout-in-post-continue-cta']"
            timeout: 15000
        sleep_guest_cc_form: 5000

        # 14. Fill in Contact (First name / Last name / Phone / Email)
        session_guest__fill_first_name: { locator: "input[name='contact.firstName']", value: "Lury" }
        session_guest__fill_last_name: { locator: "input[name='contact.lastName']", value: "UIAutomation" }
        session_guest__fill_phone: { locator: "input[name='contact.phoneNumber']", value: "2524001111" }
        session_guest__fill_email: { locator: "input[name='contact.email']", value: "dian.yuhong.ext+111@1m.app" }
        sleep_guest_contact: 1000

        # 15. Fill in Payment (the three Stripe fields live in separate iframes; locate them by
        #     visible iframe order: nth=0 card number / nth=1 expiry / nth=2 CVC)
        session_guest__fill_card_number:
            frame: "iframe[src*='elements-inner-card'] >> nth=0"
            locator: "input[name='cardnumber']"
            value: "4242424242424242"
        sleep_card_number: 1200

        session_guest__fill_expiry:
            frame: "iframe[src*='elements-inner-card'] >> nth=1"
            locator: "input[name='exp-date']"
            value: "830"

        session_guest__fill_cvc:
            frame: "iframe[src*='elements-inner-card'] >> nth=2"
            locator: "input[name='cvc']"
            value: "999"
        sleep_card_rest: 1500

        # Cardholder name + billing zip (zip 90021 is the agreed value, following the existing
        # case convention when the case does not specify one)
        session_guest__fill_card_name: { locator: "input[name='cardName']", value: "lury UI automation" }
        session_guest__fill_zipcode: { locator: "input[name='billingAddress.zipcode']", value: "90021" }
        sleep_guest_payment: 1500

        # 16. Assert the payment form was filled correctly (Playwright-native input_value
        #     assertions; the phone field is auto-formatted so it is checked with a regex
        #     requiring at least 10 digits — was a tiny execute_js)
        session_guest__verify_value_first_name: { locator: "input[name='contact.firstName']", value: "Lury" }
        session_guest__verify_value_last_name: { locator: "input[name='contact.lastName']", value: "UIAutomation" }
        session_guest__verify_value_email: { locator: "input[name='contact.email']", value: "dian.yuhong.ext+111@1m.app" }
        session_guest__verify_value_card_name: { locator: "input[name='cardName']", value: "lury UI automation" }
        session_guest__verify_value_zipcode: { locator: "input[name='billingAddress.zipcode']", value: "90021" }
        session_guest__verify_value_phone:
            locator: "input[name='contact.phoneNumber']"
            regex: "(\\d\\D*){10}"

        # 17. Click Place order
        session_guest__R_click_place_order: { role: "button", name: "Place order" }
        sleep_place_order: 8000

        # ==================== order placed + order confirmation page checks ====================
        # 18. [HARD ASSERTION] order placed (Playwright-native): wait_for_url polls until the
        #     URL lands on /order/<id>/confirmation, then the confirmation copy must be visible.
        #     [COPY DRIFT 2026-10-16] the current release greets the buyer with
        #     "Thank you for your payment." (+ a "Confirmation #<id>" line), not the older
        #     "Your order is confirmed" -> `text` takes a LIST of accepted copies (any-of).
        session_guest__wait_for_url_order_confirmation:
            url: "**/order/**/confirmation"
            timeout: 30000
        session_guest__verify_order_confirmed:
            text:
                - "Thank you for your payment."
                - "Your order is confirmed"
            timeout: 20000

        # 19. Assert the price next to "Show summary" == ticket-retails-price (or retail + service fee)
        #     [PRICING FACT] on a TDC hub order the header may show the item total (retail) or the
        #     grand total (retail + Service fee); steps 20/21 hard-assert the rows either way.
        session_guest__compute_value_grand_total:
            expression: "{{ticket-retails-price}} + {{service_fee}}"
            save_as: "tdc_grand_total"
        session_guest__verify_row_value_show_summary:
            label: "Show summary"
            value: ["{{ticket-retails-price}}", "{{tdc_grand_total}}"]
            tail_limit: 16
            levels: 6
            tolerance: 0.01
            timeout: 20000

        # 20. Click Show summary to expand the order details
        session_guest__R_click_show_summary: { locator: "xpath=//*[normalize-space(.)='Show summary']" }

        # 21. Assert the details: Item(s) total == Subtotal == ticket-retails-price, and
        #     Total == Item(s) total + Service fee (the TDC hub settlement model), plus an
        #     "(incl. $a fees)" row where a == transaction-fees
        session_guest__verify_row_value_item_total:
            label: "Item(s) total"
            value: "{{ticket-retails-price}}"
            tolerance: 0.01
            timeout: 20000
        session_guest__verify_row_value_order_subtotal:
            label: "Subtotal"
            value: "{{ticket-retails-price}}"
            tolerance: 0.01
            timeout: 20000
        session_guest__verify_row_value_order_total:
            label: "Total"
            value: "{{tdc_grand_total}}"
            tolerance: 0.01
            timeout: 20000
        session_guest__verify_text_regex_incl_fees_row:
            pattern: "(?:including|incl\\.?)\\s*\\$\\s*{{transaction-fees}}\\s*fees"
            flags: "i"
            timeout: 20000

        # 22. Assert the TDC access copy under "Create an account to access your order anytime."
        #     (TDC ticket messageTemplate; the "MLB.com username" shown is the BUYER's email —
        #     keep in sync with the checkout contact email. Playwright-native text assertions;
        #     the fragments avoid apostrophes, whose curly/straight glyph can differ.)
        session_guest__verify_tdc_anchor: { text: "Create an account to access your order anytime.", timeout: 20000 }
        session_guest__verify_tdc_access_title: { text: "How to access your tickets" }
        session_guest__verify_tdc_timing_line: { text: "will be available before the event" }
        session_guest__verify_tdc_login_line: { text: "log in with your MLB.com username (dian.yuhong.ext+111@1m.app)" }

        # 23. Assert Confirmation details: contact information / payment method / billing zip code.
        #     (Playwright-native text assertions for the static parts; the charged amount is
        #     dynamic so it is a regex with {{var}}. The page shows the phone as 252-400-1111.)
        session_guest__verify_contact_name: { text: "Lury UIAutomation", timeout: 20000 }
        session_guest__verify_contact_phone: { text: "252-400-1111" }
        session_guest__verify_contact_email: { text: "dian.yuhong.ext+111@1m.app" }
        session_guest__verify_card_tail: { text: "Visa x4242" }
        session_guest__verify_zip_code: { text: "90021", exact: true }
        # [PRICING FACT] on a TDC hub order the "Payment method" line shows the amount actually
        # CHARGED to the card = grand total = retail + Service fee.
        session_guest__verify_text_regex_paid_amount:
            pattern: "Visa\\s*x4242\\s*-\\s*\\$\\s*{{tdc_grand_total}}\\b"
            flags: "i"
            timeout: 20000

        # 24. Assert the "View Tickets" link points at mpvsb.tickets.com (native: read the href
        #     attribute and validate it with an anchored regex -> extract_value raises when the
        #     href does not match, so this doubles as the old JS href guard).
        session_guest__extract_value_view_tickets_url:
            locator: "xpath=(//*[self::a or self::button or @role='button'][contains(normalize-space(.), 'View Tickets')])[1]"
            source: attribute
            attribute: href
            regex: "^https://mpvsb\\.tickets\\.com/"
            numeric: false
            save_as: "view_tickets_url"
            timeout: 20000

        # 25. Click "View Tickets", forcing a same-tab jump (also redirecting any window.open) so
        #     the destination can be asserted by the Playwright-native wait_for_url in step 26.
        #     [ALLOWED JS] The framework has no popup/new-tab handling and this link opens a new
        #     tab, so the forced same-tab navigation is the one JS exception kept in this suite.
        session_guest__execute_js_click_view_tickets:
            script: |
                () => {
                  const el = [...document.querySelectorAll('a,button,[role="button"]')]
                    .filter(e => /View\s*Tickets/i.test((e.textContent||'').replace(/\s+/g,' ').trim()))
                    .sort((a,b) => (a.textContent||'').length - (b.textContent||'').length)[0];
                  if(!el) throw new Error('order page: "View Tickets" button not found');
                  try { el.setAttribute('target','_self'); } catch(_){}
                  window.open = function(u){ const s=(typeof u==='string')?u:(u&&u.toString?u.toString():''); if(s) location.href = s; return window; };
                  setTimeout(() => el.click(), 0);   // next tick: evaluate returns before navigation
                  return 'clicked';
                }
        sleep_view_tickets_nav: 6000

        # 26. [HARD ASSERTION] the "View Tickets" click must land on https://mpvsb.tickets.com/
        session_guest__wait_for_url_view_tickets:
            url: "*mpvsb.tickets.com*"
            timeout: 30000

        # NOTE: the AXS sibling case (axs_fee_breakdown_ui.yaml) continues after this point with a
        #       partner session and a full-refund flow that asserts Net Earning == -transaction-fees.
        #       Both are intentionally ABSENT here:
        #         - **TDC tickets cannot be refunded** — the provider does not allow cancellation after
        #           purchase, so
        #             POST https://release.katana-api.1m.app/merchant-orders/<moid>/refunds -> 400
        #             "These tickets cannot be refunded. The ticket provider does not allow tickets to
        #              be cancelled once they are purchased."  (RefundService.assertUpstreamCancellable)
        #           and the UI shows "Refund failed — The refund could not be completed.".
        #         - the partner session existed only to drive that refund flow, so it was removed with
        #           it (partner auth is still covered by axs_fee_breakdown_ui.yaml and the API suite).
        #       Add the partner/refund steps back only once TDC refunds are supported.
