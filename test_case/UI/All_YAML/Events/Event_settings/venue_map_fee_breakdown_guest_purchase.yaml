# author: Lury
# time: 2026/9/22 14:16

# --- testT5649_venue_map_guest_purchase: guest checks the fee breakdown and buys the venue map ticket ---
#
# [REFACTOR 2026-10-13] All execute_js blocks were replaced by framework-native actions
# (verify_defined / open / verify_text_regex / verify_row_value / extract_value / compute_value ...).
# No JS left in this case.
testT5649_venue_map_guest_purchase:
    is_mobile: true
    description: "Verify the fee breakdown for venue map ticket on checkout - then place order - check seat info in order confirmation page - refund"
    expect_result: "Checkout shows a fee breakdown for the venue map ticket; order can be placed and the confirmation page shows seat info; partner can refund the order"
    test_step:
        # 0. [SELF-SEED] This case no longer depends on the parent case
        #     (venue_map_fee_breakdown_ui.yaml) publishing cross-case globals. All six values are
        #     extracted locally below: post_url (constant, step 1b), ticket_venue_map + my_revenve
        #     (from the public post, step 2b), transaction-fees + ticket-retails-price (from the
        #     Checkout drawer, step 8c) and taxes (derived, step 8c).

        # 1. Create the guest session (no cookie = visitor); saved temp vars are copied into it
        create_session_guest: { name: "guest" }
        sleep_guest_session: 1000

        # 1b. [SELF-SEED] post_url —— fixed constant; the venue-map public post slug equals the
        #      event name. Set locally (no global) so this case runs standalone; `open` below
        #      backfills {{post_url}} from this temp var.
        set_value_post_url:
            value: "{BASE_URL}/autotestshop/post/event-for-ui-auto-venue-map"
            save_as: "post_url"

        # 2. As a guest, open the public post. `open` backfills {{var}} now, so no
        #     `location.href='{{post_url}}'` JS is needed.
        session_guest__open: { url: "{{post_url}}" }
        sleep_guest_post: 5000

        # 2b. [SELF-SEED] Extract ticket_venue_map (product name) and my_revenve (net price) from
        #      the PUBLIC POST itself, replacing the cross-case globals the parent published.
        #      [DOM FACT, verified 2026-10-16 on release] the public-post product card is NOT a
        #      `mui-stack` (that testid belongs to the partner Tickets & Merch tab). The public
        #      card is `div[role='button'][data-track-location='ticket_all_1']` containing:
        #        - the product name = the card's FIRST <p> (e.g. "General Admission 01");
        #        - the price = a <p> whose class contains 'price' (e.g. "$60.00");
        #        - a "Buy Ticket" button.
        #      So we target the first non-Sold-out public card: name = its first <p>, net price
        #      (My revenue — shown NET because "Show fee breakdown at checkout" is ON) = the price <p>.
        session_guest__extract_value_ticket_name:
            locator: "xpath=(//div[@role='button'][.//p[contains(@class, 'price')]][not(contains(., 'Sold out'))]//p)[1]"
            source: text
            numeric: false
            save_as: "ticket_venue_map"
            timeout: 20000
        session_guest__extract_value_my_revenue:
            locator: "xpath=(//div[@role='button'][.//p[contains(@class, 'price')]][not(contains(., 'Sold out'))]//p[contains(@class, 'price')])[1]"
            source: text
            regex: "\\$\\s*([\\d,]+(?:\\.\\d+)?)"
            save_as: "my_revenve"
            timeout: 20000
        sleep_seed_post: 800

        # 3. As a guest, find the product by name in the post and assert its displayed price
        session_guest__verify_text_regex_post_price:
            scope: "xpath=//*[normalize-space(.)='{{ticket_venue_map}}']/ancestor::*[contains(., '$')][1]"
            pattern: "\\$\\s*{{my_revenve}}\\b"
            timeout: 20000

        # ==================== guest checkout flow ====================
        # 4. As a guest, click the ticket-venue_map product name on the public post to open the "Select tickets" drawer
        session_guest__R_click_product: { locator: "xpath=//*[normalize-space(.)='{{ticket_venue_map}}']", index: 0 }

        # 5. On the opened "Select tickets" drawer a venue map is shown. Select ONE table.
        #    [BUG FIX 2026-10-16, measured with a guest probe] the OLD code clicked twice —
        #    `rect[data-id]` idx 0 (= a table) and then `circle[data-id]` idx 1 — and BOTH clicks
        #    really SELECT an item, so the cart ended up with TWO tables:
        #        before any click : "0 items selected / Total: $0.00"
        #        after the rect   : "1 item selected / Total: $100.00"   <- what this case wants
        #        after the circle : "2 items selected / Total: $200.00"
        #    The case's arithmetic is written for ONE item, so the Cart/Checkout then read
        #        Subtotal $200.00 (expected my_revenve $100.00)  -> verify_row_value: row
        #        'Subtotal' amount 200.0 != expected '100.00';  Transaction fees $24.44 (= 2x12.22)
        #    and the derived `taxes` came out as a bogus $100.00 (= Total - net - fees) which would
        #    then demand a "Taxes" row that does not exist. Selecting a single table keeps every
        #    downstream number on the intended 1-item footing:
        #        Subtotal $100.00 + Transaction fees $12.22 + taxes $0.00 = Total $112.22
        #    Do NOT add a second selection back: any extra click on `rect[data-id]` /
        #    `circle[data-id]` adds another table to the cart.
        #    [MEASURED 2026-10-16 with an iPhone-14-Pro-Max probe] `rect[data-id]` idx 0 and
        #    `circle[data-id]` idx 0 are the SAME table (outline + centre dot), so clicking the
        #    circle at index 0 DESELECTS it ("1 item selected / Total: $60.00" -> "0 items
        #    selected"). The old code's circle click used `index: 1` = a different table, which
        #    is why it really added a 2nd item.
        #    [RACE FIX 2026-10-16] `expect` + `retries`: the drawer can open and the
        #    `rect[data-id]` nodes be attached BEFORE the SVG map finishes laying out. A
        #    dispatch on a not-yet-laid-out node is accepted by Playwright but IGNORED by the
        #    widget, so the cart silently stays empty and the NEXT step failed far away with a
        #    misleading `pattern '\$\s*60.00\b' not found`. Now the dispatch is repeated until
        #    the drawer really shows "1 item selected".
        sleep_map_ready: 1500
        session_guest__dispatch_click_map_hint:
            locator: "rect[data-id]"
            index: 0
            timeout: 15000
            retries: 4
            retry_delay: 1000
            expect:
                scope: ".MuiDrawer-root:has-text('Select tickets')"
                text: "1 item selected"
                timeout: 4000
        sleep_map_hint: 1500

        # 6. Assert the price shown in the drawer == my_revenve
        session_guest__verify_text_regex_drawer_price:
            scope: ".MuiDrawer-root:has-text('Select tickets')"
            pattern: "\\$\\s*{{my_revenve}}\\b"
            timeout: 20000

        # 7. Capture seat_unit: the number immediately before the price on the Select tickets
        session_guest__extract_value_seat_unit:
            locator: ".MuiDrawer-root:has-text('Select tickets')"
            source: text
            regex: "([\\d][\\d.,]*)\\s*\\$\\s*[\\d.,]+"
            numeric: false
            save_as: "seat_unit"
            timeout: 15000
        sleep_seat_unit: 800

        # 8. Click Buy now and wait 3s to reach the Checkout drawer
        session_guest__R_click_buy_now: { role: "button", name: "Buy now" }
        sleep_guest_checkout: 3000

        # 8c. [SELF-SEED] Derive the fee values locally instead of consuming the parent's
        #      cross-case globals (transaction-fees / taxes / ticket-retails-price). The guest
        #      session cannot open the partner's Fees+Taxes popover, but the Checkout drawer
        #      line-items the same numbers, and the "Total" row is ALWAYS present (even when
        #      taxes == 0, where the "Taxes" row is hidden). So:
        #        - transaction-fees: from the "Transaction fees" row (always present)
        #        - ticket-retails-price == checkout Total: what the buyer actually pays
        #        - taxes: derived = Total - my_revenve - transaction-fees (0 when no tax row)
        #      This keeps the case standalone AND robust to a zero-tax configuration.
        # [KEY FIX 2026-10-16] labelled rows ("Transaction fees" / "Total") -> `extract_row_value_*`
        # (previously `extract_*`, unreachable prefix -> "Step not found").
        # [CROSS-CASE CONSISTENCY FIX 2026-10-16] `global: true` on the fee row: this guest order
        # IS the order the partner case (venue_map_fee_breakdown_partner_full_refund.yaml) then
        # refunds, and it asserts `Net Earning == -(transaction-fees)`. The parent case also
        # publishes a `transaction-fees` global, but it reads the Fees + Taxes popover of
        # whichever product the EVENT page lists first, which is NOT necessarily the product the
        # guest bought (the event has 2 products with different platform fees: $60 -> $7.77,
        # $100 -> $12.22). Real failure: parent published 12.22 while the refunded order's fee was
        # 7.77 -> `Net Earning -7.77 != expected '-12.22'`. Publishing the guest's OWN Checkout
        # fee closes the loop, because the guest runs before the partner in the same process.
        session_guest__extract_row_value_transaction_fees:
            label: "Transaction fees"
            scope: ".MuiDrawer-root:has-text('Checkout')"
            save_as: "transaction-fees"
            global: true
            signed: false
            timeout: 15000
        # [tail_limit FIX 2026-10-16] the Checkout "Total" row renders as
        #     Total / $67.77 / (Including $7.77 fees)
        # i.e. the amount's own ancestor tail is "$67.77 (Including $7.77 fees)" = 29 chars,
        # LONGER than the default tail_limit of 24 -> `_find_row_amount` rejects the row and
        # reports "label matched 1 element(s) but no '$' amount within 4 ancestor level(s)".
        # [MEASURED with tools/probe_guest_checkout_fees.py] lvl0 = 0 chars, lvl1 = 29 chars.
        # 60 keeps the first-amount-wins rule intact while clearing the "(Including …)" suffix.
        session_guest__extract_row_value_checkout_total:
            label: "Total"
            scope: ".MuiDrawer-root:has-text('Checkout')"
            save_as: "checkout_total_venue_map"
            tail_limit: 60
            timeout: 15000
        # [KEY FIX 2026-10-16] money math -> `compute_value_*` (previously `compute_*`).
        session_guest__compute_value_taxes:
            expression: "{{checkout_total_venue_map}} - {{my_revenve}} - {{transaction-fees}}"
            save_as: "taxes"
        session_guest__compute_value_retails_price:
            expression: "{{checkout_total_venue_map}}"
            save_as: "ticket-retails-price"

        # 9. Assert on the Checkout drawer:
        session_guest__verify_text_visible_checkout_name:
            text: "{{ticket_venue_map}}"
            scope: { locator: ".MuiDrawer-root:has-text('Checkout')" }
            timeout: 20000

        session_guest__verify_text_regex_no_incl_suffix:
            scope: ".MuiDrawer-root:has-text('Checkout')"
            pattern: "incl\\.?\\s*\\$"
            assert_not_match: true
            timeout: 15000
        session_guest__verify_text_regex_line_price:
            scope: ".MuiDrawer-root:has-text('Checkout')"
            pattern: "\\$\\s*{{my_revenve}}\\b"
            timeout: 15000
        session_guest__compute_value_checkout_total:
            expression: "{{my_revenve}} + {{transaction-fees}} + {{taxes}}"
            save_as: "checkout_total_venue_map"
        session_guest__verify_row_value_total:
            label: "Total"
            scope: ".MuiDrawer-root:has-text('Checkout')"
            value: "{{checkout_total_venue_map}}"
            tolerance: 0.01
            tail_limit: 60      # same "(Including $X fees)" suffix as the extraction above
            timeout: 20000
        # product info "Unit" must equal seat_unit. [DOM FACT] the label and value share one
        # leaf, e.g. "Unit: 1".
        session_guest__verify_text_regex_unit:
            scope: ".MuiDrawer-root:has-text('Checkout')"
            pattern: "\\bUnits?\\s*:?\\s*{{seat_unit}}\\b"
            flags: "i"
            timeout: 15000

        # 10. Click Total to expand the fee breakdown
        session_guest__R_click_total: { locator: "xpath=//*[normalize-space(.)='Total']", index: 0 }

        # 11. Assert in the expanded breakdown:
        session_guest__verify_row_value_subtotal:
            label: "Subtotal"
            scope: ".MuiDrawer-root:has-text('Checkout')"
            value: "{{my_revenve}}"
            tolerance: 0.01
            timeout: 20000
        session_guest__verify_row_value_transaction_fees:
            label: "Transaction fees"
            scope: ".MuiDrawer-root:has-text('Checkout')"
            value: "{{transaction-fees}}"
            tolerance: 0.01
            # [signed FIX 2026-10-16] a buyer-side fee is NEVER negative, yet with the default
            # `signed: true` the row read back as **-7.77** (the climb from the label to the
            # amount's container can pick up a stray '-' from a neighbouring node). That poisoned
            # the published global: the partner case computes `0 - {{transaction-fees}}` and got
            # a POSITIVE expected Net Earning ("Net Earning amount -7.77 != expected '7.77'").
            signed: false
            timeout: 20000
        session_guest__verify_row_value_taxes:
            label: "Taxes"
            scope: ".MuiDrawer-root:has-text('Checkout')"
            value: "{{taxes}}"
            tolerance: 0.01
            absent_when_zero: true
            timeout: 20000

        # 12. Click the Checkout CTA to reach the contact + payment form.
        #     [UI FACT 2026-10-16] the venue_map Checkout drawer does NOT carry the
        #     `checkout-in-post-continue-cta` testid (writing it alone dies with
        #     `smart_click: element not found`); the live CTA is the old-style
        #     `Continue with credit card` button, same as TDC and AXS. Use the JOINED list so it
        #     works on either variant — CSS picks the first match in DOM order.
        session_guest__R_click_checkout_continue:
            locator: "button[data-testid='checkout-in-post-credit-card-cta'], button[data-testid='checkout-in-post-continue-cta'], button:has-text('Continue with credit card')"
            timeout: 15000
        sleep_guest_cc_form: 5000

        # 13. Fill in Contact (First name / Last name / Phone / Email)
        session_guest__fill_first_name: { locator: "input[name='contact.firstName']", value: "Lury" }
        session_guest__fill_last_name: { locator: "input[name='contact.lastName']", value: "UIAutomation" }
        session_guest__fill_phone: { locator: "input[name='contact.phoneNumber']", value: "2524001111" }
        session_guest__fill_email: { locator: "input[name='contact.email']", value: "dian.yuhong.ext+111@1m.app" }
        sleep_guest_contact: 1000

        # 14. Fill the payment form with the framework-native `fill_stripe_iframe` action — the
        session_guest__fill_stripe_iframe:
            card_number: "4242424242424242"
            expiry: "830"
            cvc: "999"
            card_name: "lury UI automation"
            zipcode: "90021"
        sleep_guest_payment: 2000

        # 15. Assert the payment form was filled correctly (Playwright-native input_value
        session_guest__verify_value_first_name: { locator: "input[name='contact.firstName']", value: "Lury" }
        session_guest__verify_value_last_name: { locator: "input[name='contact.lastName']", value: "UIAutomation" }
        session_guest__verify_value_email: { locator: "input[name='contact.email']", value: "dian.yuhong.ext+111@1m.app" }
        session_guest__verify_value_card_name: { locator: "input[name='cardName']", value: "lury UI automation" }
        session_guest__verify_value_zipcode: { locator: "input[name='billingAddress.zipcode']", value: "90021" }
        session_guest__verify_value_phone:
            locator: "input[name='contact.phoneNumber']"
            regex: "(\\d\\D*){10}"

        # 16. Click Place order
        session_guest__R_click_place_order: { role: "button", name: "Place order" }
        sleep_place_order: 8000

        # ==================== order placed + order confirmation page checks ====================
        # 17. [HARD ASSERTION] order placed (Playwright-native): wait_for_url polls until the
        #     URL lands on /order/<id>/confirmation, then the confirmation copy must be visible.
        #     [COPY DRIFT 2026-10-16] the current release greets the buyer with
        #     "Thank you for your payment." (+ a "Confirmation #<id>" line), not the older
        #     "Your order is confirmed" -> `text` takes a LIST of accepted copies (any-of).
        session_guest__wait_for_url_order_confirmation:
            url: "**/order/**/confirmation"
            timeout: 30000
        session_guest__verify_order_confirmed:
            text:
                - "Thank you for your payment."
                - "Your order is confirmed"
            timeout: 20000

        # 18-19. [UI DRIFT 2026-10-16, verified on a real AXS order #P192196] the confirmation page
        #     now renders the order details ALREADY EXPANDED: there is no "Show summary" toggle any
        #     more (clicking it times out while the page already shows Item(s) total / Subtotal /
        #     Total). The old `verify_row_value_show_summary` assertion was therefore removed — it
        #     named a label that no longer exists, and the very same money values are hard-asserted
        #     by step 20's Item(s) total / Subtotal / Total rows. This step keeps expanding the
        #     summary on builds that still render the toggle and skips silently when it is absent.
        session_guest__smart_click_optional_show_summary:
            locator: "xpath=//*[normalize-space(.)='Show summary']"
            timeout: 5000

        # 20. Assert the details: Item(s) total / Subtotal / Total all equal ticket-retails-price,
        #     and an "(incl. $a fees)" row exists where a == transaction-fees
        session_guest__verify_row_value_item_total:
            label: "Item(s) total"
            value: "{{ticket-retails-price}}"
            tolerance: 0.01
            timeout: 20000
        session_guest__verify_row_value_order_subtotal:
            label: "Subtotal"
            value: "{{ticket-retails-price}}"
            tolerance: 0.01
            timeout: 20000
        session_guest__verify_row_value_order_total:
            label: "Total"
            value: "{{ticket-retails-price}}"
            tolerance: 0.01
            timeout: 20000
        # "(including $a fees)" — the actual copy is "(incl. $5.27 fees)"; accept both
        session_guest__verify_text_regex_incl_fees_row:
            pattern: "(?:including|incl\\.?)\\s*\\$\\s*{{transaction-fees}}\\s*fees"
            flags: "i"
            timeout: 20000

        # 21. Check the "Ticket Information" section on the confirmation page: it must contain
        session_guest__verify_ticket_info_event: { text: "event-for-ui-auto-venue-map", timeout: 20000 }
        session_guest__verify_text_regex_ticket_info_name:
            pattern: "{{ticket_venue_map}}"
            timeout: 20000
        session_guest__verify_text_regex_ticket_info_unit:
            pattern: "(?:\\bUnits?\\s*:?\\s*{{seat_unit}}\\b|\\b{{seat_unit}}\\s*units?\\b)"
            flags: "i"
            timeout: 20000

        # 22. Assert Confirmation details: contact information / payment method / billing zip code
        session_guest__verify_contact_name: { text: "Lury UIAutomation", timeout: 20000 }
        session_guest__verify_contact_phone: { text: "252-400-1111" }
        session_guest__verify_contact_email: { text: "dian.yuhong.ext+111@1m.app" }
        session_guest__verify_card_tail: { text: "Visa x4242" }
        session_guest__verify_zip_code: { text: "90021", exact: true }
        session_guest__verify_text_regex_paid_amount:
            pattern: "Visa\\s*x4242\\s*-\\s*\\$\\s*{{ticket-retails-price}}\\b"
            flags: "i"
            timeout: 20000
