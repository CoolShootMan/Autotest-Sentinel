# author: Lury
# time: 2026/9/22 14:16

# --- testT5649_venue_map_guest_purchase: guest checks the fee breakdown and buys the venue map ticket ---
#
# [REFACTOR 2026-10-13] All execute_js blocks were replaced by framework-native actions
# (verify_defined / open / verify_text_regex / verify_row_value / extract_value / compute_value ...).
# No JS left in this case.
testT5649_venue_map_guest_purchase:
    is_mobile: true
    description: "Verify the fee breakdown for venue map ticket on checkout - then place order - check seat info in order confirmation page - refund"
    expect_result: "Checkout shows a fee breakdown for the venue map ticket; order can be placed and the confirmation page shows seat info; partner can refund the order"
    test_step:
        # 0. (guard) Fail fast with a clear message if the cross-case globals from the parent case
        #     are missing (was execute_js_ensure_globals). Without this, an unset post_url would
        #     navigate to a literal "{{post_url}}" and Chrome would throw a cryptic
        #     "'' is not a valid URL" SyntaxError instead.
        verify_defined_globals:
            vars: [post_url, ticket_venue_map, ticket-retails-price, my_revenve, transaction-fees, taxes]

        # 1. Create the guest session (no cookie = visitor); saved temp vars are copied into it
        create_session_guest: { name: "guest" }

        # 2. As a guest, open the public post. `open` backfills {{var}} now, so no
        #     `location.href='{{post_url}}'` JS is needed.
        session_guest__open: { url: "{{post_url}}" }
        sleep_guest_post: 5000

        # 3. As a guest, find the product by name in the post and assert its displayed price
        #     == my_revenve (net revenue).
        #     [DOM FACT] a post product card = the NEAREST ancestor of the product-name leaf that
        #     carries a "$" amount. On a venue_map public post that amount is the NET price
        #     (My revenue), e.g. "General Admission 02 / $100.00 / Buy Ticket".
        session_guest__verify_text_regex_post_price:
            scope: "xpath=//*[normalize-space(.)='{{ticket_venue_map}}']/ancestor::*[contains(., '$')][1]"
            pattern: "\\$\\s*{{my_revenve}}\\b"
            timeout: 20000

        # ==================== guest checkout flow ====================
        # 4. As a guest, click the ticket-venue_map product name on the public post to open the "Select tickets" drawer
        session_guest__R_click_product: { locator: "xpath=//*[normalize-space(.)='{{ticket_venue_map}}']", index: 0 }

        # 5. On the opened "Select tickets" drawer a venue map is shown. Select a table.
        #     [WHY dispatch_click] This is an SVG table map: the interactive nodes are
        #     `circle[data-id]` (covered, so a real click times out on the hit-target check) and
        #     `rect[data-id]` (`pointer-events: none`, so a real click passes through). Dispatching
        #     the pointer/mouse sequence works. Two dispatches are needed and reproduce
        #     deterministically (verified on release 2026-10-13, twice):
        #       (a) a dispatch on the first hit area dismisses the
        #           "Zoom in and select tables" overlay, then
        #       (b) a dispatch on a seat circle selects the table
        #           -> the drawer becomes "1 table selected / Total: $100.00 / 10 / $100.00".
        #     See actions/base.py `dispatch_click`.
        session_guest__dispatch_click_map_hint:
            locator: "rect[data-id]"
            index: 0
            timeout: 15000
        sleep_map_hint: 1500
        session_guest__dispatch_click_select_seat:
            locator: "circle[data-id]"
            index: 1
            timeout: 15000
        sleep_select_seat: 2500

        # 6. Assert the price shown in the drawer == my_revenve
        session_guest__verify_text_regex_drawer_price:
            scope: ".MuiDrawer-root:has-text('Select tickets')"
            pattern: "\\$\\s*{{my_revenve}}\\b"
            timeout: 20000

        # 7. Capture seat_unit: the number immediately before the price on the Select tickets
        #     drawer (the quantity of seats selected, e.g. "1" in "1 × $100.00"). Save as seat_unit.
        #     (numeric:false so the value stays "1" instead of being formatted to "1.00")
        session_guest__extract_value_seat_unit:
            locator: ".MuiDrawer-root:has-text('Select tickets')"
            source: text
            regex: "([\\d][\\d.,]*)\\s*\\$\\s*[\\d.,]+"
            numeric: false
            save_as: "seat_unit"
            timeout: 15000
        sleep_seat_unit: 800

        # 8. Click Buy now and wait 3s to reach the Checkout drawer
        session_guest__R_click_buy_now: { role: "button", name: "Buy now" }
        sleep_guest_checkout: 3000

        # 8b. (guard, optional) "Access code required" overlay.
        #     [WHY] This shared venue-map post can be left with Payment Restriction ON by
        #     `Post/Post_setting_for_venue_map.yaml :: testT4955_Partner_SetPaymentRestriction_venue_map`
        #     (it enables the restriction with the access code `demi123`; the code persists
        #     server-side). When that state is active, "Buy now" opens an "Access code required"
        #     dialog and the Checkout drawer never appears, so step 9 below would fail with
        #     "Scope container '.MuiDrawer-root:has-text('Checkout')' not found".
        #     Both steps are OPTIONAL: on a clean post the dialog is absent and they skip silently
        #     (`smart_fill` gained `optional: true` for exactly this; `smart_click_optional`
        #     already existed). Recipe mirrored from the only case in the repo that exercises
        #     this dialog (Post_setting_for_venue_map.yaml T4955 guest half).
        session_guest__fill_access_code_optional:
            role: "textbox"
            name: "Enter code"
            value: "demi123"
            optional: true
            timeout: 5000
        session_guest__smart_click_optional_confirm_code:
            role: "button"
            name: "Confirm"
        sleep_access_code: 3000

        # 9. Assert on the Checkout drawer:
        #     product name == ticket-venue_map; unit price == my_revenve; no "(incl. $ fees)" suffix;
        #     Total == my_revenve + transaction-fees + taxes
        session_guest__verify_text_visible_checkout_name:
            text: "{{ticket_venue_map}}"
            scope: { locator: ".MuiDrawer-root:has-text('Checkout')" }
            timeout: 20000
        # [PRICING FACT] the checkout line itemises the fees, so the product price must NOT
        # carry the "(incl. $ fees)" buyer-facing suffix anymore.
        session_guest__verify_text_regex_no_incl_suffix:
            scope: ".MuiDrawer-root:has-text('Checkout')"
            pattern: "incl\\.?\\s*\\$"
            assert_not_match: true
            timeout: 15000
        session_guest__verify_text_regex_line_price:
            scope: ".MuiDrawer-root:has-text('Checkout')"
            pattern: "\\$\\s*{{my_revenve}}\\b"
            timeout: 15000
        session_guest__compute_value_checkout_total:
            expression: "{{my_revenve}} + {{transaction-fees}} + {{taxes}}"
            save_as: "checkout_total_venue_map"
        session_guest__verify_row_value_total:
            label: "Total"
            scope: ".MuiDrawer-root:has-text('Checkout')"
            value: "{{checkout_total_venue_map}}"
            tolerance: 0.01
            timeout: 20000
        # product info "Unit" must equal seat_unit. [DOM FACT] the label and value share one
        # leaf, e.g. "Unit: 1".
        session_guest__verify_text_regex_unit:
            scope: ".MuiDrawer-root:has-text('Checkout')"
            pattern: "\\bUnits?\\s*:?\\s*{{seat_unit}}\\b"
            flags: "i"
            timeout: 15000

        # 10. Click Total to expand the fee breakdown
        session_guest__R_click_total: { locator: "xpath=//*[normalize-space(.)='Total']", index: 0 }

        # 11. Assert in the expanded breakdown:
        #     Subtotal == my_revenve; Transaction fees == transaction-fees;
        #     when taxes != 0 a "Taxes" row must show Taxes == taxes, when taxes == 0 it may be hidden.
        #     (was one big execute_js rowVal() block -> native labelled-row assertions)
        session_guest__verify_row_value_subtotal:
            label: "Subtotal"
            scope: ".MuiDrawer-root:has-text('Checkout')"
            value: "{{my_revenve}}"
            tolerance: 0.01
            timeout: 20000
        session_guest__verify_row_value_transaction_fees:
            label: "Transaction fees"
            scope: ".MuiDrawer-root:has-text('Checkout')"
            value: "{{transaction-fees}}"
            tolerance: 0.01
            timeout: 20000
        session_guest__verify_row_value_taxes:
            label: "Taxes"
            scope: ".MuiDrawer-root:has-text('Checkout')"
            value: "{{taxes}}"
            tolerance: 0.01
            absent_when_zero: true
            timeout: 20000

        # 12. Click the Checkout CTA to reach the contact + payment form.
        #     [UI DRIFT 2026-10-13, browser-verified] the drawer CTA is no longer
        #     "Continue with credit card": the Checkout drawer renders ONE CTA
        #     `button[data-testid='checkout-in-post-continue-cta']` whose label is just
        #     "Continue" (probe of the live release drawer: only in-drawer buttons are
        #     "Add a note" and that Continue CTA). Clicking it replaces the drawer body with
        #     `Contact: First name / Last name / Phone / Email` +
        #     `input[name='contact.firstName'|'contact.lastName'|'contact.phoneNumber'|'contact.email']`
        #     and swaps the CTA for "Place order" — exactly what steps 13-16 below fill/submit.
        session_guest__R_click_checkout_continue:
            locator: "button[data-testid='checkout-in-post-continue-cta']"
            timeout: 15000
        sleep_guest_cc_form: 5000

        # 13. Fill in Contact (First name / Last name / Phone / Email)
        session_guest__fill_first_name: { locator: "input[name='contact.firstName']", value: "Lury" }
        session_guest__fill_last_name: { locator: "input[name='contact.lastName']", value: "UIAutomation" }
        session_guest__fill_phone: { locator: "input[name='contact.phoneNumber']", value: "2524001111" }
        session_guest__fill_email: { locator: "input[name='contact.email']", value: "dian.yuhong.ext+111@1m.app" }
        sleep_guest_contact: 1000

        # 14. Fill the payment form with the framework-native `fill_stripe_iframe` action — the
        #     same action the axs/tdc guest cases use.
        #     [WHY, browser-verified 2026-10-13] the previous version hard-coded the Stripe
        #     Elements frame by VISIBLE ORDER (`iframe[src*='elements-inner-card'] >> nth=0/1/2`)
        #     and filled `input[name='cardnumber'|'exp-date'|'cvc']` one by one. That selector no
        #     longer resolves on the current release checkout: `fill_card_number` timed out with
        #     "Locator.fill: Timeout 10000ms exceeded" while the page exposed only the Stripe
        #     controller / payment-request / metrics frames — NO `elements-inner-card` frame.
        #     `fill_stripe_iframe` walks EVERY stripe frame (nested ones included) and looks the
        #     inputs up by name, so it does not depend on frame order or count; it also fills
        #     `cardName` / `billingAddress.zipcode` on the page itself.
        session_guest__fill_stripe_iframe:
            card_number: "4242424242424242"
            expiry: "830"
            cvc: "999"
            card_name: "lury UI automation"
            zipcode: "90021"
        sleep_guest_payment: 2000

        # 15. Assert the payment form was filled correctly (Playwright-native input_value
        #     assertions; the phone field is auto-formatted so it is checked with a regex
        #     requiring at least 10 digits — was a tiny execute_js)
        session_guest__verify_value_first_name: { locator: "input[name='contact.firstName']", value: "Lury" }
        session_guest__verify_value_last_name: { locator: "input[name='contact.lastName']", value: "UIAutomation" }
        session_guest__verify_value_email: { locator: "input[name='contact.email']", value: "dian.yuhong.ext+111@1m.app" }
        session_guest__verify_value_card_name: { locator: "input[name='cardName']", value: "lury UI automation" }
        session_guest__verify_value_zipcode: { locator: "input[name='billingAddress.zipcode']", value: "90021" }
        session_guest__verify_value_phone:
            locator: "input[name='contact.phoneNumber']"
            regex: "(\\d\\D*){10}"

        # 16. Click Place order
        session_guest__R_click_place_order: { role: "button", name: "Place order" }
        sleep_place_order: 8000

        # ==================== order placed + order confirmation page checks ====================
        # 17. [HARD ASSERTION] order placed (Playwright-native): wait_for_url polls until the
        #     URL lands on /order/<id>/confirmation, then the confirmation copy must be visible.
        session_guest__wait_for_url_order_confirmation:
            url: "**/order/**/confirmation"
            timeout: 30000
        session_guest__verify_order_confirmed: { text: "Your order is confirmed", timeout: 20000 }

        # 18. Assert the price next to "Show summary" == ticket-retails-price
        #     (was execute_js: the amount sits in a HIGHER ancestor of "Show summary", and only a
        #     SHORT tail counts as this row's amount -> tail_limit 16)
        session_guest__verify_row_value_show_summary:
            label: "Show summary"
            value: "{{ticket-retails-price}}"
            tail_limit: 16
            levels: 6
            tolerance: 0.01
            timeout: 20000

        # 19. Click Show summary to expand the order details
        session_guest__R_click_show_summary: { locator: "xpath=//*[normalize-space(.)='Show summary']" }

        # 20. Assert the details: Item(s) total / Subtotal / Total all equal ticket-retails-price,
        #     and an "(incl. $a fees)" row exists where a == transaction-fees
        session_guest__verify_row_value_item_total:
            label: "Item(s) total"
            value: "{{ticket-retails-price}}"
            tolerance: 0.01
            timeout: 20000
        session_guest__verify_row_value_order_subtotal:
            label: "Subtotal"
            value: "{{ticket-retails-price}}"
            tolerance: 0.01
            timeout: 20000
        session_guest__verify_row_value_order_total:
            label: "Total"
            value: "{{ticket-retails-price}}"
            tolerance: 0.01
            timeout: 20000
        # "(including $a fees)" — the actual copy is "(incl. $5.27 fees)"; accept both
        session_guest__verify_text_regex_incl_fees_row:
            pattern: "(?:including|incl\\.?)\\s*\\$\\s*{{transaction-fees}}\\s*fees"
            flags: "i"
            timeout: 20000

        # 21. Check the "Ticket Information" section on the confirmation page: it must contain
        #     the product name and a Unit equal to seat_unit.
        #     (Date and Venue checks were removed per request. The event name is static so it is
        #     a Playwright-native text assertion; name/Unit are dynamic -> regex with {{var}}.)
        session_guest__verify_ticket_info_event: { text: "event-for-ui-auto-venue-map", timeout: 20000 }
        session_guest__verify_text_regex_ticket_info_name:
            pattern: "{{ticket_venue_map}}"
            timeout: 20000
        session_guest__verify_text_regex_ticket_info_unit:
            pattern: "(?:\\bUnits?\\s*:?\\s*{{seat_unit}}\\b|\\b{{seat_unit}}\\s*units?\\b)"
            flags: "i"
            timeout: 20000

        # 22. Assert Confirmation details: contact information / payment method / billing zip code
        #     (Playwright-native text assertions for the static parts; the paid amount is dynamic
        #     so it is a regex with {{var}}. The page shows the phone as 252-400-1111.)
        session_guest__verify_contact_name: { text: "Lury UIAutomation", timeout: 20000 }
        session_guest__verify_contact_phone: { text: "252-400-1111" }
        session_guest__verify_contact_email: { text: "dian.yuhong.ext+111@1m.app" }
        session_guest__verify_card_tail: { text: "Visa x4242" }
        session_guest__verify_zip_code: { text: "90021", exact: true }
        session_guest__verify_text_regex_paid_amount:
            pattern: "Visa\\s*x4242\\s*-\\s*\\$\\s*{{ticket-retails-price}}\\b"
            flags: "i"
            timeout: 20000
