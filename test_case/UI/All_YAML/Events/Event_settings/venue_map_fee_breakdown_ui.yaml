# time: 2026/9/22 14:16

# --- testT5649_venue_map: venue_map-tagged event, enable "Show fee breakdown at checkout" and verify fee breakdown end-to-end ---
#
# [REFACTOR 2026-10-13] All execute_js blocks were replaced by framework-native actions
# (extract_value / compute_value / extract_row_value / set_value ...). No JS left in this case.
testT5649_venue_map:
    is_mobile: true
    description: "Verify the fee breakdown for venue map ticket on checkout - then place order - check seat info in order confirmation page - refund"
    expect_result: "Checkout shows a fee breakdown for the venue map ticket; order can be placed and the confirmation page shows seat info; partner can refund the order"
    test_step:
        # 1. Go to the event list page
        open: "{BASE_URL}/events"
        sleep_list: 5000

        # 2. Search for the event named "event-for-ui-auto-venue-map" and open it.
        R_click_venue_map_event: { locator: "xpath=//*[normalize-space(.)='event-for-ui-auto-venue-map']", index: 0, fallback_scan: true }
        sleep_event: 5000

        # 3. Open the "Tickets & Merch" tab where ticket names are listed
        R_click_tickets_tab: { role: "tab", name: "Tickets & Merch" }
        sleep_tickets: 3000

        # 4. Open event Settings (drawer). Reachable from the Tickets & Merch tab too.
        R_click_settings: { role: "button", name: "Settings" }
        sleep_settings: 3000

        # 5. Enable "Show fee breakdown at checkout".
        #    smart_check is idempotent (set_checked no-ops when already ON) and Playwright's
        #    set_checked hard-asserts the resulting state ("Clicking the checkbox did not
        #    change its state" on failure) -> no extra JS check needed.
        check_fee_breakdown: { locator: "xpath=//input[@name='showFeesBreakdown']", checked: true }
        sleep_fee: 1500

        # 6. Save the settings (drawer closes on success).
        R_click_save: { name: "Save" }
        sleep_save: 3000

        # 8. [GLOBAL VARIABLE] ticket_venue_map —— **跨用例全局变量**（非临时变量）。
        #    Playwright-native (was execute_js): a product card on the "Tickets & Merch" tab is a
        #    `div[data-testid="mui-stack"]` that holds exactly one Tools button
        #    (`button[data-testid="enhance-button"]`). Take the first card that is NOT "Sold out"
        #    and read its product name = the card's first <p>.
        extract_value_ticket_name:
            locator: "xpath=(//div[@data-testid='mui-stack'][.//button[@data-testid='enhance-button']][not(contains(., 'Sold out'))]//p)[1]"
            source: text
            numeric: false
            save_as: "ticket_venue_map"
            global: true
            timeout: 20000
        sleep_extract_name: 800

        # 9. Extract the target ticket's price (the first $ amount on the card = retail price)
        #     -> temp var ticket-retails-price
        extract_value_retail_price:
            locator: "xpath=(//div[@data-testid='mui-stack'][.//button[@data-testid='enhance-button']][not(contains(., 'Sold out'))])[1]"
            source: text
            regex: "\\$\\s*([\\d,]+(?:\\.\\d+)?)"
            save_as: "ticket-retails-price"
            global: true
            timeout: 20000
        sleep_extract_price: 500

        # 10. Extract the "(incl. $x fees)" amount, then compute my_revenve = price - incl
        #     -> temp var my_revenve
        extract_value_incl_fees:
            locator: "xpath=(//div[@data-testid='mui-stack'][.//button[@data-testid='enhance-button']][not(contains(., 'Sold out'))])[1]"
            source: text
            regex: "incl\\.?\\s*\\$\\s*([\\d,]+(?:\\.\\d+)?)"
            save_as: "incl_fees_price"
            timeout: 20000
        compute_value_my_revenue:
            expression: "{{ticket-retails-price}} - {{incl_fees_price}}"
            save_as: "my_revenve"
            global: true
        sleep_extract_rev: 800

        # === Open the ticket-venue_map product -> Edit ticket page -> read the fee breakdown -> go back ===

        # 11. Click the ticket-venue_map product (located by the temp var name) to enter the Edit ticket page
        R_click_ticket: { locator: "xpath=//p[normalize-space(.)='{{ticket_venue_map}}']" }
        sleep_edit_ticket: 6000

        # 12. Click the price under "Fees + Taxes" (the 2nd match = the price; the 1st match is
        #     just an explanatory tooltip) to open the breakdown popover
        R_click_fees_taxes: { locator: "xpath=//*[normalize-space(.)='Fees + Taxes']/following-sibling::*[1]", index: 1 }
        sleep_fees_tip: 2000

        # 13. Extract "Platform fees" from the popover -> temp var transaction-fees
        #     (was execute_js; extract_row_value walks the labelled MUI row natively)
        extract_row_value_platform_fees:
            label: "Platform fees"
            scope: ".MuiPopover-root"
            save_as: "transaction-fees"
            global: true
            timeout: 15000

        # 14. Extract "Taxes" from the popover -> temp var taxes
        extract_row_value_taxes:
            label: "Taxes"
            scope: ".MuiPopover-root"
            save_as: "taxes"
            global: true
            timeout: 15000

        # 15. This price popover is a modal and covers the Back button, so press Escape to close it
        #     first, then click the Back button (header CloseIcon, aria-label="Back") to go back
        press_close_popover: { key: "Escape" }
        sleep_after_esc: 1200
        R_click_close_ticket: { locator: "button[aria-label='Back']" }
        sleep_back: 3000

        # 15b. Conditional unsaved-changes guard: clicking Back may pop an in-app
        #      "Leave this page?" confirmation (only when there ARE unsaved changes).
        #      smart_click_optional clicks the button when present and silently skips
        #      when the dialog is not there (Playwright-native, no JS).
        smart_click_optional_leave_without_saving: { text: "Leave without saving" }
        sleep_leave: 1500

        # 17. Build the guest-accessible public post URL -> GLOBAL var post_url
        #     (published cross-case so venue_map_fee_breakdown_guest_purchase.yaml can reuse it)
        #     [REFACTOR] The old case read the event name off the page and ran a slugify() JS to
        #     build this URL. Ruby-style slugification is not expressible with the arithmetic
        #     `compute_value`, and the event name is already a literal in step 2
        #     ("event-for-ui-auto-venue-map", whose slug is itself) -> publish the URL directly.
        set_value_post_url:
            value: "{BASE_URL}/autotestshop/post/event-for-ui-auto-venue-map"
            save_as: "post_url"
            global: true
