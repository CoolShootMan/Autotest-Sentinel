# --- Original Scan Cases ---
testT3981_Verified:
    is_mobile: true
    description: "Verify scanner auto-redeems a valid ticket via fake camera QR scan"
    test_step:
        # Precondition: reset ticket to un-redeemed state
        run_workflow_script: { script: "reset_scan_ticket.py" }
        sleep_reset: 2000
        # Open scanner page - fake camera (Ticket_Small.y4m) auto-feeds QR code
        open: "https://s.pear.us/7DCjTz"
        sleep_open: 12000
    expect_result:
        description: "Shows Code Verified and ticket redeemed"
        assertions:
            - { assertion_type: "element_visible_by_text", text: "Code Verified", timeout: 20000 }
            - { assertion_type: "element_visible_by_text", text: "Redeemed" }

testT3981_Already:
    is_mobile: true
    description: "Verify QR scanner shows 'Already Redeemed' for an already used ticket"
    test_step:
        open: "https://s.pear.us/7DCjTz"
        sleep_wait_for_scan: 15000
    expect_result:
        description: "Should display Already Redeemed status"
        assertions:
            - { assertion_type: "element_visible_by_text", text: "already been redeemed", timeout: 20000 }

testT3981_NotRecognized:
    is_mobile: true
    description: "Verify QR scanner shows error for an unrecognized/invalid code"
    test_step:
        open: "https://s.pear.us/7DCjTz"
        sleep_wait_for_scan: 15000
    expect_result:
        description: "Should display Code Not Recognized error"
        assertions:
            - { assertion_type: "element_visible_by_text", text: "QR code is for a different event", timeout: 20000 }
