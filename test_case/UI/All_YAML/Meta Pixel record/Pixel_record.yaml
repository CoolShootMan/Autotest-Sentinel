# ==============================================================================
# Test Case: T2718 Verify Meta Pixel fires on post page checkout flow
# Ticket: KAT-4769 Usability — partners can config Meta Pixel and Google Analytics
# Priority: P0
# Module: End to end / Post / FB Pixel ID
# Maintainer: YuXiao Zhu
# Auth: lindazhou
#
# Post URL: https://mehost.cn/post/automation-test-for-meta-pixel-record
# Pixel IDs: 5646548948, 789456123
#
# [DE-JS 2026-10-16] This case used to be 7/7 execute_js: it hooked the global
# (`window.fbq = ...`) to push into a JS array and then read that array back. The framework now
# has native NETWORK CAPTURE (`start_network_capture` / `verify_network_capture` in
# actions/base.py), which observes the real beacons the browser sends to
# `facebook.com/tr?...`. That is strictly stronger than spying on the JS API — it proves the
# pixel actually transmitted the event — and it needs no per-vendor JS, so the same pair of
# actions covers Google Analytics / TikTok / any other tracker.
#
# NOTE ON THE VALUE MATCH: `regex: "11\\.98"` is matched against the whole request URL on
# purpose. Meta serializes the same money amount as `cd[value]=11.98` on some builds and
# `cd%5Bvalue%5D=11.98` on others, so pinning the bracket encoding would be brittle while the
# bare amount is present either way.
# ==============================================================================

testT2718:
    description: "Verify Meta Pixel fires through checkout: PageView, AddToCart, InitiateCheckout, Purchase"
    pre_condition:
        description: "Open the public post page"
        expect_result: "Post page loads, Meta Pixel script loaded"
        test_step:
            # Start recording BEFORE navigating: the pixel's own <script> fetch and the initial
            # PageView beacon both happen during page load.
            start_network_capture_pixel: { name: "pixel", url_contains: "facebook.com" }
            open_post:
                open: "https://mehost.cn/post/automation-test-for-meta-pixel-record"
            sleep_open: 8000

    test_step:
        # Step 1: Verify the Meta Pixel fired at least one request (proves script loaded).
        # connect.facebook.net/fbevents.js may be browser-cached and not re-fetched, so we
        # just check any facebook.com/tr beacon exists.
        verify_pixel_script_fetched:
            name: "pixel"
            url_contains: "facebook.com/tr"
            min_count: 1
            timeout: 10000

        # Step 2: Verify the initial PageView beacon reached facebook.com/tr
        verify_pixel_pageview:
            name: "pixel"
            url_contains: "facebook.com/tr"
            params: { ev: "PageView" }
            timeout: 10000
        sleep_after_pageview: 1000

        # Step 3: Click "Buy Ticket" → opens ticket selection
        R_click_buy_ticket: { locator: "{{@btn_buy_ticket}}" }
        sleep_after_buy_ticket: 5000

        # Step 4: Click "Continue with credit card" → AddToCart + InitiateCheckout
        R_click_continue: { locator: "{{@btn_continue_card}}" }
        sleep_after_continue_card: 6000

        # Step 5: Assert AddToCart was transmitted with value 11.98
        verify_pixel_addtocart:
            name: "pixel"
            url_contains: "facebook.com/tr"
            params: { ev: "AddToCart" }
            regex: "11\\.98"
            timeout: 10000

        # Step 6: Assert InitiateCheckout was transmitted with value 11.98
        verify_pixel_initiatecheckout:
            name: "pixel"
            url_contains: "facebook.com/tr"
            params: { ev: "InitiateCheckout" }
            regex: "11\\.98"
            timeout: 10000
        sleep_after_verify_ic: 1000

        # Step 7: Fill Contact info directly on checkout page
        fill_first_name: { locator: 'input[name="contact.firstName"]', value: 'auto' }
        sleep_fn: 500
        fill_last_name: { locator: 'input[name="contact.lastName"]', value: 'Guest' }
        sleep_ln: 500
        fill_phone: { locator: 'input[name="contact.phoneNumber"]', value: '+1 6502396646' }
        sleep_ph: 500
        fill_email: { locator: 'input[name="contact.email"]', value: 'linda.zhou.ext+10@1m.app' }
        sleep_em: 500

        # Step 8: Fill Credit Card information (Stripe iframe)
        fill_stripe_iframe:
            card_number: '4242424242424242'
            expiry: '02/45'
            cvc: '345'
            card_name: 'linda 4650'
            zipcode: '90021'
        sleep_card: 3000

        # Step 9: Place Order → AddPaymentInfo + Purchase fire on submit
        R_click_place_order: { role: 'button', name: 'Place order' }
        sleep_place_order: 8000

        verify_pixel_addpaymentinfo:
            name: "pixel"
            url_contains: "facebook.com/tr"
            params: { ev: "AddPaymentInfo" }
            regex: "11\\.98"
            timeout: 15000

        # Step 10: Verify the Purchase event itself was transmitted with value 11.98 USD.
        # (The old JS dumped every hooked event and asserted the substring
        # `"event":"Purchase","value":11.98` — equivalent, but it could not prove the beacon
        # ever left the page; this can.)
        verify_pixel_purchase:
            name: "pixel"
            url_contains: "facebook.com/tr"
            params: { ev: "Purchase" }
            regex: "11\\.98"
            timeout: 20000
            save_as: "pixel_purchase_urls"

    expect_result:
        description: "All pixel events fire correctly with matching value: InitiateCheckout, AddPaymentInfo, Purchase"
