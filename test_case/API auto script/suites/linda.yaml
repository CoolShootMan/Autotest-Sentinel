exclude:
  # ── 以下这条【不属于】API 日常回归，从 linda 套显式排除 ──
  # UI Automation Data Pre-configuration (staging & release, no SQL)
  #   → 它是给【UI 自动化】预制测试数据的 API 脚本（用户/event/ticket/product/post/coupon
  #     等），由 main.py 在跑 UI 用例之前单独执行（专用套 suites/ui_automation_prefill.yaml）。
  #   注意：该用例自身带 suite:linda 标签，故这里用 case_ids 显式排除，
  #   防止将来若把 linda 套改回按标签选择时，它又被带回本次回归。
  case_ids:
  - test_ui_prefill_data_configuration
