name: ui-automation-prefill
description: >-
  UI 自动化的 API 预制脚本 —— 在 main.py 跑 UI 用例【之前】执行，为 UI 自动化准备
  测试数据（用户 / event / ticket / product / post / coupon 等）。
  该用例已从 suites/linda.yaml 显式排除（它不属于 API 日常回归），改由本套单独驱动。
  main.py 会在跑 UI pytest 之前调用：run_suite.py suites/ui_automation_prefill.yaml
include:
  names:
  - UI Automation Data Pre-configuration (staging & release, no SQL)
pytest_args:
- -v
# tee-sys：既保留 pytest 的捕获（失败时仍能看到完整的 Captured 段落），又把输出实时
# 透传到终端。原因：框架日志（core/logging_util.py）用 propagate=False + 自建
# StreamHandler，pytest 的 --log-cli-level 收不到这些记录，默认捕获下「预制内的
# DB 步骤日志」（如 step 76 的 alias 写入与影响行数）在通过时会被吞掉。
- --capture=tee-sys
