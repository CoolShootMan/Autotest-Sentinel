# Per-case variables for the UI Prefill data-configuration suite.
#
# 本用例只做**前置造数**，不验证业务；因此这里只声明它自己的「运行时槽位」
# （事件/帖子/票种/product/variant/category 等 id，由 ctx.extract 在执行过程中写入）。
# 所有键在上层 config/environments/*.yaml 里当前都是空串，声明为 '' 不改变任何行为；
# 真正需要固定的值（账号密码、客户端密钥等）继续留在 env/*.yaml 或 .env，不在此重复。
#
# 命名空间约定（与原 Apifox 集合保持一致）：
#   venue_map_*        venue map 场景专用：event / post / ticket / product / variant id
#   categoryId_*       merchant/product/search 返回的座位分类 id
#   venueUnitCategoryId_* / ticketId_*   Apifox 原始变量名，保留以兼容历史数据
