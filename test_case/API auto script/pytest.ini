[pytest]
# Independent config for the API automation project.
# Overrides the parent UI Automation pytest.ini (which targets test_ui.py only).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
norecursedirs = .git .pytest_cache __pycache__ _apifox_export suites data recordings allure-results allure-report

# Registered markers.  folder_<slug> and case_<id> are generated dynamically from
# the Apifox folder tree / case ids, so unknown-marker warnings are silenced below.
markers =
    p0: Apifox priority P0
    p1: Apifox priority P1
    p2: Apifox priority P2
    smoke: smoke suite
    readonly: read-only cases (safe to run against shared environments)

filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnknownMarkWarning
